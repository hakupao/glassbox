# Public snapshot settings — example with made-up values.
# The real file is .local/public.local.toml (gitignored); hub/export.py and
# scripts/verify_public.py both read it. A missing file is an error. Unknown keys are refused.
# --no-config (fabricated examples only) means: nothing allowlisted, every name masked,
# no commit links, private titles "prefix-only", nothing hidden.
# codes must not appear on the private word list or equal a private name.

# Commit titles of private repos (CONTRACT §3 rule 5):
#   "prefix-only" — keep only a conventional-commit type such as "fix:" (default, owner's decision 2026-11-17)
#   "redacted"    — keep the title after regex scrubbing and keyword blocking
privateTitles = "prefix-only"

# Blocks that are not published at all; their value becomes [] (rule 7).
# Any of: quota, activity, machines, services, runtimes, tailnet, jobs, byProject
hidden = ["tailnet"]

# Words removed from every commit title (case, "-", "_", "." and spaces ignored for
# words of 5+ characters). The gate also rejects the snapshot if one survives.
keywords = ["project-nightjar", "ACME-42"]

# Public GitHub repos that should still be treated as private (project blacklist):
# masked name, merged into "私有项目", no hash / branch / link.
privateProjects = ["dotfiles-sandbox"]

# Machine and account codes besides single capital letters (A–Z).
codes = []

# Commit links must point to https://github.com/<owner>/<public repo>/commit/<hash>.
githubOwners = ["example-owner"]

# Commit author shown on public commits (S17 R09): the hub's GitHub login, and only if it is
# listed here. Anything else, and every private commit, gets author = null. Missing or [] means
# no author is published. Entries must be GitHub logins.
authors = ["example-owner"]

# Branch parts that may be public (R10, owner's decision D4). A telling part of a private branch
# name (e.g. "example-owner" of "example-owner/topic") is a private name unless it spells a public
# repo name or is listed here. Each entry is split on - / _ like a branch name and every part is
# exempt ("IT-Passport-Learning" exempts "Passport" and "Learning"). A listed word that is also a
# private repo name, term or keyword stays private, and so does a part that is a component of one
# (listing "Falcon-Tools" frees "tools" but not the "falcon" of a private "falcon-ledger").
# Usually: your GitHub login, if your branches start with it. Unlisted, the login is masked and the author and commit links are dropped.
branchFragments = ["example-owner"]

# Per-field allowlists for Text values (rule 2). A value not listed here is masked.
# Names of public GitHub repos are added to activity[].repo and today.byProject[].project
# automatically, and clean branch names of public commits to activity[].branch.
[allow]
"services[].name" = ["gitea", "status-page"]
"jobs[].name" = ["nightly-backup"]
"machines[].label" = []
"tailnet[].name" = []

# Per-term match modes for the private word list live in .local/redact_terms.local.json,
# next to the terms themselves, as a separate key (the "terms" array stays plain strings):
#   {"terms": ["..."], "allow": ["..."], "match": {"ab": "substring", "longword": "word"}}
