<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>glassbox · background library</title>
<style>
/* tokens and shell classes are copied from web/styles.css (S17 tokens) via s17-bg-a.html; only #art and .mk/.rot differ */
:root{
  --bg:#14171c; --panel:rgba(53,60,72,.75); --blur:3px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --fs-1:15px; --fs-2:13px; --fs-3:11.5px; --fw-1:600; --fw-2:400; --lh-1:1.4; --lh-2:1.55;
  --tabbar-h:56px;
  --sig-info:#6c97d6; --ink-1:#efeadd; --ink-2:#d8d3c4; --ink-3:#a6a297; --or:#dba843;
  --sig-bad:#e0645a; --sig-ok:#79b98a; --sig-warn:#e3894d; --sig-vio:#a48ee0;
  --line:rgba(216,211,196,.16); --line-soft:rgba(216,211,196,.09);
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink-2);font:14px/var(--lh-2) var(--sans);overflow-x:hidden;background:var(--bg);-webkit-font-smoothing:antialiased}
svg{display:block} a{color:inherit} button{font:inherit;color:inherit}
.in{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 var(--s5)}
@media (max-width:640px){.in{padding:0 var(--s4)}}
#art{position:fixed;left:0;right:0;bottom:0;width:100%;z-index:0;pointer-events:none;height:62vh;-webkit-mask-image:linear-gradient(to top,#000 0%,#000 14%,rgba(0,0,0,.55) 46%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 14%,rgba(0,0,0,.55) 46%,transparent 100%)}@media (max-width:640px){#art{height:46vh}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 22px;padding:var(--s4) 0 14px}
.brand{font:700 19px var(--mono);color:var(--ink-1);letter-spacing:.02em;text-decoration:none}
.nav{display:flex;gap:2px;min-width:0}
.nav a{display:flex;align-items:baseline;gap:6px;padding:5px 10px;font:500 var(--fs-2) var(--sans);color:var(--ink-3);text-decoration:none;border:1px solid transparent;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ink-1);border-color:var(--line);background:var(--panel)}
.meta{display:flex;gap:var(--s2);align-items:center;font:12px var(--mono);color:var(--ink-3);flex-wrap:wrap;justify-content:flex-end}
.chip{color:var(--bg);background:var(--sig-info);padding:2px var(--s2);font-weight:var(--fw-1);white-space:nowrap}
.chip.line{background:none;color:var(--ink-3);border:1px solid var(--line);font-weight:var(--fw-2)}
.pn{background:var(--panel);border:1px solid var(--line);padding:var(--s4) 18px 18px;margin-bottom:10px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-bottom:14px}
.ph h2{margin:0;font:var(--fw-1) var(--fs-1) var(--sans);color:var(--ink-1)}
.ph .r{font:12px var(--mono);color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:7fr 5fr;gap:10px;margin-bottom:10px}
.grid2>.pn{margin-bottom:0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}.grid2>.pn{margin-bottom:0}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis>div{padding:0 18px;border-left:1px solid var(--line-soft);min-width:0}
.kpis>div:first-child{padding-left:0;border-left:0}
.lab{font:var(--fs-3) var(--sans);color:var(--ink-3);margin-bottom:2px}
.val{font:var(--fw-1) 28px/1.2 var(--mono);color:var(--ink-1);font-variant-numeric:tabular-nums;white-space:nowrap}
.val.c{color:var(--sig-info)} .val.o{color:var(--or)} .val.g{color:var(--sig-ok)}
.sub{font:12px var(--mono);color:var(--ink-3)}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr;row-gap:var(--s4)}.kpis>div{padding:0 0 0 14px}.kpis>div:nth-child(odd){padding-left:0;border-left:0}.val{font-size:20px}}
.qh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.qh b{font-weight:500;color:var(--ink-2)}
.qh .val{font-size:22px}
.qbar{margin:var(--s2) 0 6px;height:6px;background:var(--line-soft);position:relative}
.qbar i{position:absolute;left:0;top:0;bottom:0}
.qbar u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.q{margin-bottom:var(--s3)} .q:last-child{margin-bottom:0}
.bd{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);padding:0 6px;line-height:17px;border:1px solid color-mix(in srgb,currentColor 34%,transparent);background:color-mix(in srgb,currentColor 12%,transparent)}
.row{display:flex;gap:var(--s3);align-items:baseline;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13px}
.row:first-of-type{border-top:0}
.row .t{font:11.5px var(--mono);color:var(--ink-3);flex:none;width:44px}
.row .m{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.cap{display:flex;justify-content:space-between;gap:var(--s3);font:12px var(--mono);color:var(--ink-3);padding:6px 0 0}
@media (max-width:640px){.cap{flex-direction:column;gap:2px}}
.tail{height:34vh}
.tabs{display:none}
@media (max-width:640px){
  .top .nav{display:none}
  body{padding-bottom:calc(var(--tabbar-h) + var(--s2) + env(safe-area-inset-bottom))}
  .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:70;padding-bottom:env(safe-area-inset-bottom);
    background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);min-width:0;height:var(--tabbar-h);color:var(--ink-3);text-decoration:none;font:var(--fs-3) var(--sans)}
  .tabs a[aria-current="page"]{color:var(--ink-1)}
  .tabs a[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--ink-1)}
  .tabs svg{fill:currentColor}
}
/* mockup-only: template switcher, date probe, motion switch, draw-cost meter, rotation sheet */
.mk{position:fixed;left:10px;bottom:10px;z-index:80;display:flex;flex-wrap:wrap;gap:6px var(--s2);align-items:center;max-width:calc(100vw - 20px);font:11px var(--mono);color:var(--ink-3);background:rgba(20,23,28,.9);border:1px solid var(--line);padding:4px 8px}
.mk button,.mk select,.mk input,.mk summary{background:none;border:1px solid var(--line);color:var(--ink-1);padding:1px 6px;font:11px var(--mono);cursor:pointer;border-radius:0}
.mk select option{background:#1b1f26}
.mk input[type=date]{color-scheme:dark;padding:0 4px}
.mk button[aria-pressed="true"]{border-color:var(--sig-info);color:var(--sig-info)}
.mk :is(button,select,input,summary):focus-visible{outline:1px solid var(--sig-info);outline-offset:1px}
.mk details{position:relative}
.mk summary{list-style:none} .mk summary::-webkit-details-marker{display:none}
.mk details[open] summary{border-color:var(--sig-info);color:var(--sig-info)}
.rot{position:fixed;left:10px;bottom:46px;width:min(520px,calc(100vw - 20px));background:rgba(20,23,28,.96);border:1px solid var(--line);padding:10px 12px;color:var(--ink-2);font:11.5px/1.55 var(--mono);cursor:default}
.rot h3{margin:0 0 4px;font:600 12px var(--sans);color:var(--ink-1)}
.rot p{margin:0 0 8px;color:var(--ink-3)}
.rot table{border-collapse:collapse;width:100%;margin-bottom:8px}
.rot td{padding:1px 8px 1px 0;vertical-align:top;border-top:1px solid var(--line-soft)}
.rot td:first-child{color:var(--ink-3);white-space:nowrap;width:1%}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;margin-bottom:8px}
.strip span{display:flex;flex-direction:column;align-items:center;padding:2px 0;border:1px solid var(--line-soft);color:var(--ink-3);font-size:10px;line-height:1.3}
.strip span b{font-weight:600;color:var(--ink-1);font-size:11.5px}
.strip span.on{border-color:var(--sig-info)} .strip span.on b{color:var(--sig-info)}
@media (max-width:640px){.mk{bottom:calc(var(--tabbar-h) + 8px + env(safe-area-inset-bottom))}.mk .wide{display:none}.rot{bottom:calc(var(--tabbar-h) + 82px + env(safe-area-inset-bottom));max-height:60vh;overflow:auto}}
</style>
</head>
<body>
<canvas id="art" role="img" aria-label="今日画作"></canvas>
<div class="in">
  <header class="top">
    <a class="brand" href="#">glassbox</a>
    <nav class="nav" aria-label="main">
      <a href="#" aria-current="page">总览</a><a href="#">用量</a><a href="#">代码</a><a href="#">机器</a><a href="#">服务</a>
    </nav>
    <div class="meta"><span class="chip">公开</span><span class="chip line">11-17 10:30</span><span id="clock">10:30:08</span></div>
  </header>
  <main id="view">
    <section class="pn hero">
      <div class="ph"><h2>今日</h2><span class="r">AI 用量 · 虚构数据</span></div>
      <div class="kpis">
        <div><div class="lab">Token</div><div class="val c">48.1M</div><div class="sub">缓存命中 91.2%</div></div>
        <div><div class="lab">请求</div><div class="val">1,284</div><div class="sub">23 个会话</div></div>
        <div><div class="lab">费用 (API 等价)</div><div class="val o">$48.7</div><div class="sub">本月 $812</div></div>
        <div><div class="lab">Claude Code</div><div class="val c">80%</div><div class="sub">1,032 次</div></div>
        <div><div class="lab">Codex</div><div class="val o">20%</div><div class="sub">252 次</div></div>
      </div>
    </section>
    <div class="grid2">
      <section class="pn"><div class="ph"><h2>近 30 天费用</h2><span class="r">$ / 天</span></div><div id="bars"></div></section>
      <section class="pn"><div class="ph"><h2>额度</h2><span class="r">按时间进度</span></div><div id="quota"></div></section>
    </div>
    <section class="pn"><div class="ph"><h2>最近动态</h2><span class="r">推送与提交</span></div><div id="acts"></div></section>
  </main>
  <div class="cap"><span id="cap0"></span><span id="capMid"></span><span id="cap1"></span></div>
  <div class="tail"></div>
</div>
<nav class="tabs" aria-label="main" id="tabs"></nav>
<div class="mk">
  <span class="wide">mockup lib</span>
  <label class="sr" for="mkTpl">模板</label><select id="mkTpl"></select>
  <label class="sr" for="mkDate">日期</label><input id="mkDate" type="date">
  <button id="mkMotion" aria-pressed="true">动效 开</button>
  <details id="mkRot"><summary>轮换</summary><div class="rot" id="rot"></div></details>
  <span id="mkCost"></span>
</div>
<script src="sample-data.js"></script>
<script>
const GB = window.GB, $ = id => document.getElementById(id);
/* ---------- page shell content (fabricated), same as s17-bg-a ---------- */
(function(){
  const T = GB.trend30d, X = GB.trend30dCodex, mx = Math.max(...T), W = 640, H = 84, n = T.length, bw = W / n;
  $('bars').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="84" role="img" aria-label="近 30 天费用">` +
    T.map((v, i) => { const h = v / mx * (H - 6), hx = X[i] / mx * (H - 6), x = i * bw + 1.5;
      return `<rect x="${x}" y="${H - h}" width="${bw - 3}" height="${h - hx}" fill="#6c97d6" opacity="${i === n - 1 ? 1 : .62}"/><rect x="${x}" y="${H - hx}" width="${bw - 3}" height="${hx}" fill="#dba843" opacity="${i === n - 1 ? 1 : .7}"/>`; }).join('') + `</svg>`;
  $('quota').innerHTML = GB.quota.slice(0, 2).map(q => { const mark = Math.min(98, Math.max(2, q.usedPct / (1 + q.pace)));
    const col = q.agent === 'Codex' ? 'var(--or)' : 'var(--sig-info)';
    return `<div class="q"><div class="qh"><b>${q.agent} · ${q.window}</b><span class="val" style="color:${col}">${q.usedPct}%</span></div><div class="qbar"><i style="width:${q.usedPct}%;background:${col}"></i><u style="left:${mark}%"></u></div><div class="sub">${q.pace > 0 ? '快于时间进度 ' + Math.round(q.pace * 100) + '%' : '慢于时间进度 ' + Math.round(-q.pace * 100) + '%'}</div></div>`; }).join('');
  $('acts').innerHTML = GB.activity.slice(0, 3).map(a => `<div class="row"><span class="t">${a.t.slice(11, 16)}</span><span class="bd" style="color:${a.public ? 'var(--sig-info)' : 'var(--ink-3)'}">${a.public ? a.repo : '私有项目'}</span><span class="m">${a.public ? a.title : '私有提交'}</span></div>`).join('');
  const ic = '<svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6"/><rect x="11" y="3" width="6" height="6" opacity=".6"/><rect x="3" y="11" width="6" height="6" opacity=".6"/><rect x="11" y="11" width="6" height="6"/></svg>';
  $('tabs').innerHTML = ['总览', '用量', '代码', '机器', '服务'].map((l, i) => `<a href="#"${i === 0 ? ' aria-current="page"' : ''}>${ic}<span>${l}</span></a>`).join('');
})();

/* ================= shared kit ================= */
const BLUE = [108, 151, 214], OR = [219, 168, 67], LV = 9, P = 5, TAU = Math.PI * 2;
const qs = new URLSearchParams(location.search);
const FROZEN = qs.has('t') ? (parseFloat(qs.get('t')) || 0) : null;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
/* integer avalanche mix (lowbias32): consecutive days land far apart */
function mix(x){ x |= 0; x ^= x >>> 16; x = Math.imul(x, 0x7feb352d); x ^= x >>> 15; x = Math.imul(x, 0x846ca68b); x ^= x >>> 16; return x >>> 0; }
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const sstep = (a, b, x) => smooth((x - a) / (b - a));
const fmtN = n => Math.round(n).toLocaleString('en-US');
const fmtTok = v => v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : fmtN(v);

/* ---------- data inputs: identical for every template ---------- */
const TD = GB.today, tk = TD.tokens, totTok = tk.input + tk.output + tk.cacheRead + tk.cacheWrite + tk.reasoning;
const totals = GB.trend30d, nT = totals.length, maxT = Math.max(...totals);
function smoothSeries(a){ const w = [1, 2, 3, 2, 1], out = a.map((_, i) => { let s = 0, k = 0; w.forEach((wv, j) => { const x = Math.max(0, Math.min(a.length - 1, i + j - 2)); s += a[x] * wv; k += wv; }); return s / k; });
  out[out.length - 1] = a[a.length - 1] * .6 + out[out.length - 1] * .4; return out; }
const smTot = smoothSeries(totals), mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const D = {
  tok: totTok,
  nPart: Math.round(totTok / 1e6 * 22),                     /* tokens -> particle budget (same rate as A) */
  share: TD.byAgent[0].requests / TD.requests,              /* Claude Code request share -> colour split */
  curve: smTot.map(v => v / maxT),                          /* 30-day curve, 0..1 */
  curveMean: mean(smTot) / maxT,
  trendK: clamp01((mean(totals.slice(-7)) / mean(totals) - .7) / .8),  /* last 7 days vs 30-day mean -> one shape knob, 0..1 */
  cache: TD.cacheHitRate, jitter: (1 - TD.cacheHitRate) * 4  /* cache hit -> calm (high) or jitter (low) */
};
const curveAt = s => { const f = clamp01(s) * (nT - 1), i = Math.min(nT - 2, Math.floor(f)), u = f - i, k = (1 - Math.cos(u * Math.PI)) / 2; return D.curve[i] + (D.curve[i + 1] - D.curve[i]) * k; };

/* ---------- date-seeded noise (rebuilt when the date changes) ---------- */
const perm = new Float32Array(65536);
function seedNoise(ymd){ const r = mulberry(ymd ^ 0x9e3779b9); for(let i = 0; i < perm.length; i++) perm[i] = r(); }
function noise(x, y){ const s_ = v => v * v * (3 - 2 * v);
  const xi = Math.floor(x), yi = Math.floor(y), xf = s_(x - xi), yf = s_(y - yi), x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
  const a = perm[y0 | x0], b = perm[y0 | x1], c = perm[y1 | x0], d = perm[y1 | x1]; return (a + (b - a) * xf) * (1 - yf) + (c + (d - c) * xf) * yf; }

/* ---------- one renderer: 5px cells, 9 levels, two colours, four cell styles ----------
   sq = square bricks (size by level), dot = round halftone dots, br = braille-like 2x4 micro dots (count by level),
   sh = shade steps, 2x2 sub-squares (count by level). Draw batches one path per (colour, level). */
const BR = [[0, 1], [1, 2], [0, 3], [1, 0], [0, 2], [1, 3], [0, 0], [1, 1]], SH = [[0, 0], [1, 1], [1, 0], [0, 1]];
class Layer{
  constructor(cols, rows){ this.cols = cols; this.rows = rows; const n = cols * rows; this.gb = new Float32Array(n); this.gc = new Uint8Array(n);
    this.bk = Array.from({length: 2 * LV}, () => new Int32Array(n)); this.bc = new Int32Array(2 * LV); }
  clear(){ this.gb.fill(0); }
  put(x, y, b, c){ x = Math.round(x); y = Math.round(y); if(x < 0 || y < 0 || x >= this.cols || y >= this.rows) return; const k = x * this.rows + y; if(b > this.gb[k]){ this.gb[k] = Math.min(1, b); this.gc[k] = c; } }
  draw(ax, gain, halo, style){
    const {gb, gc, bk, bc, rows} = this; bc.fill(0);
    for(let k = 0; k < gb.length; k++){ const a = gb[k]; if(a < .05) continue; const key = gc[k] * LV + Math.min(LV, Math.ceil(a * LV)) - 1; bk[key][bc[key]++] = k; }
    for(let key = 0; key < 2 * LV; key++){
      const n = bc[key]; if(!n) continue;
      const col = key >= LV ? OR : BLUE, f = (key % LV + 1) / LV, a = bk[key], rgb = `${col[0]},${col[1]},${col[2]}`;
      if(halo && f > .85){   /* soft halo: one larger faint square per bright cell, no shadowBlur */
        const hs = P * 2.2, ho = (P - hs) / 2; ax.fillStyle = `rgba(${rgb},${(.1 * gain).toFixed(3)})`; ax.beginPath();
        if(style === 'dot') for(let i = 0; i < n; i++){ const k = a[i], x = ((k / rows) | 0) * P + P / 2, y = (k % rows) * P + P / 2; ax.moveTo(x + hs / 2, y); ax.arc(x, y, hs / 2, 0, TAU); }
        else for(let i = 0; i < n; i++){ const k = a[i]; ax.rect(((k / rows) | 0) * P + ho, (k % rows) * P + ho, hs, hs); }
        ax.fill(); }
      ax.beginPath();
      if(style === 'dot'){
        const r = P * (.17 + .33 * f); ax.fillStyle = `rgba(${rgb},${((.2 + .66 * f) * gain).toFixed(3)})`;
        if(r < 1.45) for(let i = 0; i < n; i++){ const k = a[i]; ax.rect(((k / rows) | 0) * P + P / 2 - r, (k % rows) * P + P / 2 - r, 2 * r, 2 * r); }   /* tiny dots: a square reads the same and is far cheaper */
        else for(let i = 0; i < n; i++){ const k = a[i], x = ((k / rows) | 0) * P + P / 2, y = (k % rows) * P + P / 2; ax.moveTo(x + r, y); ax.arc(x, y, r, 0, TAU); }
      } else if(style === 'br'){
        const m = Math.max(1, Math.round(f * 8)); ax.fillStyle = `rgba(${rgb},${((.34 + .6 * f) * gain).toFixed(3)})`;

/* ================= templates =================

/* 06 topography: contour lines of a slowly morphing height map, tilted away from the viewer. Elevation above the (1 - share) quantile is amber,
   so Codex owns exactly its share of the map. Contour count = trend, morph speed = cache miss, tokens = walkers along the contours. */
function tTopo(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);
  const Hg = new Float32Array(cols * rows), levels = 7 + Math.round(D.trendK * 6), samp = new Float32Array(1500), sidx = Array.from({length: 1500}, () => (X.rnd() * cols * rows) | 0);

  const dir = (x, y, v) => { const k = at(x, y), gx = Hg[k + rows] - Hg[k - rows], gy = Hg[k + 1] - Hg[k - 1], g = Math.hypot(gx, gy) || 1; v[0] = -gy / g; v[1] = gx / g * .7; };
  const parts = Array.from({length: Math.round(D.nPart * .3)}, () => ({k: (X.rnd() * K) | 0, ph: X.rnd(), v: 3 + 3 * X.rnd()}));
  const PN = phone ? Math.round(parts.length * .5) : parts.length;
  const tick = ticker(.16, tm => {
    const t = tm * .01 * sp * (1 + D.jitter * .6);
    for(let y = 0; y < rows; y++){ const yn = y / rows, v = 3.1 / (yn + .55) - t, sc = (1 + 1.1 * (1 - yn)) * ws;
      for(let c = 0; c < cols; c++){ const u = (c - cols * .5) / rows * sc * 1.1 + u0;
        let h = .62 * noise(u * .8, v * .8) + .28 * noise(u * 1.9 + 9, v * 1.9 + 3) + .1 * noise(u * 4.1 + 2, v * 4.1 - 7);

/* 07 planet: a halftone gas giant rising from the bottom edge, bands turning slowly, the terminator sweeping across.
   Polar cap above the latitude whose area = (1 - share) is amber; band turbulence = trend; band jitter = cache miss; tokens = drifting stars. */
function tPlanet(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);
  const R = rows * (phone ? .66 : .76), cx = cols * (phone ? .6 : .68 + .1 * p.off), cy = rows + R * (phone ? .28 : .5);
  const tilt = .32 + .12 * p.tilt, ct = Math.cos(tilt), st = Math.sin(tilt), sinCap = 2 * D.share - 1, turb = .6 + 1.6 * D.trendK;
  const stars = Array.from({length: Math.round(D.nPart * .3)}, () => ({x: X.rnd(), y: Math.pow(X.rnd(), .7), d: .3 + X.rnd(), ph: X.rnd() * TAU, cx: X.rnd() > D.share}));
  const PN = phone ? Math.round(stars.length * .5) : stars.length;

    TL.clear(); const spin = tm * .018 * sp + p.yaw, la = tm * .02 * sp + 2.2 + p.off, Lx = Math.cos(la), Lz = Math.sin(la) * .9 + .25, Ly = .35, Ln = Math.hypot(Lx, Ly, Lz);

        const band = .5 + .5 * Math.sin(lat * 9 + (noise(lon * 1.6 + 20, lat * 5) - .5) * turb * 2.4 + D.jitter * .2 * Math.sin(lon * 6 + tm * .3));

/* 08 aurora: one curtain hung in depth, a ribbon whose folds swing toward and away from the viewer; rays rise from a bright hem and fade.
   Folds seen edge-on read brighter. Fold depth = trend; the fringe above the height where the ray light falls to (1 - share) is amber;
   cache miss = ray flicker; tokens = motes drifting sideways along the hem. */
function tAurora(env, X){

    const x = (s * 2 - 1) * Wd, hb = .9 + .2 * Math.sin(s * 3.1 + tm * .04 * sp); o[0] = (x / (z * kx) * .5 + .5) * cols; o[1] = yh - hb / z * focal; o[2] = 3.0 / z * focal; o[3] = z; };
  const v = [0, 0, 0, 0], motes = Array.from({length: Math.round(D.nPart * .2)}, () => ({s: X.rnd(), h: Math.pow(X.rnd(), 3), v: .5 + X.rnd(), ph: X.rnd() * TAU, cx: X.rnd() > D.share}));
  const PN = phone ? Math.round(motes.length * .5) : motes.length;
  const tick = ticker(.11, tm => {
    TL.clear(); const fl = (.18 + D.jitter * .3) * sp; let px = null;
    for(let c = 0; c < cols; c += 2) TL.put(c, yh, .1 + .07 * noise(c * .1, 3), 0);                                     /* horizon */
    for(let i = 0; i < NS; i++){ const s = i / (NS - 1); rib(s, tm, v); const sx = v[0], hem = v[1], L = v[2], z = v[3];
      const step = px === null ? 1 : Math.abs(sx - px); px = sx; if(sx < -L * slant - 2 || sx > cols + 2) continue;
      const edge = Math.min(1.5, .55 + .45 / (step * 2.5 + .3)), near = .55 + .45 * sstep(z0 + A * 1.4, z0 - A, z);

        if(b > .05) TL.put(sx + Math.max(0, h) * slant, y, Math.min(.8, b * .8), h > hAmb ? 1 : 0); } }
    TL.draw(off.begin(), .95, false, 'br');
  });
  return tm => {
    tick(tm); off.blit(); PL.clear();
    for(let n = 0; n < PN; n++){ const q = motes[n], s = ((q.s + tm * .003 * q.v * sp) % 1 + 1) % 1; rib(s, tm, v);
      const h = q.h * v[2] * .6, y = v[1] - h + Math.sin(tm * .3 + q.ph), b = (.5 + .5 * Math.sin(tm * .5 + q.ph)) * (1 - .3 * q.h);
      if(b > .5) PL.put(v[0] + h * slant, y, b, h > v[2] * .34 * lnA || q.cx ? 1 : 0); }
    PL.draw(ax, 1, true, 'br');
  };
}

/* 08 galaxy: a two-armed spiral disk seen at a steep angle, low on the left. The arm pattern turns rigidly (a density wave), stars ride it with a
   small sway so the arms never smear. Arm winding = trend, disk thickness = cache miss, stars = tokens, star colour = split. */
function tGalaxy(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);
  const inc = 1.17 + .12 * p.tilt, ci = Math.cos(inc), si = Math.sin(inc), Rg = rows * (phone ? .62 : .95), cx = cols * (phone ? .5 : .3 + .08 * p.off), cy = rows * (phone ? .72 : .84);
  const tp = .2 + .22 * (1 - D.trendK), thick = .03 + D.jitter * .04, Om = .035 * sp;
  const stars = Array.from({length: Math.round(D.nPart * .7)}, () => { const r = .06 + Math.pow(X.rnd(), .75) * .94, arm = X.rnd() < .5 ? 0 : Math.PI, g = (X.rnd() + X.rnd() + X.rnd() - 1.5) * .5;
    return {r, th: Math.log(r) / tp + arm + g * (.35 + .4 * r), h: (X.rnd() - .5) * thick * 2, ph: X.rnd() * TAU, cx: X.rnd() > D.share}; });
  const PN = phone ? Math.round(stars.length * .5) : stars.length;
  const tick = ticker(.11, tm => {
    TL.clear(); const rot = tm * Om + p.yaw, x0 = Math.max(0, Math.floor(cx - Rg * 1.05)), x1 = Math.min(cols, Math.ceil(cx + Rg * 1.05)), y0 = Math.max(0, Math.floor(cy - Rg * ci * 1.05)), y1 = Math.min(rows, Math.ceil(cy + Rg * ci * 1.05));

      const th = Math.atan2(v, u) - rot, ph = th - Math.log(r) / tp, d = Math.cos(2 * ph), arm = Math.pow(.5 + .5 * d, 3);
      const b = (.06 + .55 * arm * (.55 + .45 * noise(u * 9 + 3, v * 9))) * Math.exp(-r * 1.9) * (1 - sstep(.8, 1.05, r)) + .85 * Math.exp(-r * r / .004);
      if(b > .05) TL.put(c, y, Math.min(.8, b * 1.4), 0); }
    TL.draw(off.begin(), .95, false, 'br');
  });
  return tm => {
    tick(tm); off.blit(); PL.clear(); const rot = tm * Om + p.yaw;
    for(let n = 0; n < PN; n++){ const q = stars[n], th = q.th + rot + .12 * Math.sin(tm * .05 + q.ph), x = q.r * Math.cos(th), y = q.r * Math.sin(th);
      const Y = y * ci - q.h * si, dep = y * si + q.h * ci, b = (.55 + .45 * Math.sin(tm * .45 + q.ph)) * (.95 - .3 * q.r) * (.85 + .15 * dep);
      if(b > .5) PL.put(cx + x * Rg, cy + Y * Rg, b, q.cx ? 1 : 0); }

/* ================= ported templates (10+) =================
   Each one below rewrites the algorithm of one ascii.rest piece for this renderer: the source's 1:2 character cells become square cells, a value the
   source computed before picking a glyph goes straight to cell brightness, and where the source only has glyphs (strokes, marks, ramps) the glyph's
   measured ink coverage becomes the brightness (INK below). Fixed seeds become the date stream, and every clock is slowed for a background. */

/* glyph density table: ink coverage of each glyph, measured once from a monospace raster and normalised to the densest glyph of the set asked for */
const INK = (() => { const cache = {}; let cx = null;
  return s => { const out = {};
    for(const ch of s){ if(!(ch in cache)){
        if(!cx){ const c = document.createElement('canvas'); c.width = 24; c.height = 40; cx = c.getContext('2d', {willReadFrequently: true}); cx.font = '32px Menlo, Consolas, monospace'; cx.textBaseline = 'top'; }
        cx.clearRect(0, 0, 24, 40); cx.fillStyle = '#fff'; cx.fillText(ch, 2, 2); const d = cx.getImageData(0, 0, 24, 40).data; let a = 0; for(let i = 3; i < d.length; i += 4) a += d[i]; cache[ch] = a; }
      out[ch] = cache[ch]; }
    const mx = Math.max(...Object.values(out)) || 1; for(const k in out) out[k] /= mx; return out; }; })();

/* 10 jellyfish.
   Adapted from ascii.rest piece 'jellyfish' (https://github.com/bas3line/ascii, MIT, Copyright (c) 2026 bas3line)
   Kept from the source: the squeeze / lift stroke, the rim that swings on a five-stroke beat, threads and mouth arms that hang from where the rim
   was a moment ago, and the bell's shade (glassy crown, thick edges, four pale horseshoes). One near jelly and two far ones; marine snow streams
   past faster while a bell pushes. Stroke period = trend; thread wobble = cache miss; snow = tokens, its colour = split. */
function tJelly(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, L = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);

  const lift = t => { const q = phs(t); return q < .4 ? easeS(q / .4) : 1 - easeS((q - .4) / .6); };

    const CX = X0 + now.x * S, RY = Y0 + now.y * 2 * S, g = j.g;

    /* threads and mouth arms: each point d rows down hangs from the rim of d * lag seconds ago */

    for(let i = 0; i < 8; i++){ const u = -.92 + 1.84 * i / 7, len = 8.5 + 3.2 * (1 - Math.abs(u)) + ((i * 3) % 5) * .8;

  const travel = t => { const k = Math.floor(t / PER), q = phs(t); return .25 * t + .9 * (k + (q < SQ ? .8 * easeS(q / SQ) : .8 + .2 * (q - SQ) / (1 - SQ))); };

  const PN = phone ? Math.round(snow.length * .5) : snow.length;
  const tick = ticker(.06, tm => { L.clear(); J.forEach(j => jelly(j, tm)); L.draw(off.begin(), .9, false, 'dot'); });

    enc: {tok: '浪尖闪光数', share: '波源振幅（橙 = Codex 波源）', trend: '波长', cache: '水面细纹'}},
  {id: 5, name: '夜路', style: 'sq', make: tRoad, n: () => Math.max(6, Math.round(D.nPart / 22)), cap: '车灯 {n} 对 = {tok} Token · 弯道 = 7 日趋势',
    enc: {tok: '车数（+ 浮尘）', share: '去向蓝 / 来向橙', trend: '道路弯度', cache: '车灯闪烁'}},
  {id: 6, name: '等高线', style: 'sq', make: tTopo, n: () => Math.round(D.nPart * .3), cap: '行者 {n} = {tok} Token · 等高线条数 = 7 日趋势',
    enc: {tok: '沿等高线的行者数', share: '高处面积（橙 = Codex 份额）', trend: '等高线条数', cache: '地形变形速度'}},
  {id: 7, name: '行星', style: 'dot', make: tPlanet, n: () => Math.round(D.nPart * .3), cap: '星点 {n} = {tok} Token · 极冠面积 = Codex 占比',
    enc: {tok: '星点数', share: '极冠面积（橙）', trend: '云带紊乱度', cache: '云带抖动'}},
  {id: 8, name: '星系', style: 'br', make: tGalaxy, n: () => Math.round(D.nPart * .7), cap: '星 {n} = {tok} Token · 旋臂缠绕 = 7 日趋势',
    enc: {tok: '星数', share: '星的颜色', trend: '旋臂缠绕度', cache: '盘面厚度'}},
  {id: 9, name: '极光', off: true, style: 'br', make: tAurora, n: () => Math.round(D.nPart * .2), cap: '光尘 {n} = {tok} Token · 帘幕褶皱 = 7 日趋势',
    enc: {tok: '光尘数', share: '帘顶橙边（亮度占比）', trend: '帘幕褶皱深度', cache: '光柱闪烁'}},
  /* 10+ ported from ascii.rest (src = piece slug; the caption credits it) */
  {id: 10, name: '水母', src: 'jellyfish', style: 'dot', make: tJelly, n: () => Math.round(D.nPart * .3), cap: '海雪 {n} = {tok} Token · 收缩节奏 = 7 日趋势',
    enc: {tok: '海雪颗粒数', share: '海雪颜色', trend: '伞盖收缩节奏', cache: '触手摆动'}},
  {id: 11, name: '金鱼', src: 'aquarium', style: 'dot', make: tFish, n: () => Math.round(D.nPart * .08), cap: '气泡 {n} = {tok} Token · 金鱼条数 = Codex 占比 · 游速 = 7 日趋势',
    enc: {tok: '气泡数', share: '金鱼（橙）与锦鲤（蓝）条数', trend: '游速', cache: '水草摆幅'}},
  {id: 12, name: '鲸', src: 'whale', style: 'sh', make: tWhale, n: () => Math.round(D.nPart * .2), cap: '水面闪光 {n} = {tok} Token · 鲸的体长 = 7 日趋势',
    enc: {tok: '水面闪光数', share: '闪光颜色', trend: '鲸的体长', cache: '海面碎浪'}},
  {id: 13, name: '椋鸟', src: 'starlings', style: 'dot', make: tFlock, n: () => Math.max(60, Math.round(D.nPart * .45)), cap: '鸟 {n} = {tok} Token · 鸟群盘旋半径 = 7 日趋势',
    enc: {tok: '鸟的只数', share: '每只鸟的颜色', trend: '鸟群盘旋半径', cache: '转向噪声'}},
  {id: 14, name: '萤火', src: 'fireflies', style: 'dot', make: tFly, n: () => Math.round(D.nPart * .11), cap: '萤火虫 {n} = {tok} Token · 闪光节拍 = 7 日趋势',
    enc: {tok: '萤火虫只数', share: '每只的光色', trend: '闪光节拍', cache: '游荡幅度'}},
  {id: 15, name: '落雪', src: 'snowfall', style: 'dot', make: tSnow, n: () => Math.round(D.nPart * .42), cap: '雪花 {n} = {tok} Token · 风力 = 7 日趋势',
    enc: {tok: '雪花片数', share: '每片的颜色', trend: '风力（雪的斜度）', cache: '阵风摇摆'}},
  {id: 16, name: '长涌', src: 'sea-swell', style: 'br', make: tSwell, n: () => Math.round(D.nPart * .5), cap: '水下碎光 {n} = {tok} Token · 涌浪高度 = 7 日趋势',
    enc: {tok: '水下碎光数', share: '碎光颜色', trend: '涌浪高度', cache: '逆向小浪'}},
  {id: 17, name: '雨池', src: 'pond-ripples', style: 'br', make: tPond, n: () => Math.round(D.nPart / 22), cap: '每分钟雨滴 {n} = {tok} Token · 波纹扩散速度 = 7 日趋势',
    enc: {tok: '每分钟落下的雨滴', share: '每滴雨的波纹颜色', trend: '波纹扩散速度', cache: '波纹抖动'}},
  {id: 18, name: '黑洞', src: 'black-hole', style: 'dot', make: tHole, n: () => Math.round(D.nPart * .25), cap: '背景星 {n} = {tok} Token · 橙色内环 = Codex 占比的盘面光',
    enc: {tok: '背景星数', share: '内环（橙）占盘面光的比例', trend: '视角高度', cache: '气体闪烁'}},
  {id: 19, name: '月相', src: 'moon-phases', style: 'dot', make: tMoon, n: () => Math.round(D.nPart * .2), cap: '星 {n} = {tok} Token · 月相 = 当天真实月相 · 月亮高度 = 7 日趋势',
    enc: {tok: '星数', share: '星的颜色', trend: '月亮高度', cache: '星的闪烁'}},
  {id: 20, name: '天灯', src: 'lantern-lake', style: 'sq', make: tLantern, n: () => Math.round(D.nPart * .14), cap: '天灯 {n} = {tok} Token · 风向倾斜 = 7 日趋势',
    enc: {tok: '天灯盏数', share: '每盏灯的颜色', trend: '风把灯群吹斜的程度', cache: '倒影抖动'}}
];
const STYLE_NAME = {sq: '方块', dot: '圆点', br: '盲文点', sh: '明暗格'};
const ENABLED = TPL.filter(t => !t.off).map(t => t.id);   /* 09 aurora is kept but not enabled (reads as a skyline); 10-20 (ascii.rest ports) are enabled */

/* ---------- rotation: stateless, no two days in a row repeat ----------
   day = UTC day number. Even day: ENABLED[h(day) % N]. Odd day: pick from ENABLED minus both neighbours' (even-day) picks.
   Each pick only reads its neighbours' raw picks, so any date is computed in O(1) with no epoch walk. */
const hDay = d => mix(d * 0x9e3779b1 ^ 0x51ed27);
function pickDay(d){ const L = ENABLED, N = L.length;
  if(N === 1) return L[0]; if(N === 2) return L[((d % 2) + 2) % 2];
  if(d % 2 === 0) return L[hDay(d) % N];
  const a = L[hDay(d - 1) % N], b = L[hDay(d + 1) % N], c = L.filter(x => x !== a && x !== b); return c[hDay(d) % c.length]; }
const dayOf = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const dateOf = n => new Date(n * 864e5).toISOString().slice(0, 10);
function params(day, id){ const ymd = parseInt(dateOf(day).replace(/-/g, ''), 10), S = mulberry(mix(day * 31 + id * 7919));
  return {ymd, seed: mix(ymd), speed: .82 + .36 * S(), off: S() * 2 - 1, tilt: S() * 2 - 1, yaw: S() * TAU}; }
/* self-check over two years: adjacent repeats must be 0 */
const ROT_CHECK = (() => { const d0 = dayOf('2026-01-01'), cnt = {}; let rep = 0, prev = null;
  for(let d = d0; d < d0 + 730; d++){ const t = pickDay(d); cnt[t] = (cnt[t] || 0) + 1; if(t === prev) rep++; prev = t; }
  if(rep) console.error('rotation: adjacent repeats', rep); return {rep, cnt}; })();

/* ---------- mount: swappable factory, 40ms frame cap, hidden-tab pause, motion switch, static frame, draw-cost meter ---------- */
const cv = $('art'), ax = cv.getContext('2d');
const S_ = {make: null, env: null, draw: null, lastTm: 14, on: FROZEN === null && !REDUCE, ms: [], err: null};
function layout(){ const W = cv.clientWidth, H = cv.clientHeight; S_.draw = null; if(!W || !H || !S_.make) return;
  const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  S_.env = {cv, ax, W, H, dpr, cols: Math.floor(W / P), rows: Math.floor(H / P), P, phone: W < 640};
  try { S_.draw = S_.make(S_.env); S_.err = null; } catch(e){ S_.err = e; console.error(e); $('mkCost').textContent = 'error: ' + e.message; } }
function paint(tm){ if(!S_.draw) layout(); if(!S_.draw) return; S_.lastTm = tm; const t0 = performance.now();
  ax.setTransform(S_.env.dpr, 0, 0, S_.env.dpr, 0, 0); ax.clearRect(0, 0, S_.env.W, S_.env.H);
  try { S_.draw(tm); } catch(e){ S_.err = e; S_.draw = null; console.error(e); $('mkCost').textContent = 'error: ' + e.message; return; }
  S_.ms.push(performance.now() - t0); if(S_.ms.length > 40) S_.ms.shift(); }
const t00 = performance.now(), btn = $('mkMotion'); let lastF = 0, lastShow = 0;
function frame(ts){ requestAnimationFrame(frame); if(!S_.on || document.hidden || ts - lastF < 40) return; lastF = ts; paint((performance.now() - t00) / 1000 + 6);
  if(ts - lastShow > 800 && S_.ms.length && !S_.err){ lastShow = ts; $('mkCost').textContent = 'draw ' + (S_.ms.reduce((a, b) => a + b, 0) / S_.ms.length).toFixed(1) + ' ms'; } }
btn.addEventListener('click', () => { if(btn.disabled) return; S_.on = !S_.on; btn.setAttribute('aria-pressed', S_.on); btn.textContent = S_.on ? '动效 开' : '动效 关'; });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); paint(S_.lastTm); }, 120); });
window.__artCost = () => S_.ms.reduce((a, b) => a + b, 0) / Math.max(1, S_.ms.length);
window.__paint = paint;
/* synchronous bench for verification: n frames 40ms apart, includes the periodic static re-raster */
window.__bench = (n = 150) => { const t = []; for(let i = 0; i < n; i++){ const a = performance.now(); ax.setTransform(S_.env.dpr, 0, 0, S_.env.dpr, 0, 0); ax.clearRect(0, 0, S_.env.W, S_.env.H); S_.draw(6 + i * .04); t.push(performance.now() - a); }
  t.sort((a, b) => a - b); return {mean: t.reduce((a, b) => a + b, 0) / n, p95: t[Math.floor(n * .95)], max: t[n - 1]}; };

/* ---------- selection: date -> template + params; ?art=N or the switcher overrides the date's pick ---------- */
const DEFAULT_DATE = GB.generatedAt.slice(0, 10);
const cur = {date: qs.get('date') || DEFAULT_DATE, art: qs.has('art') ? parseInt(qs.get('art'), 10) : null};
const sel = $('mkTpl'), din = $('mkDate');
sel.innerHTML = '<option value="">按日期</option>' + TPL.map(t => `<option value="${t.id}">${String(t.id).padStart(2, '0')} ${t.name}${t.off ? '（未启用）' : ''}</option>`).join('');
const fmtP = (pr, t) => `速度 ×${pr.speed.toFixed(2)} · 机位 ${pr.off >= 0 ? '+' : ''}${pr.off.toFixed(2)} · 俯仰 ${pr.tilt >= 0 ? '+' : ''}${pr.tilt.toFixed(2)} · 相位 ${(pr.yaw / TAU * 360).toFixed(0)}°`;
function apply(){
  const day = dayOf(cur.date), auto = pickDay(day), id = cur.art && TPL[cur.art - 1] ? cur.art : auto, t = TPL[id - 1], pr = params(day, id);
  seedNoise(pr.ymd);
  const X = {D, p: pr, rnd: mulberry(pr.ymd)};      /* particles: own stream, so data changes never move the camera */
  S_.make = env => t.make(env, X); S_.ms = []; S_.err = null; layout();
  if(FROZEN !== null || REDUCE) paint(FROZEN !== null ? FROZEN + 6 : 14); else paint(S_.lastTm);
  const n = t.n(), tag = String(id).padStart(2, '0');
  $('cap0').textContent = `今日画作 #${pr.ymd} · ${tag} ${t.name}${t.src ? ' · 改编自 ascii.rest「' + t.src + '」' : ''}${id !== auto ? '（手动）' : ''}`;
  $('capMid').innerHTML = `<span style="color:rgb(${BLUE})">■</span> Claude Code ${Math.round(D.share * 100)}%&emsp;<span style="color:rgb(${OR})">■</span> Codex ${Math.round((1 - D.share) * 100)}%`;
  $('cap1').textContent = t.cap.replace('{n}', fmtN(n)).replace('{tok}', fmtTok(D.tok));
  cv.setAttribute('aria-label', `今日画作 ${t.name}：${t.enc.tok}对应今日 Token，${t.enc.share}对应 Claude Code 与 Codex 请求占比，${t.enc.trend}`);
  sel.value = cur.art ? String(id) : ''; din.value = cur.date;
  const strip = []; for(let d = day - 6; d <= day + 7; d++){ const k = pickDay(d), ds = dateOf(d); strip.push(`<span class="${d === day ? 'on' : ''}" title="${ds} → ${TPL[k - 1].name}"><b>${String(k).padStart(2, '0')}</b>${ds.slice(5)}</span>`); }
  $('rot').innerHTML = `<h3>${cur.date} → ${String(auto).padStart(2, '0')} ${TPL[auto - 1].name}</h3>
    <p>日序号 ${day}（${day % 2 ? '奇数' : '偶数'}）。偶数日：mix(日序号) 对 ${ENABLED.length} 个启用模板取余；奇数日：去掉前后两天的模板后再取余，所以相邻两天一定不同。参数（速度、机位、俯仰、相位）只由日期种子决定，数据只改光点数、颜色比例、形状和抖动。</p>
    <div class="strip">${strip.join('')}</div>
    <table>
      <tr><td>模板</td><td>${tag} ${t.name} · ${STYLE_NAME[t.style]}单元</td></tr>
      ${t.src ? `<tr><td>来源</td><td>改编自 ascii.rest 作品「${t.src}」（github.com/bas3line/ascii，MIT，© 2026 bas3line）</td></tr>` : ''}
      <tr><td>日期参数</td><td>${fmtP(pr, t)}</td></tr>
      <tr><td>Token ${fmtTok(D.tok)}</td><td>${t.enc.tok}：${fmtN(n)}（手机减半）</td></tr>
      <tr><td>占比 ${Math.round(D.share * 100)}/${Math.round((1 - D.share) * 100)}</td><td>${t.enc.share}</td></tr>
      <tr><td>趋势 ${D.trendK.toFixed(2)}</td><td>${t.enc.trend}</td></tr>
      <tr><td>缓存 ${(D.cache * 100).toFixed(1)}%</td><td>${t.enc.cache}（抖动 ${D.jitter.toFixed(2)}）</td></tr>
    </table>
    <p>730 天自检：相邻重复 ${ROT_CHECK.rep} 次；分布 ${TPL.filter(x => !x.off).map(x => String(x.id).padStart(2, '0') + ':' + (ROT_CHECK.cnt[x.id] || 0)).join(' ')}</p>`;
}
sel.addEventListener('change', () => { cur.art = sel.value ? parseInt(sel.value, 10) : null; apply(); });
din.addEventListener('change', () => { if(din.value){ cur.date = din.value; cur.art = null; apply(); } });
if(FROZEN !== null || REDUCE){ btn.textContent = '静态帧'; btn.disabled = true; $('mkCost').textContent = FROZEN !== null ? '?t=' + FROZEN : 'reduced-motion'; }
apply();
if(FROZEN === null && !REDUCE) requestAnimationFrame(frame);
</script>
</body>
