<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glassbox 磷光驾驶舱 v3</title>
<style>
  :root{
    --bg:#110a02; --fg:#ffb000; --hi:#ffe9b8; --text:#f6dfae; --dim:#c99a3c;
    --line:rgba(255,176,0,.3); --soft:rgba(255,176,0,.14);
    --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;color:var(--text);font:15px/1.6 var(--sans);overflow-x:hidden;
    background:radial-gradient(ellipse at 50% 0%,#221505 0%,#110a02 58%,#080500 100%) fixed;-webkit-font-smoothing:antialiased}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  svg{display:block}
  .in{max-width:1240px;margin:0 auto;padding:0 32px}
  @media (max-width:640px){.in{padding:0 16px}}

  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 0 16px}
  .brand{font:700 21px var(--mono);color:var(--hi);text-shadow:0 0 12px rgba(255,176,0,.55)}
  .chip{font-size:13px;color:var(--bg);background:var(--fg);padding:3px 10px;font-weight:600}
  .chip.line{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}

  /* 首屏：全幅方块格点地形，标题画在同一块画布里 */
  .banner{position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  #hero{display:block;width:100%;height:600px}
  @media (max-width:640px){#hero{height:520px}}
  .anchor{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
  .cap{display:flex;justify-content:space-between;gap:12px;padding:10px 0 0;font:12.5px var(--mono);color:var(--dim)}

  /* 分区：一层结构，细线加方点标记 */
  .sec{position:relative;border-top:1px solid var(--line);padding:26px 0 8px;margin-top:40px}
  .sec::before{content:"";position:absolute;left:0;top:-5px;width:9px;height:9px;background:var(--fg);box-shadow:0 0 8px rgba(255,176,0,.6)}
  .sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px}
  .sh h2{margin:0;font:600 19px/1.3 var(--sans);color:var(--hi)}
  .tag{font:11px var(--mono);color:var(--dim);opacity:.65;white-space:nowrap}
  .key{font:12px var(--mono);color:var(--dim)}
  .key i{display:inline-block;width:3px;height:11px;background:var(--hi);margin-right:6px;vertical-align:-1px}
  .note{display:inline-block;font-size:12.5px;color:var(--fg);border:1px solid var(--line);padding:0 8px;line-height:21px;white-space:nowrap;font-weight:500}

  .cols{display:grid;gap:0}
  .c4{grid-template-columns:repeat(4,1fr)}
  .c3{grid-template-columns:repeat(3,1fr)}
  .c2a{grid-template-columns:7fr 5fr}
  .c2b{grid-template-columns:5fr 7fr}
  .cols>*{padding:0 28px;min-width:0}
  .cols>*:first-child{padding-left:0}
  .cols>*:last-child{padding-right:0}
  .cols>*+*{border-left:1px solid var(--soft)}
  @media (max-width:1000px){
    .c4{grid-template-columns:1fr 1fr}
    .c3,.c2a,.c2b{grid-template-columns:1fr}
    .cols>*{padding:0}
    .cols>*+*{border-left:0}
    .c3>*+*,.c2a>*+*,.c2b>*+*{border-top:1px solid var(--soft);margin-top:24px;padding-top:24px}
    .c4>*{padding:0 0 22px}
    .c4>*:nth-child(even){padding-left:20px;border-left:1px solid var(--soft)}
  }
  @media (max-width:640px){.sec{margin-top:32px}.tag{display:none}}

  /* 指标 */
  .lab{font-size:14px;color:var(--dim);margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .val{font:600 clamp(26px,3.2vw,38px)/1.15 var(--mono);color:var(--hi);text-shadow:0 0 14px rgba(255,176,0,.35)}
  .val small{font:400 14px var(--sans);color:var(--dim);margin-left:6px;text-shadow:none}
  .dots{filter:drop-shadow(0 0 3px rgba(255,176,0,.3))}
  .dots svg{height:48px;width:auto;max-width:100%}

  /* 趋势 */
  .chart{position:relative;padding-left:42px}
  .yl{position:absolute;left:0;width:36px;text-align:right;font:11px var(--mono);color:var(--dim)}
  .xl{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--dim);margin:8px 0 0 42px}
  .leg{display:flex;gap:16px;font-size:13px;color:var(--dim);margin:0 0 14px 42px}
  .leg i{display:inline-block;width:9px;height:9px;margin-right:6px}
  .stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:12px;margin:20px 0 0 42px;padding-top:16px;border-top:1px solid var(--soft)}
  .stats dt{font-size:13px;color:var(--dim)}
  .stats dd{margin:0;font:600 18px var(--mono);color:var(--hi)}
  .stats dd small{font:12px var(--sans);color:var(--dim);margin-left:4px}
  @media (max-width:640px){.stats{grid-template-columns:1fr 1fr;margin-left:0}.leg,.xl{margin-left:0}.xl{margin-left:42px}}

  /* token */
  .trow{padding:10px 0;border-top:1px solid var(--soft)}
  .trow:first-child{border-top:0;padding-top:0}
  .trow .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .trow .l b{font-weight:400;color:var(--text)}
  .trow .l span{font:14px var(--mono);color:var(--hi)}
  .trow .l span small{color:var(--dim);font-size:12px;margin-left:8px}

  /* 额度 */
  .q h3{margin:0 0 6px;font:500 15px var(--sans);color:var(--text)}
  .q .big{font:600 34px/1.1 var(--mono);color:var(--hi);text-shadow:0 0 14px rgba(255,176,0,.35);margin-bottom:12px}
  .q .row{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px;align-items:baseline}
  .q .row .k{color:var(--dim);white-space:nowrap}
  .q .row.pc{flex-direction:column;gap:4px}.q .row.pc .v{text-align:left;font-family:var(--sans);font-size:14px}
  .q .row .v{font-family:var(--mono);color:var(--hi);text-align:right}
  .badge{display:inline-block;padding:0 8px;margin-right:6px;font-size:12.5px;font-weight:600;line-height:21px;font-family:var(--sans)}
  .badge.ok{border:1px solid var(--line);color:var(--fg)}
  .badge.hot{background:var(--fg);color:var(--bg)}

  /* 热力图 */
  .heat{position:relative;margin:22px 0 0 26px}
  .heat .ml{position:absolute;top:-18px;font-size:12px;color:var(--dim);white-space:nowrap}
  .heat .wl{position:absolute;left:-26px;font-size:11.5px;color:var(--dim);transform:translateY(-50%)}
  .hleg{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);margin-top:16px;margin-left:26px}
  .hleg i{width:8px;height:8px;display:inline-block}

  /* 活动 */
  .act{list-style:none;margin:0;padding:0}
  .act li{display:grid;grid-template-columns:104px 224px 1fr;gap:4px 16px;padding:11px 0;border-top:1px solid var(--soft);align-items:baseline}
  .act li:first-child{border-top:0;padding-top:0}
  .act time{font:12.5px var(--mono);color:var(--dim)}
  .act .p{color:var(--hi);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act .p small{font:11.5px var(--mono);color:var(--dim);font-weight:400;margin-left:8px}
  .act .p.priv{color:var(--dim);font-weight:500}
  .act .p.priv i{display:inline-block;width:8px;height:8px;margin-right:8px;background:repeating-linear-gradient(45deg,var(--dim) 0 2px,transparent 2px 4px)}
  .act .d{color:var(--text);font-size:14px}
  @media (max-width:760px){.act li{grid-template-columns:1fr;gap:1px}}

  .status{position:fixed;left:0;right:0;bottom:0;z-index:40;height:34px;line-height:34px;background:var(--fg);color:var(--bg);
    font:600 13px var(--mono);display:flex;justify-content:space-between;gap:12px;padding:0 24px;white-space:nowrap;overflow:hidden}
  .status .dot{display:inline-block;width:8px;height:8px;background:var(--bg);margin-right:8px}
  @media (max-width:640px){.status{padding:0 12px;font-size:12px}.status .opt{display:none}}

  .fx{position:fixed;inset:0;pointer-events:none}
  .scan{z-index:60;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0,rgba(0,0,0,.2) 1px,transparent 1px,transparent 3px)}
  .vig{z-index:61;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%);box-shadow:inset 0 0 80px 14px rgba(0,0,0,.5)}
  .roll{z-index:62;height:100px;inset:auto 0 auto 0;top:0;background:linear-gradient(to bottom,transparent,rgba(255,176,0,.045),transparent)}

  .live .rev{animation:rev .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*120ms + 600ms)}
  @keyframes rev{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.live .rev{animation:none}.roll{display:none}}
</style>
</head>
<body>
<div class="in">
  <header class="top">
    <div class="brand">glassbox</div>
    <div><span class="chip">只读快照</span> <span class="chip line" id="stamp"></span></div>
  </header>
</div>

<h1 class="sr" id="h1"></h1>
<div class="banner">
  <canvas id="hero" role="img" aria-label="近 30 天每日费用做成的方块格点地形，越靠近右侧越是今天"></canvas>
  <div class="in anchor"><div id="anchor"></div></div>
</div>
<div class="in">
  <div class="cap"><span id="cap0"></span><span id="capMid">近 30 天每日费用</span><span id="cap1"></span></div>

  <section class="sec rev" style="--i:0" aria-label="今日指标">
    <div class="cols c4">
      <div><p class="lab">今日费用 <span class="note">API 等价估算</span></p><div class="val" id="kCost"></div></div>
      <div><p class="lab">缓存命中率</p><div class="dots" id="kHit"></div></div>
      <div><p class="lab">今日会话</p><div class="val" id="kSes"></div></div>
      <div><p class="lab">Token 总量</p><div class="val" id="kTok"></div></div>
    </div>
  </section>

  <section class="sec rev" style="--i:1" aria-labelledby="h2a">
    <div class="sh"><h2 id="h2a">额度</h2><span class="key"><i></i>匀速位置</span></div>
    <div class="cols c3" id="quota"></div>
  </section>

  <section class="sec rev" style="--i:2" aria-labelledby="h2b">
    <div class="sh"><h2 id="h2b">近 30 天费用</h2></div>
    <div class="cols c2a">
      <div>
        <div class="leg"><span><i style="background:#ffb000"></i>Claude Code</span><span><i style="background:#ffe9b8"></i>Codex</span></div>
        <div class="chart" id="trend"></div>
        <div class="xl" id="trendX"></div>
        <dl class="stats" id="trendStats"></dl>
      </div>
      <div>
        <div class="sh" style="margin-bottom:16px"><h2 style="font-size:17px">Token 构成</h2></div>
        <div id="tokens"></div>
      </div>
    </div>
  </section>

  <section class="sec rev" style="--i:3" aria-labelledby="h2c">
    <div class="cols c2b">
      <div>
        <div class="sh"><h2 id="h2c">GitHub 贡献</h2><span class="key" id="heatN"></span></div>
        <div id="heat"></div>
        <div class="hleg" id="hleg"></div>
      </div>
      <div>
        <div class="sh"><h2>最近活动</h2></div>
        <ul class="act" id="act"></ul>
      </div>
    </div>
  </section>
  <div style="height:88px"></div>
</div>

<div class="status" aria-hidden="true">
  <span><span class="dot"></span>已连接 · 只读</span>
  <span class="opt">示例数据</span>
  <span id="clock">--:--:--</span>
</div>
<div class="fx scan"></div><div class="fx vig"></div><div class="fx roll" id="roll"></div>

<script src="sample-data.js"></script>
<script>
(function(){
'use strict';
const GB=window.GB, T0=Date.parse(GB.generatedAt);
const Q=new URLSearchParams(location.search);
const FROZEN=Q.has('t')&&isFinite(parseFloat(Q.get('t')))?parseFloat(Q.get('t')):null;
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STATIC=FROZEN!==null||REDUCE;
const $=id=>document.getElementById(id);
if(!STATIC)document.body.classList.add('live');

const nf=n=>Math.round(n).toLocaleString('en-US');
const fm=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+'M':nf(n/1e3)+'K';
const usd=n=>'$'+n.toFixed(2);
const mmdd=iso=>iso.slice(5,10).replace('-','/'), hhmm=iso=>iso.slice(11,16);
const dayMs=864e5, todayMs=Date.UTC(+GB.generatedAt.slice(0,4),+GB.generatedAt.slice(5,7)-1,+GB.generatedAt.slice(8,10));
const fmtD=ms=>{const d=new Date(ms);return String(d.getUTCMonth()+1).padStart(2,'0')+'/'+String(d.getUTCDate()).padStart(2,'0');};
const TD=GB.today, TK=TD.tokens;
const AMBER='#ffb000', HI='#ffe9b8', FONT='"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif';

/* ---------- 固定点径方块格点 ---------- */
const COL=[AMBER,HI];
function cells(nc,nr,level,o={}){
  const p=o.pitch||6, px=o.px||Math.round(p*0.72*10)/10, half=px/2, out=[];
  for(let c=0;c<nc;c++)for(let r=0;r<nr;r++){
    const v=level(c,r); if(!v)continue;
    out.push(`<rect x="${(c*p+p/2-half).toFixed(2)}" y="${(r*p+p/2-half).toFixed(2)}" width="${px}" height="${px}" fill="${COL[v[1]||0]}" fill-opacity="${v[0].toFixed(3)}"/>`);
  }
  const w=nc*p,h=nr*p;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${out.join('')}</svg>`;
}
const GL={
'0':['01110','10001','10011','10101','11001','10001','01110'],'1':['00100','01100','00100','00100','00100','00100','01110'],
'2':['01110','10001','00001','00010','00100','01000','11111'],'3':['11110','00001','00001','01110','00001','00001','11110'],
'4':['00010','00110','01010','10010','11111','00010','00010'],'5':['11111','10000','11110','00001','00001','10001','01110'],
'6':['00110','01000','10000','11110','10001','10001','01110'],'7':['11111','00001','00010','00100','01000','01000','01000'],
'8':['01110','10001','10001','01110','10001','10001','01110'],'9':['01110','10001','10001','01111','00001','00010','01100'],
'.':['0','0','0','0','0','0','1'],'%':['11001','11010','00010','00100','01000','01011','10011']};
function bigNum(str,pitch){
  const cols=[];
  [...str].forEach((ch,k)=>{const g=GL[ch]; if(k)cols.push(null); for(let x=0;x<g[0].length;x++)cols.push(g.map(row=>row[x]==='1'));});
  return cells(cols.length,7,(c,r)=>{const col=cols[c]; if(!col)return null; return col[r]?[0.74+0.26*(1-r/6),r<2?1:0]:[0.07,0];},{pitch,px:pitch*0.78});
}

/* ---------- 文案 ---------- */
$('stamp').textContent='更新于 '+mmdd(GB.generatedAt)+' '+hhmm(GB.generatedAt);
$('h1').textContent=`今天 ${nf(TD.requests)} 次请求，花费 ${usd(TD.costUsdApiEquivalent)}（API 等价估算）`;
function heroCaption(){ const n=innerWidth<640?15:30; // 手机上地形只显示后半段
  $('cap0').textContent=fmtD(todayMs-(n-1)*dayMs); $('capMid').textContent=`近 ${n} 天每日费用`; $('cap1').textContent='今天 '+fmtD(todayMs); }
heroCaption(); addEventListener('resize',heroCaption);
$('kCost').textContent=usd(TD.costUsdApiEquivalent);
$('kHit').innerHTML=bigNum((TD.cacheHitRate*100).toFixed(1)+'%',7);
$('kSes').innerHTML=`${TD.sessions}<small>个</small>`;
const totTok=TK.input+TK.output+TK.cacheRead+TK.cacheWrite; // 推理 token 已含在输出里，不重复计
$('kTok').textContent=fm(totTok);

/* ---------- 自适应宽度的图表 ---------- */
const fits=[];
function fit(id,fn){const el=$(id);const run=()=>{const w=el.clientWidth;if(w)el.innerHTML=fn(w);};run();fits.push(run);}

fit('tokens',w=>{
  const p=w<500?5:6, nc=Math.floor(w/p);
  const rows=[['输入',TK.input],['输出',TK.output],['缓存读取',TK.cacheRead],['缓存写入',TK.cacheWrite],['推理（含在输出内）',TK.reasoning]];
  return rows.map(([n,v])=>{
    const f=Math.max(1,Math.round(v/totTok*nc));
    return `<div class="trow"><div class="l"><b>${n}</b><span>${fm(v)}<small>${(v/totTok*100).toFixed(1)}%</small></span></div>${cells(nc,1,c=>c<f?[v===TK.cacheRead?0.95:0.85,v===TK.cacheRead?0:0]:[0.08,0],{pitch:p})}</div>`;
  }).join('');
});

const tr=GB.trend30d, cxs=GB.trend30dCodex, nT=tr.length, maxT=Math.max(...tr), miT=tr.indexOf(maxT);
fit('trend',w=>{
  const p=w<500?5:6, avail=w-42, per=Math.max(1,Math.floor(avail/p/nT)), nc=per*nT, NR=w<500?18:24;
  const gapCol=per>=3?per-1:-1;
  const html=cells(nc,NR,(c,r)=>{
    const d=Math.floor(c/per), sub=c%per; if(sub===gapCol)return [0.05,0];
    const f=tr[d]/maxT*NR, cc=cxs[d]/maxT*NR, rb=NR-1-r, last=d===nT-1;
    if(rb+0.55<=f){const top=f-rb<=1.55; return [Math.min(1,top?1:(0.4+0.42*rb/f)*(last?1.15:1)),rb<cc?1:0];}
    return [0.05,0];
  },{pitch:p});
  const ys=[maxT,maxT/2,0].map((v,i)=>`<span class="yl" style="top:${i===0?0:i===1?(NR*p/2-7):(NR*p-12)}px">$${Math.round(v)}</span>`).join('');
  return html+ys;
});
$('trendX').innerHTML=[0,15,29].map(k=>`<span>${fmtD(todayMs-(29-k)*dayMs)}</span>`).join('');
(function(){
  const sum=tr.reduce((a,b)=>a+b,0), a7=tr.slice(-7).reduce((a,b)=>a+b,0)/7, cs=cxs.reduce((a,b)=>a+b,0);
  $('trendStats').innerHTML=`<div><dt>30 天合计</dt><dd>${usd(sum)}</dd></div><div><dt>近 7 天日均</dt><dd>${usd(a7)}</dd></div><div><dt>单日最高</dt><dd>${usd(maxT)}<small>${fmtD(todayMs-(nT-1-miT)*dayMs)}</small></dd></div><div><dt>Codex 占比</dt><dd>${(cs/sum*100).toFixed(0)}%</dd></div>`;
})();

/* 额度 */
const QWIN={'7 天':7*dayMs,'5 小时':5*36e5};
function pace(q,now){
  const reset=Date.parse(q.resetsAt), W=QWIN[q.window], e=Math.min(1,Math.max(0.001,(now-(reset-W))/W));
  const diff=q.usedPct/100/e-1;
  const dur=ms=>{const h=Math.floor(ms/36e5),m=Math.round(ms%36e5/6e4);return h>=24?`${Math.floor(h/24)} 天 ${h%24} 小时`:h>0?`${h} 小时 ${m} 分`:`${m} 分`;};
  if(diff<=0)return {e,reset,hot:false,txt:`慢于匀速 ${Math.round(-diff*100)}%`};
  const el=e*W, tEx=(100-q.usedPct)/(q.usedPct/el), early=(reset-now)-tEx;
  return {e,reset,hot:true,txt:`快于匀速 ${Math.round(diff*100)}%，提前约 ${dur(early)}用完`};
}
function cd(ms){ms=Math.max(0,ms);const d=Math.floor(ms/dayMs);ms-=d*dayMs;const h=Math.floor(ms/36e5);ms-=h*36e5;const m=Math.floor(ms/6e4);ms-=m*6e4;const s=Math.floor(ms/1e3);
  const z=x=>String(x).padStart(2,'0');return (d?d+'天 ':'')+z(h)+'时 '+z(m)+'分 '+z(s)+'秒';}
$('quota').innerHTML=GB.quota.map((q,i)=>{
  const P=pace(q,T0);
  return `<article class="q"><h3>${q.agent} · ${q.window}</h3><div class="big">${q.usedPct}%</div><div class="qbar" data-i="${i}"></div>
    <div class="row"><span class="k">距离重置</span><span class="v cd" data-q="${i}">${cd(P.reset-T0)}</span></div>
    <div class="row pc"><span class="k">节奏</span><span class="v"><span class="badge ${P.hot?'hot':'ok'}">${P.hot?'偏快':'从容'}</span>${P.txt}</span></div></article>`;
}).join('');
function qbars(){
  document.querySelectorAll('.qbar').forEach(el=>{
    const w=el.clientWidth; if(!w)return;
    const q=GB.quota[+el.dataset.i], P=pace(q,T0), p=6, nc=Math.floor(w/p), u=Math.round(q.usedPct/100*nc), m=Math.min(nc-1,Math.round(P.e*nc));
    el.innerHTML=cells(nc,4,(c,r)=>{if(c===m)return [1,1]; if(r===0)return null; return c<u?[0.55+0.4*(c/nc),0]:[0.08,0];},{pitch:p});
  });
}
qbars(); fits.push(qbars);

/* 热力图 */
fit('heat',w=>{
  const W=GB.contrib.length, dow=new Date(todayMs).getUTCDay(), base=todayMs-dow*dayMs;
  const p=Math.max(5,Math.min(9,Math.floor((w-26)/W))), px=p>=8?6:p-1;
  const lvl=v=>v===0?0:v<4?1:v<10?2:v<20?3:4, AL=[0.08,0.28,0.5,0.76,1];
  const svg=cells(W,7,(c,r)=>{if(c===W-1&&r>dow)return null; const l=lvl(GB.contrib[c][r]); return [AL[l],l===4?1:0];},{pitch:p,px});
  let lab='',last=-9;
  for(let k=0;k<W;k++){const dt=new Date(base-(W-1-k)*7*dayMs);
    if(dt.getUTCDate()<=7&&k-last>=6){last=k;lab+=`<span class="ml" style="left:${k*p}px">${dt.getUTCMonth()+1} 月</span>`;}}
  const wl=[[1,'一'],[3,'三'],[5,'五']].map(([d,t])=>`<span class="wl" style="top:${(d+0.5)*p}px">${t}</span>`).join('');
  return `<div class="heat">${lab}${wl}${svg}</div>`;
});
$('heatN').textContent=`近一年 ${nf(GB.contributions.total)} 次`;
$('hleg').innerHTML='少 '+[0.08,0.28,0.5,0.76,1].map((a,i)=>`<i style="background:${i===4?HI:AMBER};opacity:${Math.max(a,0.16)}"></i>`).join('')+' 多';

/* 活动：私有项目显示「私有项目」+ 已打码的标题，不带哈希和分支 */
$('act').innerHTML=GB.activity.map(a=>{
  const when=`<time>${mmdd(a.t)} ${hhmm(a.t)}</time>`;
  return a.public
    ?`<li>${when}<span class="p">${a.repo}<small>${a.branch}</small></span><span class="d">${a.title}</span></li>`
    :`<li>${when}<span class="p priv"><i></i>私有项目</span><span class="d">${a.title}</span></li>`;
}).join('');

/* ---------- 首屏：数据地形 + 沿字形让开的细边 ---------- */
const hero=$('hero'), hx=hero.getContext('2d');
function samp(arr,u){const n=arr.length,i=Math.floor(u),f=u-i,g=k=>arr[Math.min(n-1,Math.max(0,k))];
  const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
  return 0.5*((2*p1)+(-p0+p2)*f+(2*p0-5*p1+4*p2-p3)*f*f+(-p0+3*p1-3*p2+p3)*f*f*f);}
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
const hash=(a,b)=>{let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296;};

let L=null; // 版面与遮罩
function titleLines(W,H,ax){
  const avail=W-ax*2, m=hx; m.font=`700 100px ${FONT}`;
  const num=nf(TD.requests);
  const w100=m.measureText(`今天 ${num} 次请求`).width;
  let lines, fs;
  if(avail/w100*100>=70){ fs=Math.min(124,avail/w100*100*0.98); lines=[[['今天 ',AMBER],[num,HI],[' 次请求',AMBER]]]; }
  else{ const w2=m.measureText(`${num} 次请求`).width; fs=Math.min(110,avail/w2*100*0.98); lines=[[['今天',AMBER]],[[num,HI],[' 次请求',AMBER]]]; }
  return {lines,fs};
}
function paintTitle(g,mode){
  const {lines,fs,ax,top}=L, gap=fs*1.08;
  g.textBaseline='alphabetic';
  lines.forEach((segs,i)=>{
    let x=ax; const y=top+fs*0.86+i*gap;
    g.font=`700 ${fs}px ${FONT}`;
    segs.forEach(([t,c])=>{
      if(mode==='mask'){g.lineWidth=4;g.strokeStyle='#fff';g.strokeText(t,x,y);g.fillStyle='#fff';g.fillText(t,x,y);}
      else{g.fillStyle=c;g.shadowColor='rgba(255,176,0,.75)';g.shadowBlur=c===HI?22:14;g.fillText(t,x,y);g.shadowBlur=0;}
      x+=g.measureText(t).width;
    });
  });
  // 第二行：费用
  const n=lines.length, y=top+fs*0.86+(n-1)*gap+Math.max(34,fs*0.42), fs2=Math.max(20,fs*0.3);
  let x=ax; g.font=`600 ${fs2}px ${FONT}`;
  const parts=[['花费 ',AMBER],[usd(TD.costUsdApiEquivalent),HI]];
  parts.forEach(([t,c])=>{
    if(mode==='mask'){g.lineWidth=4;g.strokeStyle='#fff';g.strokeText(t,x,y);g.fillStyle='#fff';g.fillText(t,x,y);}
    else{g.fillStyle=c;g.shadowColor='rgba(255,176,0,.6)';g.shadowBlur=c===HI?14:8;g.fillText(t,x,y);g.shadowBlur=0;}
    x+=g.measureText(t).width;
  });
  const fs3=Math.max(12,fs2*0.52); g.font=`500 ${fs3}px ${FONT}`;
  const tw=g.measureText('API 等价估算').width, bx=x+fs2*0.5, by=y-fs3*1.15, bh=fs3*1.8;
  if(mode==='mask'){g.fillStyle='#fff';g.fillRect(bx-2,by-2,tw+fs3*1.2+4,bh+4);}
  else{g.strokeStyle='rgba(255,176,0,.6)';g.lineWidth=1;g.strokeRect(bx+.5,by+.5,tw+fs3*1.2,bh);g.fillStyle=AMBER;g.fillText('API 等价估算',bx+fs3*0.6,by+bh*0.7);}
}
function layout(){
  const W=hero.clientWidth,H=hero.clientHeight; if(!W||!H){L=null;return;}
  const dpr=Math.min(devicePixelRatio||1,2);
  hero.width=Math.round(W*dpr);hero.height=Math.round(H*dpr);
  hx.setTransform(dpr,0,0,dpr,0,0);
  const ax=$('anchor').getBoundingClientRect().left-hero.getBoundingClientRect().left+ (W<640?16:32)*0;
  const aL=Math.max(0,($('anchor').parentElement.getBoundingClientRect().left+parseFloat(getComputedStyle($('anchor').parentElement).paddingLeft)));
  const T=titleLines(W,H,aL);
  L={W,H,dpr,ax:aL,top:H*(W<640?0.085:0.2),lines:T.lines,fs:T.fs,p:5};
  // 遮罩：同字体、细描边、轻模糊
  const c1=document.createElement('canvas');c1.width=W;c1.height=H;
  const g1=c1.getContext('2d'); paintTitle(g1,'mask');
  const c2=document.createElement('canvas');c2.width=W;c2.height=H;
  const g2=c2.getContext('2d'); g2.filter='blur(2px)'; g2.drawImage(c1,0,0); g2.drawImage(c1,0,0);
  const d=g2.getImageData(0,0,W,H).data, p=L.p, cols=Math.floor(W/p), rows=Math.floor(H/p);
  L.cols=cols;L.rows=rows;L.mask=new Float32Array(cols*rows);
  for(let j=0;j<cols;j++)for(let r=0;r<rows;r++){
    const x=Math.min(W-1,Math.floor(j*p+p/2)), y=Math.min(H-1,Math.floor(r*p+p/2));
    L.mask[j*rows+r]=d[(y*W+x)*4+3]/255;
  }
  L.buf=new Float32Array(cols*rows);L.cl=new Uint8Array(cols*rows);
  L.stars=[];for(let j=0;j<cols;j++)for(let r=0;r<Math.floor(rows*0.5);r++){const h=hash(j,r); if(h<0.0035)L.stars.push([j*rows+r,h*280]);}
}
let K=18;
function drawHero(T){
  if(!L)layout(); if(!L)return;
  const {W,H,dpr,p,cols,rows,buf,cl,mask}=L; K=W<640?9:18; const g=STATIC?1:smooth(T/2.6);
  buf.fill(0);cl.fill(0);
  for(const [i,h] of L.stars)buf[i]=0.10+0.22*(0.5+0.5*Math.sin(T*0.9+h));
  for(let k=0;k<K;k++){
    const d=k/(K-1), yb=H*(0.40+0.57*Math.pow(d,1.45)), amp=H*(0.20+0.42*d)*g*(W<640?0.6:1), span=(1.75-0.75*d)*(W<640?0.5:1), c0=W<640?1-span/2:0.5;
    const shift=(1-d)*2.4*Math.sin(T*0.33+k*0.21), b=0.10+0.62*Math.pow(d,1.2), fl=12+26*d;
    for(let j=0;j<cols;j++){
      const xn=(j+.5)/cols, u=Math.max(0,Math.min(29,(c0+(xn-0.5)*span)*29+shift));
      let v=samp(tr,u)/52+0.05*Math.sin(xn*14-T*1.3+k*0.9)*(1-d*0.5); v=Math.max(0,v);
      const top=yb-v*amp, rt=Math.max(0,Math.ceil(top/p)), hot=k===K-1&&xn>0.955;
      const shim=0.86+0.14*Math.sin(j*0.55-T*2+k*1.1);
      for(let r=rt;r<rows;r++){
        const dy=r*p-top; let a=b*(0.12+0.88*Math.exp(-dy/fl))*shim; if(r===rt)a=Math.min(1,b*1.2+0.2);
        const i=j*rows+r; buf[i]=a; cl[i]=hot&&r===rt?1:0; if(hot&&r===rt)buf[i]=1;
      }
    }
  }
  const NL=12, bk=[];for(let n=0;n<NL*2;n++)bk.push([]);
  const sz=p-1;
  for(let j=0;j<cols;j++)for(let r=0;r<rows;r++){
    const i=j*rows+r; let a=buf[i]; if(a<0.04)continue;
    a*=1-Math.min(1,mask[i]*2.6); if(a<0.04)continue;
    const li=Math.min(NL-1,Math.floor(a*NL)); bk[cl[i]*NL+li].push(j*p+0.5,r*p+0.5);
  }
  hx.setTransform(dpr,0,0,dpr,0,0); hx.clearRect(0,0,W,H);
  for(let n=0;n<NL*2;n++){const arr=bk[n]; if(!arr.length)continue;
    const li=n%NL, hi=n>=NL;
    hx.fillStyle=hi?`rgba(255,233,184,${((li+0.6)/NL).toFixed(3)})`:`rgba(255,176,0,${((li+0.6)/NL).toFixed(3)})`;
    if(li>=NL-2){hx.shadowColor='rgba(255,176,0,.85)';hx.shadowBlur=7;}else hx.shadowBlur=0;
    hx.beginPath(); for(let q=0;q<arr.length;q+=2)hx.rect(arr[q],arr[q+1],sz,sz); hx.fill();
  }
  hx.shadowBlur=0;
  paintTitle(hx,'draw');
}

/* ---------- 逐帧：时间 t 的纯函数 ---------- */
let lastSec=-1;
function tickText(T,force){
  const now=T0+T*1000, sec=Math.floor(T); if(sec===lastSec&&!force)return; lastSec=sec;
  document.querySelectorAll('.cd').forEach(el=>{el.textContent=cd(Date.parse(GB.quota[+el.dataset.q].resetsAt)-now);});
  const d=new Date(now+9*36e5), z=n=>String(n).padStart(2,'0');
  $('clock').textContent=`JST ${z(d.getUTCHours())}:${z(d.getUTCMinutes())}:${z(d.getUTCSeconds())}`;
}
function draw(T,force){drawHero(T);tickText(T,force);$('roll').style.transform=`translateY(${((T/9)%1)*(innerHeight+200)-100}px)`;}
let raf=0,visible=true,start=performance.now(),lastF=0;
function frame(ts){raf=requestAnimationFrame(frame); if(!visible||document.hidden||ts-lastF<40)return; lastF=ts; draw((performance.now()-start)/1000);}
function go(){
  if(FROZEN!==null){draw(FROZEN,true);return;}
  if(REDUCE){draw(8,true);return;}
  draw(0,true); raf=requestAnimationFrame(frame);
}
new IntersectionObserver(e=>{visible=e[0].isIntersecting;}).observe(hero);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{fits.forEach(f=>f());L=null;if(STATIC)draw(FROZEN!==null?FROZEN:8,true);},120);});
if(document.fonts&&document.fonts.ready&&!STATIC)document.fonts.ready.then(()=>{L=null;});
go();
})();
</script>
