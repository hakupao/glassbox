/* ==========================================================================
   S17 activity: design tokens (the deliverable for web/styles.css)
   Spacing scale, type scale, color roles. Everything below uses only these.

:root{
  /* spacing: one scale for gaps between and inside cards */
  --s1:4px;  --s2:8px;  --s3:12px;  --s4:16px;  --s5:24px;

  /* type scale: 3 sizes, 2 weights. mono = data only (hash, path, time, count) */
  --fs-1:15px;   /* level 1: card title, day heading                  */
  --fs-2:13px;   /* level 2: body text, filter labels, nav            */
  --fs-3:11.5px; /* level 3: data and badges (mono), meta line        */
  --fw-1:600; --fw-2:400;
  --lh-1:1.4; --lh-2:1.55;

  /* color roles, grays first */
  --bg:#14171c;                       /* page */
  --surface:rgba(53,60,72,.5);        /* card */
  --surface-hi:rgba(53,60,72,.78);    /* selected, hover */
  --line:rgba(216,211,196,.16);       /* borders, rail */
  --line-soft:rgba(216,211,196,.09);  /* dividers inside a card */
  --ink-1:#efeadd;  /* titles, active */
  --ink-2:#d8d3c4;  /* body */
  --ink-3:#a6a297;  /* meta, data, inactive */
  /* signal colors: only to tell things apart */
  --sig-ok:#79b98a;    /* file A, pushed ok */
  --sig-warn:#e3894d;  /* file M, unpushed */
  --sig-bad:#e0645a;   /* file D */
  --sig-vio:#a48ee0;   /* file R */
  --sig-info:#6c97d6;  /* links, focus */
  --pale:12%; --pale-line:34%;  /* badge: pale fill, thin border, same hue */
  /* repo tag palette (hashed per repo name, as web/app.js TAGS) */
  --tag-1:#e07a8a; --tag-2:#7fa8e8; --tag-3:#79b98a; --tag-4:#d9a441; --tag-5:#a48ee0; --tag-6:#5fb7b0;
  /* shape and motion */
  --rail-x:7px;          /* rail centre inside the rail column */
  --dot:8px;             /* timeline dot, square like the pixel cells */
  --ease:cubic-bezier(.2,.7,.2,1); --dur-1:.18s; --dur-2:.32s;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}

html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink-2);font:var(--fw-2) var(--fs-2)/var(--lh-2) var(--sans);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}

.top{display:flex;align-items:center;gap:var(--s5);padding:var(--s4) 0}

.nav{display:flex;gap:2px;flex:1}

  border:1px solid color-mix(in srgb,currentColor var(--pale-line),transparent);background:color-mix(in srgb,currentColor var(--pale),transparent)}

.mt i{width:8px;height:8px;border-radius:2px;background:var(--mc)}

.mask{display:inline-block;line-height:0;color:var(--ink-3);vertical-align:middle;user-select:none}

.files{list-style:none;margin:0;padding:0}

.cnt{font:var(--fs-3) var(--mono);color:var(--ink-3)}
/* folded list: extra rows live in a 0fr -> 1fr grid so height animates */
.fold{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows var(--dur-2) var(--ease),visibility 0s var(--dur-2)}
.fold>div{overflow:hidden;min-height:0}
.fold.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows var(--dur-2) var(--ease),visibility 0s}
.lm{margin-top:var(--s1);padding:2px 0;background:none;border:0;cursor:pointer;font:var(--fs-3) var(--mono);color:var(--sig-info)}
.lm:hover{text-decoration:underline}
.act-a{font:var(--fs-3) var(--mono);color:var(--sig-info);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--sig-info) 40%,transparent)}
.act-a:hover{border-bottom-color:var(--sig-info)}

/* filter-switch animation */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:rise var(--dur-2) var(--ease) both;animation-delay:calc(var(--i,0) * 28ms)}

.dr{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows var(--dur-2) var(--ease),visibility 0s var(--dur-2)}

.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s1) var(--s4);margin:0;font-size:var(--fs-3)}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;color:var(--ink-2);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

@media (max-width:640px){

const dayHead=(k,n)=>`${dayLabel(k)} <span class="dn">· ${n} change${n>1?'s':''}</span>`;
/* wire: filter switch, load more, tab icons */
const ICON={overview:'1101111011000001101111011',usage:'0000100101101011010111111',code:'0101010100101000010101010',machines:'1111110001100011111100100',services:'1111100000111110000011111'};
const tabIcon=k=>`<svg width="20" height="20" viewBox="0 0 25 25" aria-hidden="true">${[...ICON[k]].map((v,i)=>v==='1'?`<rect x="${(i%5)*5}" y="${Math.floor(i/5)*5}" width="4" height="4"/>`:'').join('')}</svg>`;
const TABS=[['overview','Overview'],['usage','Usage'],['code','Code'],['machines','Machines'],['services','Services']];
const navHtml=TABS.map(([k,l])=>`<a href="#${k}"${k==='code'?' aria-current="page"':''}>${l}</a>`).join('');
const tabsHtml=TABS.map(([k,l])=>`<a href="#${k}"${k==='code'?' aria-current="page"':''}>${tabIcon(k)}<span>${l}</span></a>`).join('');
document.getElementById('nav').innerHTML=navHtml;
document.getElementById('tabs').innerHTML=tabsHtml;
document.addEventListener('click',e=>{
  const b=e.target.closest('.lm'); if(!b) return;
  const f=document.getElementById(b.getAttribute('aria-controls')),o=!f.classList.contains('open');
  f.classList.toggle('open',o);b.setAttribute('aria-expanded',o);b.textContent=o?'fold':`load more (${b.dataset.n})`;
});
let cid=0;
const cardB=(c,i)=>{const id='d'+(cid++),n=nFiles(c);
 return `<li class="cm enter${c.pushed?'':' un'}" style="--c:${c.public?hue(c.repo):'var(--ink-3)'};--i:${i}">
 <time class="tm" datetime="${c.t}">${hhmm(c.t)}</time><span class="ring"></span>
 <article class="card${i===1?' open':''}">
  <button class="hd" type="button" aria-expanded="${i===1}" aria-controls="${id}">
   <span class="ttl">${title(c.title)}</span>
   <span class="meta">${repoTag(c)}${unp(c)}<span class="hash">${c.hash.slice(0,7)}</span><span class="tt">${hhmm(c.t)}</span></span>
   <span class="side"><span class="cnt">${n} file${n>1?'s':''}</span><i class="chev"></i></span>
  </button>
  <div class="dr" id="${id}"><div><div class="in2">
   <dl class="facts"><dt>author</dt><dd style="font-family:var(--sans)">hakupao · ${ago(c.t)}</dd><dt>branch</dt><dd>${esc(c.branch)}</dd><dt>commit</dt><dd>${c.hash}</dd><dt>source</dt><dd>${c.source}</dd><dt>machine</dt><dd>${mach(c)}</dd></dl>
   <div>${filesBlock(c)}</div>
   ${hasDiff(c)?`<div class="acts"><a class="act-a" href="#diff-${c.hash.slice(0,7)}">diff</a></div>`:''}
  </div></div></div>
 </article></li>`};
function render(key){
  const list=C.filter(FILTERS.find(f=>f[0]===key)[2]);let i=0;
  const html=dayGroups(list).map(g=>`<li class="day enter" style="--i:${i++}"><h2>${dayHead(g.k,g.items.length)}</h2></li>`+g.items.map(c=>cardB(c,i++)).join('')).join('');
  document.getElementById('tl').innerHTML=html||'<li class="empty" style="display:block">no commits in this filter</li>';
  document.getElementById('sub').textContent=list.length+' commits';
}
const seg=document.getElementById('seg');
seg.innerHTML=FILTERS.map(([k,l,f])=>`<button type="button" aria-pressed="${k==='all'}" data-k="${k}">${l}<small>${C.filter(f).length}</small></button>`).join('');
seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const tl=document.getElementById('tl');tl.classList.add('out');setTimeout(()=>{render(b.dataset.k);tl.classList.remove('out')},110)});
document.addEventListener('click',e=>{const h=e.target.closest('.hd');if(!h)return;const card=h.parentElement,o=!card.classList.contains('open');card.classList.toggle('open',o);h.setAttribute('aria-expanded',o)});
render('all');

</script>
</body>
</html>
