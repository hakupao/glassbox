<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glassbox 终端驾驶舱</title>
<style>
  :root{
    --bg:#110a02;        /* 磷光管底色 */
    --fg:#ffb000;        /* 琥珀磷光 */
    --hi:#ffe3a3;        /* 高亮 */
    --dim:#b07812;       /* 次要文字 */
    --faint:#6a4509;     /* 热力图空格 */
    --glow:rgba(255,176,0,.5);
    --fs:15px;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;min-height:100vh;color:var(--fg);background:
      radial-gradient(ellipse at 50% 30%, #1d1204 0%, #110a02 60%, #080500 100%);
    font:var(--fs)/1.3 "SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono","PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace;
    text-shadow:0 0 5px var(--glow),0 0 1px var(--fg);
    -webkit-font-smoothing:antialiased;
  }
  @media (max-width:640px){:root{--fs:11px}}
  .wrap{padding:18px 24px 56px}
  @media (max-width:640px){.wrap{padding:12px 12px 48px}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #meas{position:absolute;visibility:hidden;white-space:pre;left:0;top:0}
  .grid{margin:0 auto}
  .ln{white-space:pre;height:1.3em;line-height:1.3em;overflow:visible}
  .ln.hid{visibility:hidden}
  .ln i{font-style:normal;display:inline-block;vertical-align:top;height:1.3em;text-align:center;overflow:visible}
  .ln i.n{width:1ch}
  .ln i.w{width:2ch}
  .b{color:var(--hi);text-shadow:0 0 8px rgba(255,200,80,.8),0 0 2px var(--hi)}
  .d{color:var(--dim);text-shadow:0 0 3px rgba(255,176,0,.25)}
  .x{color:var(--faint);text-shadow:none}
  .h{color:#fff3d0;text-shadow:0 0 10px #ffb000,0 0 3px #fff3d0;font-weight:bold}
  .i{background:var(--fg);color:var(--bg);text-shadow:none;font-weight:bold}
  .cur{color:var(--hi)}
  .cur.off{visibility:hidden}
  .T{color:var(--hi)}

  /* CRT 叠层 */
  .fx{position:fixed;inset:0;pointer-events:none}
  .scan{z-index:60;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.30) 0,rgba(0,0,0,.30) 1px,transparent 1px,transparent 3px)}
  .vig{z-index:61;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6) 100%);box-shadow:inset 0 0 90px 24px rgba(0,0,0,.65)}
  .roll{z-index:62;height:90px;inset:auto 0 auto 0;top:0;background:linear-gradient(to bottom,transparent,rgba(255,176,0,.05),transparent)}
  .flick{z-index:63;background:#ffb000;opacity:0}

  .status{
    position:fixed;left:0;right:0;bottom:0;z-index:40;height:1.9em;line-height:1.9em;
    background:var(--fg);color:var(--bg);text-shadow:none;font-weight:bold;
    display:flex;justify-content:space-between;gap:12px;padding:0 24px;white-space:nowrap;overflow:hidden;
  }
  @media (max-width:640px){.status{padding:0 12px}.status .opt{display:none}}
  .status .dot.off{visibility:hidden}
  @media (prefers-reduced-motion:reduce){.fx.roll,.fx.flick{display:none}}
</style>
</head>
<body>
<h1 class="sr">glassbox · AI 开发驾驶舱（只读快照）</h1>
<div class="wrap">
  <div id="grid" class="grid" aria-hidden="true">
    <div id="hdr"></div>
    <div id="boot"></div>
    <div id="scr"></div>
  </div>
  <p class="sr" id="summary"></p>
</div>
<span id="meas">MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM</span>
<div class="status" aria-hidden="true">
  <span><span class="dot" id="dot">●</span> LINK OK</span>
  <span class="opt">MODE: READ-ONLY</span>
  <span class="opt" id="stOwner"></span>
  <span id="clock">--:--:--</span>
</div>
<div class="fx scan"></div><div class="fx vig"></div><div class="fx roll" id="roll"></div><div class="fx flick" id="flick"></div>

<script src="sample-data.js"></script>
<script>
(function(){
'use strict';
const GB = window.GB;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ========== 字符网格工具：全角占 2 格，所有非 ASCII 字符强制定宽 ========== */
const S='\u0001', E='\u0002';
const c=(k,t)=>S+(k||'_')+t+E;  // 空类名用 '_' 占位，否则第一个字符会被吃成类名                     // 着色标记：c('b','文字')
const strip=s=>s.replace(/\u0001T\d+\|/g,'').replace(/\u0001.|\u0002/g,'');
function cw(ch){const n=ch.codePointAt(0);
  return (n>=0x1100&&n<=0x115F)||(n>=0x2E80&&n<=0xA4CF)||(n>=0xAC00&&n<=0xD7A3)||(n>=0xF900&&n<=0xFAFF)||
         (n>=0xFE30&&n<=0xFE6F)||(n>=0xFF00&&n<=0xFF60)||(n>=0xFFE0&&n<=0xFFE6)?2:1;}
const width=s=>{let w=0;for(const ch of strip(s))w+=cw(ch);return w;};
const sp=n=>' '.repeat(Math.max(0,n));
const pad=(s,w)=>s+sp(w-width(s));
const lr=(l,r,w)=>l+sp(w-width(l)-width(r))+r;
function trunc(t,w){ if(width(t)<=w)return t; let o='',a=0; for(const ch of t){const k=cw(ch); if(a+k>w-1)break; o+=ch;a+=k;} return o+'…'; }
const esc=ch=>ch==='<'?'&lt;':ch==='&'?'&amp;':ch;
function cells(p){let o='';for(const ch of p){ if(ch.codePointAt(0)<128)o+=esc(ch); else o+=`<i class="${cw(ch)===2?'w':'n'}">${ch}</i>`;}return o;}
function html(s){
  let out='',last=0,m; const re=/\u0001(.)([^\u0002]*)\u0002/g;
  while((m=re.exec(s))){
    out+=cells(s.slice(last,m.index)); let k=m[1],t=m[2],attr='';
    if(k==='T'){const mm=/^(\d+)\|(.*)$/.exec(t);attr=` data-i="${mm[1]}"`;t=mm[2];}
    if(k==='K'){out+='<span class="cur"><i class="n">█</i></span>';}
    else out+=`<span class="${k}"${attr}>${cells(t)}</span>`;
    last=re.lastIndex;
  }
  return out+cells(s.slice(last));
}

/* ========== 面板边框（box-drawing） ========== */
function box(tag,name,body,w,minH,dbl){
  const [tl,h,tr,v,bl,br]=dbl?['╔','═','╗','║','╚','╝']:['┌','─','┐','│','└','┘'];
  const head=c('b','['+tag+']')+' '+name+' ';
  const out=[c('d',tl+h)+head+c('d',h.repeat(Math.max(0,w-3-width(head)))+tr)];
  const lines=body.slice(); while(lines.length+2<(minH||0)-0+0 && lines.length+2<minH)lines.push('');
  for(const l of lines){
    if(width(l)>w-4)console.warn('OVERFLOW',width(l),w-4,strip(l));
    out.push(c('d',v)+' '+pad(l,w-4)+' '+c('d',v));
  }
  out.push(c('d',bl+h.repeat(w-2)+br));
  return out;
}
const join2=(A,B,gap)=>A.map((l,i)=>l+sp(gap)+B[i]);

/* ========== 数据格式化 ========== */
const nf=n=>Math.round(n).toLocaleString('en-US');
const fm=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+'M':nf(n/1e3)+'K';
const usd=n=>'$'+n.toFixed(2);
const BLK=' ▁▂▃▄▅▆▇█';
const t0=Date.parse(GB.generatedAt);
const mmdd=iso=>iso.slice(5,10), hhmm=iso=>iso.slice(11,16);
const stamp=mmdd(GB.generatedAt)+' '+hhmm(GB.generatedAt);

/* ========== 大号点阵数字 ========== */
const DG={'0':['111','101','101','101','111'],'1':['010','110','010','010','111'],'2':['111','001','111','100','111'],
 '3':['111','001','111','001','111'],'4':['101','101','111','001','001'],'5':['111','100','111','001','111'],
 '6':['111','100','111','101','111'],'7':['111','001','001','001','001'],'8':['111','101','111','101','111'],
 '9':['111','101','111','001','111']};
function bigNum(str){
  const rows=['','','','',''];
  [...str].forEach((ch,k)=>{
    for(let r=0;r<5;r++){
      let seg;
      if(ch===','){seg=['  ','  ','  ','▄▄','▀ '][r];}
      else seg=[...DG[ch][r]].map(b=>b==='1'?'██':'  ').join('');
      rows[r]+=(k?' ':'')+seg;
    }
  });
  return rows;
}
const LOGO={G:[' ███ ','█    ','█  ██','█   █',' ███ '],L:['█    ','█    ','█    ','█    ','█████'],
 A:[' ███ ','█   █','█████','█   █','█   █'],S:[' ████','█    ',' ███ ','    █','████ '],
 B:['████ ','█   █','████ ','█   █','████ '],O:[' ███ ','█   █','█   █','█   █',' ███ '],
 X:['█   █',' █ █ ','  █  ',' █ █ ','█   █']};
const logoRows=[0,1,2,3,4].map(r=>[...'GLASSBOX'].map(ch=>LOGO[ch][r]).join(' '));

/* ========== 各面板内容 ========== */
function hdr(cols){
  const iw=cols-4, T=GB.today;
  const snap=c('i',' 只读快照 · 更新于 '+stamp+' ');
  let body;
  if(iw>=90){
    const meta=[c('b','glassbox')+c('d','  v1.0'),'AI 开发驾驶舱 · 本地用量与贡献总览','',snap,c('d','owner ')+GB.owner+c('d','  数据为虚构样稿')];
    body=logoRows.map((l,i)=>c('b',l)+'    '+meta[i]);
  }else{
    body=[c('b','glassbox')+c('d','  AI 开发驾驶舱'),snap,c('d','owner ')+GB.owner];
  }
  return box('SYS:BOOT','glassbox 终端',body,cols,0,true);
}
function bootLines(cols){
  const W=Math.min(cols,72);
  const L=(a,b)=>'> '+a+' '+'.'.repeat(Math.max(2,W-4-width(a)-width(b)))+' '+b;
  return [L('载入快照 sample-data.js','OK'),L('校验贡献矩阵 53×7','OK'),L('只读链路 · 无写入权限','LINK OK'),L('快照时间 '+stamp,'READY')];
}
function today(iw){
  const T=GB.today, tk=T.tokens, out=[];
  const big=bigNum(nf(T.requests));
  const right=[c('b','请求数'),c('d','今日模型调用'),'',c('b',nf(T.sessions))+' 个会话','Claude Code + Codex'];
  big.forEach((r,i)=>out.push(c('b',r)+'   '+right[i]));
  out.push('');
  out.push(c('d','Token 拆分'));
  const rows=[['输入',tk.input],['输出',tk.output],['缓存读',tk.cacheRead],['缓存写',tk.cacheWrite],['推理',tk.reasoning]];
  const tot=rows.reduce((a,r)=>a+r[1],0), bw=Math.max(8,iw-9-8-1-6);
  rows.forEach(([n,v])=>{
    const f=Math.max(1,Math.round(v/tot*bw));
    out.push(pad(n,9)+c(v===tk.cacheRead?'b':'','█'.repeat(f))+c('x','░'.repeat(bw-f))+' '+pad(fm(v),6)+c('d',(v/tot*100).toFixed(1).padStart(5)+'%').replace(/^/,''));
  });
  out.push('');
  const hb=Math.max(10,iw-9-8), hf=Math.round(T.cacheHitRate*hb);
  out.push(pad('缓存命中',9)+'['+c('b','■'.repeat(hf))+c('x','□'.repeat(hb-hf))+'] '+c('b',(T.cacheHitRate*100).toFixed(1)+'%'));
  out.push('');
  out.push(lr(c('d','费用 ')+c('h',usd(T.costUsdApiEquivalent)),c('i',' API 等价估算 '),iw));
  T.byAgent.forEach(a=>{
    const share=a.cost/T.costUsdApiEquivalent, b=Math.round(share*10);
    out.push(lr(pad(a.agent,12)+nf(a.requests).padStart(6)+' 次',c('b','▮'.repeat(b))+c('x','▯'.repeat(10-b))+usd(a.cost).padStart(8),iw));
  });
  return out;
}
function iso(ms){return new Date(ms).toISOString().slice(0,10);}
const todayMs=Date.UTC(+GB.generatedAt.slice(0,4),+GB.generatedAt.slice(5,7)-1,+GB.generatedAt.slice(8,10));
function trend(iw){
  const t=GB.trend30d,n=t.length,max=Math.max(...t),R=6,gut=6,out=[];
  const dw=(iw-gut)>=n*2?2:1, mi=t.indexOf(max);
  out.push(c('d','近 30 天每日费用（API 等价估算）'));
  const gl=r=>r===0?pad('$'+Math.round(max),5)+'┤':r===R-1?pad('$0',5)+'┤':r===Math.floor(R/2)?pad('$'+Math.round(max/2),5)+'┤':sp(5)+'│';
  for(let r=0;r<R;r++){
    const rowFromBottom=R-1-r; let s='';
    t.forEach((v,j)=>{
      const u=Math.round(v/max*R*8), k=Math.max(0,Math.min(8,u-rowFromBottom*8));
      const ch=BLK[k]; const cls=j===n-1?'h':j===mi?'b':'';
      s+=(ch===' '?' ':c(cls,ch))+(dw===2?' ':'');
    });
    out.push(c('d',gl(r))+' '.slice(1)+s);
  }
  out.push(sp(5)+c('d','└'+'─'.repeat(n*dw)));
  const ax=Array(n*dw).fill(' ');
  const put=(pos,txt)=>{[...txt].forEach((ch,k)=>{if(pos+k>=0&&pos+k<ax.length)ax[pos+k]=ch;});};
  put(0,mmdd(iso(todayMs-29*864e5)));put(14*dw-1,mmdd(iso(todayMs-15*864e5)));put(n*dw-5-(dw===2?1:0),mmdd(iso(todayMs)));
  out.push(sp(6)+c('d',ax.join('')));
  const sum=t.reduce((a,b)=>a+b,0), a7=t.slice(-7).reduce((a,b)=>a+b,0)/7;
  out.push('');
  out.push(c('d','合计 ')+c('b',usd(sum))+c('d','   近 7 日均 ')+c('b',usd(a7)));
  out.push(c('d','峰值 ')+c('b',usd(max))+c('d',' ('+mmdd(iso(todayMs-(n-1-mi)*864e5))+')   今日 ')+c('h',usd(t[n-1])));
  return out;
}
function cdText(i){
  let ms=Math.max(0,Date.parse(GB.quota[i].resetsAt)-nowMs());
  const d=Math.floor(ms/864e5);ms-=d*864e5;const h=Math.floor(ms/36e5);ms-=h*36e5;const m=Math.floor(ms/6e4);ms-=m*6e4;const s=Math.floor(ms/1e3);
  const z=n=>String(n).padStart(2,'0');
  return `${d}天 ${z(h)}时 ${z(m)}分 ${z(s)}秒`;
}
function quota(iw){
  const out=[];
  GB.quota.forEach((q,i)=>{
    const bw=Math.max(10,Math.min(40,iw-9)), f=Math.round(q.usedPct/100*bw);
    out.push(lr(c('b',q.agent)+c('d',' · ')+q.window,c('d','重置 ')+c('T',i+'|'+cdText(i)),iw));
    out.push('['+c(q.usedPct>=60?'h':'b','■'.repeat(f))+c('x','□'.repeat(bw-f))+'] '+c('b',String(q.usedPct).padStart(3)+'%'));
    const pace=q.pace>0?c('i',' ▲ +'+Math.round(q.pace*100)+'% ')+' 快于匀速':c('d','▼ '+Math.round(q.pace*100)+'%  慢于匀速');
    const mx=Math.max(1,...q.history);
    const spark=q.history.map(v=>BLK[Math.max(1,Math.round(v/mx*8))]).join('');
    out.push(lr(c('d','配速 ')+pace,c('d','燃尽 ')+c('b',spark),iw));
    out.push('');
  });
  out.pop();
  return out;
}
function log(iw){
  const out=[];
  GB.activity.forEach(a=>{
    const when=mmdd(a.t)+' '+hhmm(a.t);
    const left=c('d',when+' ▸ ')+(a.public?c('b',a.repo):c('d','░ ')+'私有项目');
    out.push(a.public?lr(left,c('d',a.branch+'@'+a.hash),iw):left);
    out.push('  '+c('d','└ ')+trunc(a.title,iw-4));
  });
  return out;
}
function heat(iw){
  const W=GB.contrib.length, gut=3, avail=iw-gut, ww=avail>=W*2?2:1, one=avail>=W*ww;
  const bands=one?[[0,W]]:[[0,27],[27,W]];
  const dow=new Date(todayMs).getUTCDay(), base=todayMs-dow*864e5, out=[];
  const lab={1:'一',3:'三',5:'五'};
  const LV=[['x','·'],['d','∙'],['','•'],['b','●'],['h','█']];
  const lvl=v=>v===0?0:v<4?1:v<10?2:v<20?3:4;
  out.push(lr(c('d','近一年 ')+c('b',nf(GB.contributions.total))+c('d',' 次贡献'),c('d','少 ')+LV.map(l=>c(l[0],l[1])).join(' ')+c('d',' 多'),iw));
  bands.forEach(([b0,b1],bi)=>{
    if(bi)out.push('');
    const len=(b1-b0)*ww, mr=Array(len).fill(' '); let end=-1;
    for(let w=b0;w<b1;w++){
      const dt=new Date(base-(W-1-w)*7*864e5);
      if(dt.getUTCDate()<=7){
        const pos=(w-b0)*ww, txt=(dt.getUTCMonth()+1)+'月', tw=width(txt);
        if(pos>end&&pos+tw<=len){let k=pos;for(const ch of txt){mr[k]=ch;if(cw(ch)===2){mr[k+1]='';k+=2;}else k++;}end=pos+tw+0;}
      }
    }
    out.push(sp(gut)+c('d',mr.join('')));
    for(let d=0;d<7;d++){
      let s=c('d',pad(lab[d]||'',gut));
      for(let w=b0;w<b1;w++){
        if(w===W-1&&d>dow){s+=sp(ww);continue;}
        const l=LV[lvl(GB.contrib[w][d])];
        const isToday=w===W-1&&d===dow;
        s+=c(isToday?'i':l[0],l[1].repeat(ww));
      }
      out.push(s);
    }
  });
  return out;
}

/* ========== 整屏组装 ========== */
function build(cols){
  const wide=cols>=118, gap=2;
  const w1=wide?Math.floor((cols-gap)/2):cols, w2=wide?cols-gap-w1:cols;
  const P={today:today(w1-4),trend:trend(w1-4),quota:quota(w2-4),log:log(w2-4),heat:heat(cols-4)};
  const scr=[];
  if(wide){
    const hA=Math.max(P.today.length,P.quota.length)+2, hB=Math.max(P.trend.length,P.log.length)+2;
    scr.push(...join2(box('SYS:USAGE','今日用量',P.today,w1,hA),box('SYS:QUOTA','额度 · 配速',P.quota,w2,hA,true),gap));
    scr.push(...join2(box('SYS:TREND','近 30 天趋势',P.trend,w1,hB),box('SYS:LOG','最近活动',P.log,w2,hB),gap));
  }else{
    scr.push(...box('SYS:USAGE','今日用量',P.today,cols,0));
    scr.push(...box('SYS:TREND','近 30 天趋势',P.trend,cols,0));
    scr.push(...box('SYS:QUOTA','额度 · 配速',P.quota,cols,0,true));
  }
  scr.push(...box('SYS:GITHUB','贡献热力图',P.heat,cols,0));
  if(!wide)scr.push(...box('SYS:LOG','最近活动',P.log,cols,0));
  scr.push('');
  scr.push(c('d','glassbox@'+GB.owner)+' $ '+c('b','status --readonly')+' '+c('K','█'));
  return {hdr:hdr(cols),boot:bootLines(cols),scr};
}

/* ========== 渲染与动画 ========== */
const $=id=>document.getElementById(id);
let st={cols:0,bootChars:0,bootTotal:0,lines:0,phase:reduce?3:0,model:null};
const nowMs=()=>t0+(performance.now()-tStart);
const tStart=performance.now();

function measure(){
  const w=$('meas').getBoundingClientRect().width/ [...$('meas').textContent].length;
  return w;
}
function render(){
  const cs=getComputedStyle(document.body), pad=parseFloat(getComputedStyle(document.querySelector('.wrap')).paddingLeft);
  const chw=measure();
  const avail=document.documentElement.clientWidth-pad*2;
  const cols=Math.max(40,Math.min(170,Math.floor(avail/chw)));
  st.cols=cols; st.model=build(cols);
  $('grid').style.width=(cols*chw)+'px';
  $('hdr').innerHTML=st.model.hdr.map(l=>`<div class="ln">${html(l)}</div>`).join('');
  st.bootTotal=st.model.boot.reduce((a,l)=>a+l.length+1,0);
  paintBoot();
  $('scr').innerHTML=st.model.scr.map((l,i)=>`<div class="ln${i>=st.lines&&st.phase<3?' hid':''}">${html(l)}</div>`).join('');
  $('summary').textContent=`今日请求 ${nf(GB.today.requests)} 次，费用 ${usd(GB.today.costUsdApiEquivalent)}（API 等价估算），缓存命中率 ${(GB.today.cacheHitRate*100).toFixed(1)}%。`;
  tickSecond();
}
function paintBoot(){
  let left=st.phase>=1?1e9:st.bootChars, out='';
  for(const l of st.model.boot){
    if(left<=0)break;
    const part=l.slice(0,left); left-=l.length+1;
    out+=`<div class="ln d">${cells(part)}</div>`;
  }
  $('boot').innerHTML=out+(out?'':'');
}
function tickSecond(){
  document.querySelectorAll('.T').forEach(el=>{el.innerHTML=cells(cdText(+el.dataset.i));});
  const d=new Date(nowMs()+9*36e5), z=n=>String(n).padStart(2,'0');
  $('clock').textContent=`JST ${z(d.getUTCHours())}:${z(d.getUTCMinutes())}:${z(d.getUTCSeconds())}`;
}
$('stOwner').textContent='glassbox@'+GB.owner;

let lastT=0, lastSec=-1, lastBlink=true, frame=0;
function tick(t){
  frame++;
  if(!reduce){
    if(st.phase===0){                     // 开机自检：逐字打字
      st.bootChars+=8; paintBoot();
      if(st.bootChars>=st.bootTotal){st.phase=1;}
    }else if(st.phase===1){               // 面板逐行扫入
      const kids=$('scr').children; const step=5;
      for(let k=0;k<step&&st.lines<kids.length;k++){kids[st.lines].classList.remove('hid');st.lines++;}
      if(st.lines>=kids.length)st.phase=3;
    }
    const on=Math.floor(t/530)%2===0;
    if(on!==lastBlink){lastBlink=on;
      document.querySelectorAll('.cur').forEach(e=>e.classList.toggle('off',!on));
      $('dot').classList.toggle('off',!on);}
    $('flick').style.opacity=(Math.random()*0.025).toFixed(3);
    $('roll').style.transform=`translateY(${((t/9000)%1)*(innerHeight+180)-90}px)`;
  }
  const sec=Math.floor(t/1000);
  if(sec!==lastSec){lastSec=sec;tickSecond();}
}
function loop(t){requestAnimationFrame(loop);if(t-lastT<66)return;lastT=t;tick(t);}  // 降帧到约 15fps

let rt;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120);});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{render();requestAnimationFrame(loop);});
})();
</script>
