<!doctype html>
<html lang="zh-CN" data-theme="slate">
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.dataset.theme=t;})();</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glassbox 驾驶舱 v9</title>
<!--
  C-v9 = C-v8 + 分组与疏密（01 今天 / 02 机器 / 03 代码 / 04 花费 / 05 运维）、机器一台一行、克制的小动效
         （状态点呼吸、进度条生长、KPI 数字滚动、面板依次淡入、行悬停、热力图悬停提示；减少动态效果或 ?t= 时全部关闭）。
  C-v8 = C-v7 + 语义色与信息徽章（对照参考站：颜色表达状态/类别，徽章都是真实数据）。
  - 语义色：石绿=正常、橘=警告、朱=异常、青莲=强调；石青/雌黄仍是 Claude/Codex。
  - 每个面板标题：像素图标 + 计数徽章；仓库标签按名字固定配色；额度、资源条、在线率按数值变色。
  - 直接读 glassbox.page/1（schema/CONTRACT.md §2）。数据：sample-page.js（generate.py 生成，虚构）。
  - ?view=public 看公开快照：私有名字是导出时就替换掉的占位块，再加模糊（真实文本不在页面里）。
  - ?theme=slate（默认：更暗的底 + 半透明面板）|slate1（上一版）|slate0（再上一版）|graphite|ink、?t=秒（冻结背景帧）、?fx=crt。
-->
<style>
  :root{
    --bg:#0f1218; --panel:rgba(17,21,29,.78); --fg:#6c97d6; --hi:#efeadd; --text:#d8d3c4; --dim:#8f8b80; --or:#dba843;
    --bad:#e0645a; --ok:#79b98a; --warn:#e3894d; --vio:#a48ee0; --line:rgba(216,211,196,.12); --soft:rgba(216,211,196,.07);
    --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  :root[data-theme="graphite"]{--bg:#1d2129;--panel:rgba(37,42,52,.72);--dim:#9b978c;--line:rgba(216,211,196,.14);--soft:rgba(216,211,196,.08)}
  :root[data-theme="slate0"]{--bg:#272c35;--panel:rgba(48,54,65,.7);--dim:#a6a297;--line:rgba(216,211,196,.16);--soft:rgba(216,211,196,.09)}
  :root[data-theme="slate1"]{--bg:#1b1f26;--panel:rgba(45,51,61,.94);--dim:#a6a297;--line:rgba(216,211,196,.16);--soft:rgba(216,211,196,.09)}
  /* slate（默认）：更暗的底；面板 75% 不透明，颜色按底色反推，使空白处看起来仍是 #2d333d，
     而背景的流动能透过面板看到（模糊减半，保留形状） */
  :root[data-theme="slate"]{--bg:#14171c;--panel:rgba(53,60,72,.75);--blur:3px;--dim:#a6a297;--line:rgba(216,211,196,.16);--soft:rgba(216,211,196,.09)}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;color:var(--text);font:14px/1.55 var(--sans);overflow-x:hidden;background:var(--bg);-webkit-font-smoothing:antialiased}
  svg{display:block}
  .in{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 24px}
  @media (max-width:640px){.in{padding:0 16px}}
  #art{position:fixed;left:0;right:0;bottom:0;width:100%;height:62vh;z-index:0;pointer-events:none;
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 100%)}

  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0}
  .brand{font:700 19px var(--mono);color:var(--hi);letter-spacing:.02em}
  .meta{display:flex;gap:8px;align-items:center;font:12px var(--mono);color:var(--dim);flex-wrap:wrap}
  .chip{color:var(--bg);background:var(--fg);padding:2px 8px;font-weight:600}
  .chip.line{background:none;color:var(--dim);border:1px solid var(--line);font-weight:400}

  .pn{background:var(--panel);border:1px solid var(--line);padding:16px 18px 18px;margin-bottom:14px;
    -webkit-backdrop-filter:blur(var(--blur,6px));backdrop-filter:blur(var(--blur,6px));min-width:0}
  .ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
  .ph h2{margin:0;font:600 15px var(--sans);color:var(--hi)}
  .ph .r{font:12px var(--mono);color:var(--dim);white-space:nowrap}
  .grid2{display:grid;grid-template-columns:7fr 5fr;gap:14px;margin-bottom:14px}
  .grid2>.pn{margin-bottom:0}
  @media (max-width:960px){.grid2{grid-template-columns:1fr}}

  .lab{font-size:13px;color:var(--dim);margin:0 0 2px}
  .val{font:600 28px/1.2 var(--mono);color:var(--hi);font-variant-numeric:tabular-nums}
  .val.c{color:var(--fg)} .val.o{color:var(--or)}
  .sub{font:12px var(--mono);color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr)}
  .kpis>div{padding:0 18px;border-left:1px solid var(--soft);min-width:0}
  .kpis>div:first-child{padding-left:0;border-left:0}
  @media (max-width:960px){.kpis{grid-template-columns:repeat(3,1fr);row-gap:16px}.kpis>div:nth-child(4){padding-left:0;border-left:0}}
  @media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpis>div{padding:0 0 0 14px}.kpis>div:nth-child(odd){padding-left:0;border-left:0}.kpis>div:nth-child(4){padding-left:14px;border-left:1px solid var(--soft)}}

  .qs{display:grid;grid-template-columns:repeat(3,1fr)}
  .qs>article{padding:0 18px;border-left:1px solid var(--soft);min-width:0}
  .qs>article:first-child{padding-left:0;border-left:0}
  .qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .qh b{font-weight:500;color:var(--text)} .qh .val{font-size:22px}
  .qbar{margin:8px 0 6px}
  .qf{display:flex;justify-content:space-between;gap:8px;font:12px var(--mono);color:var(--dim)}
  .hot{color:var(--or)} .ok{color:var(--fg)}
  @media (max-width:760px){.qs{grid-template-columns:1fr;row-gap:16px}.qs>article{padding:0;border-left:0}}

  /* 机器 */
  .ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0}
  .ms>article{padding:0 16px;border-left:1px solid var(--soft);min-width:0;margin-bottom:4px}
  .ms>article:first-child{padding-left:0;border-left:0}
  @media (max-width:760px){.ms{grid-template-columns:1fr 1fr;row-gap:18px}.ms>article:nth-child(odd){padding-left:0;border-left:0}}
  @media (max-width:460px){.ms{grid-template-columns:1fr}.ms>article{padding:0;border-left:0}}
  .mh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .code{font:700 12px var(--mono);color:var(--bg);background:var(--text);padding:0 5px;line-height:18px}
  .mh b{font-weight:600;color:var(--hi);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st{width:8px;height:8px;display:inline-block;flex:none}
  .st.up{background:var(--fg)} .st.down{background:var(--bad)} .st.off{background:none;border:1px solid var(--dim)}
  .st.pending,.st.maintenance,.st.paused{background:var(--or)} .st.unknown{background:var(--dim);opacity:.5}
  .mm{font:12px var(--mono);color:var(--dim);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow{display:grid;grid-template-columns:34px 1fr 74px;gap:8px;align-items:center;font:12px var(--mono);color:var(--dim);margin:3px 0}
  .mrow span:last-child{text-align:right;color:var(--text)}
  .spark{margin-top:8px}
  .mf{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--dim);margin-top:4px}

  /* 表格 */
  .tb{width:100%;border-collapse:collapse;font-size:13px}
  .tb td,.tb th{padding:6px 0;border-top:1px solid var(--soft);vertical-align:middle;text-align:left}
  .tb tr:first-child td{border-top:0}
  .tb th{font:500 12px var(--sans);color:var(--dim);border-top:0;padding-top:0}
  .tb .n{color:var(--text);white-space:nowrap;padding-right:10px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .tb .m{font-family:var(--mono)}
  .tb .v{font:13px var(--mono);color:var(--hi);text-align:right;white-space:nowrap;padding-left:10px}
  .tb .p{font:11.5px var(--mono);color:var(--dim);text-align:right;width:58px;padding-left:8px;white-space:nowrap}
  .tb .bar{width:38%} .tb .bar svg{width:100%;height:6px}
  .tb .k{font:11.5px var(--mono);color:var(--dim);white-space:nowrap}
  @media (max-width:560px){.tb .bar{width:22%}.hide-s{display:none}}
  .sep{height:16px}

  .heat{position:relative;margin:18px 0 0 22px}
  .heat .ml{position:absolute;top:-17px;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .heat .wl{position:absolute;left:-22px;font-size:11px;color:var(--dim);transform:translateY(-50%)}
  .hleg{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
  .hleg i{width:9px;height:9px;display:inline-block}
  .hfoot{display:flex;justify-content:space-between;margin-top:10px;font:12px var(--mono);color:var(--dim);gap:12px;flex-wrap:wrap}

  .chart{position:relative;padding-left:40px}
  .yl{position:absolute;left:0;width:34px;text-align:right;font:11px var(--mono);color:var(--dim)}
  .xl{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--dim);margin:6px 0 0 40px}
  .leg{display:flex;gap:14px;font-size:12px;color:var(--dim)}
  .leg i{display:inline-block;width:8px;height:8px;margin-right:5px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--soft)}
  .stats .val{font-size:17px}
  @media (max-width:560px){.stats{grid-template-columns:1fr 1fr}}

  .act{list-style:none;margin:0;padding:0}
  .act li{display:grid;grid-template-columns:96px 330px 1fr;gap:2px 14px;padding:8px 0;border-top:1px solid var(--soft);align-items:baseline}
  .act li:first-child{border-top:0;padding-top:0}
  .act time{font:12px var(--mono);color:var(--dim)}
  .act .p{color:var(--hi);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act .p small{font:11px var(--mono);color:var(--dim);font-weight:400;margin-left:6px}
  .act .d{color:var(--text)}
  @media (max-width:760px){.act li{grid-template-columns:1fr;gap:0}}

  /* 模糊占位：内容是固定的占位字符，不是真实文本 */
  .mask{display:inline-block;font:12px var(--mono);letter-spacing:-1px;color:var(--dim);filter:blur(3.5px);user-select:none;vertical-align:middle}
  .grp{color:var(--dim);font-weight:500}
  .grp::before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;background:repeating-linear-gradient(45deg,var(--dim) 0 2px,transparent 2px 4px)}
  .hiddenpn{font:12px var(--mono);color:var(--dim);padding:6px 0}
  .tags{display:flex;flex-wrap:wrap;gap:6px 14px;font:12px var(--mono);color:var(--dim)}
  .tags span{display:inline-flex;align-items:center;gap:6px}

  /* 标题、图标、徽章 */
  .ph h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;white-space:nowrap}
  @media (max-width:560px){.ph{flex-wrap:wrap}.ph .r{white-space:normal}}
  .ic{display:inline-block;flex:none}
  .cnt{font:500 11.5px var(--mono);color:var(--dim);border:1px solid var(--line);padding:0 6px;line-height:18px}
  .bd{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);padding:0 6px;line-height:17px;
    border:1px solid color-mix(in srgb,currentColor 45%,transparent);background:color-mix(in srgb,currentColor 12%,transparent);white-space:nowrap}
  .bd.dot::before{content:"";width:6px;height:6px;background:currentColor}
  .bds{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-vio{color:var(--vio)} .c-fg{color:var(--fg)} .c-or{color:var(--or)} .c-dim{color:var(--dim)}
  .val.g{color:var(--ok)} .val.v{color:var(--vio)} .val.w{color:var(--warn)}
  .rel{font:11.5px var(--mono);color:var(--dim);white-space:nowrap}
  /* 分组：组间疏、组内密 */
  .grp-h{display:flex;align-items:baseline;gap:10px;margin:34px 0 10px;font:600 11px var(--mono);color:var(--dim);letter-spacing:.14em}
  .grp-h b{color:var(--hi);font-weight:700}
  .grp-h::after{content:"";flex:1;height:1px;background:var(--line);transform:translateY(-3px)}
  .grp-h:first-of-type{margin-top:6px}
  .pn{margin-bottom:10px}
  .grid2{gap:10px;margin-bottom:10px}
  /* 层级：主 KPI 舒展，表格紧凑，次要信息更淡更小 */
  .hero{padding:20px 22px 22px}
  .hero .val{font-size:34px}
  .hero .lab{font-size:12.5px;letter-spacing:.04em}
  .tb td{padding:4px 0} .tb{font-size:12.5px}
  .tb th{font-size:11px;letter-spacing:.06em}
  .rel,.mf,.k{opacity:.8}
  /* 机器：一台一行 */
  .mlist{display:grid;gap:0}
  .mline{display:grid;grid-template-columns:220px repeat(3,minmax(100px,130px)) minmax(160px,1fr) 180px;gap:0 22px;align-items:center;
    padding:11px 0;border-top:1px solid var(--soft)}
  .mline:first-child{border-top:0;padding-top:2px}
  .mline .id{min-width:0}
  .mline .id .mh{margin-bottom:5px}
  .metric .lab{font:11px var(--mono);margin:0 0 3px;display:flex;justify-content:space-between}
  .metric .lab b{font-weight:500;color:var(--text)}
  .metric svg{width:100%;height:6px}
  .mline .spark{margin:0}
  .mline .side{font:11.5px var(--mono);color:var(--dim);display:grid;gap:4px;justify-items:end;text-align:right}
  .mline.off{opacity:.62}
  @media (max-width:560px){.mline{grid-template-columns:1fr}.metric .lab span{min-width:32px}}
  @media (max-width:1000px){.mline{grid-template-columns:1fr 1fr 1fr;row-gap:10px}.metric .lab{white-space:nowrap}.mline .id,.mline .spark,.mline .side{grid-column:1/-1}.mline .side{justify-items:start;text-align:left;display:flex;flex-wrap:wrap;gap:6px}}
  /* 动效 */
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}60%{box-shadow:0 0 0 4px transparent}}
  .bd.dot.live::before{animation:breathe 2.4s ease-out infinite}
  .st.live{animation:breathe 2.4s ease-out infinite;color:var(--ok)}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .anim .growbar{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .anim .pn{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
  .tb tr:hover td,.act li:hover{background:color-mix(in srgb,var(--hi) 4%,transparent)}
  .mline:hover{background:color-mix(in srgb,var(--hi) 3%,transparent)}
  .heat rect:hover{stroke:var(--hi);stroke-width:1.2}
  #tip{position:fixed;z-index:80;pointer-events:none;font:11.5px var(--mono);color:var(--hi);background:rgba(10,12,16,.92);
    border:1px solid var(--line);padding:3px 8px;opacity:0;transition:opacity .12s}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .anim .qmark{animation:blink 2s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.bd.dot.live::before,.st.live{animation:none}}
  .cap{display:flex;justify-content:space-between;gap:12px;font:12px var(--mono);color:var(--dim);padding:6px 0 0}
  @media (max-width:640px){.cap{flex-direction:column;gap:2px}}
  .tail{height:34vh}
  .fx{position:fixed;inset:0;pointer-events:none;display:none}
  .crt .fx{display:block}
  .scan{z-index:60;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0,rgba(0,0,0,.2) 1px,transparent 1px,transparent 3px)}
  .vig{z-index:61;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%)}
</style>
</head>
<body>
<canvas id="art" role="img" aria-label="今日画作：由今日用量生成的方块格点地形与光点，远山是近 30 天费用"></canvas>

<div class="in">
  <header class="top">
    <div class="brand">glassbox</div>
    <div class="meta"><span class="chip" id="viewChip"></span><span class="chip line" id="stamp"></span><span id="clock"></span></div>
  </header>

  <div class="grp-h"><b>01</b>今天</div>
  <section class="pn hero" aria-labelledby="h-today">
    <div class="ph"><h2 id="h-today"><i class="ic" data-g="bolt" data-c="fg"></i>今日用量<span class="cnt" id="todayN"></span></h2><span class="r">费用为 API 等价估算</span></div>
    <div class="kpis">
      <div><p class="lab">请求</p><div class="val c" id="kReq" data-n></div><div class="sub" id="kReqS"></div></div>
      <div><p class="lab">费用</p><div class="val g" id="kCost" data-n></div><div class="sub" id="kCostS"></div></div>
      <div><p class="lab">Token</p><div class="val" id="kTok" data-n></div><div class="sub" id="kTokS"></div></div>
      <div><p class="lab">缓存命中</p><div class="val v" id="kHit" data-n></div><div class="sub" id="kHitS"></div></div>
      <div><p class="lab">会话</p><div class="val w" id="kSes" data-n></div><div class="sub" id="kSesS"></div></div>
    </div>
  </section>
  <section class="pn" aria-labelledby="h-quota">
    <div class="ph"><h2 id="h-quota"><i class="ic" data-g="gauge" data-c="or"></i>额度<span class="cnt" id="quotaN"></span></h2><span class="r">▏= 匀速位置</span></div>
    <div class="qs" id="quota"></div>
  </section>

  <div class="grp-h"><b>02</b>机器</div>
  <section class="pn" aria-labelledby="h-mach">
    <div class="ph"><h2 id="h-mach"><i class="ic" data-g="server" data-c="ok"></i>机器<span class="cnt" id="machN"></span></h2><span class="r" id="machR"></span></div>
    <div class="mlist" id="machines"></div>
  </section>

  <div class="grp-h"><b>03</b>代码</div>
  <section class="pn" aria-labelledby="h-heat">
    <div class="ph"><h2 id="h-heat"><i class="ic" data-g="grid" data-c="ok"></i>提交<span class="cnt" id="heatN"></span></h2><span class="r" id="heatR"></span></div>
    <div id="heat"></div>
    <div class="hfoot"><span id="heatStat"></span><span class="hleg" id="hleg"></span></div>
  </section>
  <section class="pn" aria-labelledby="h-act">
    <div class="ph"><h2 id="h-act"><i class="ic" data-g="branch" data-c="bad"></i>最近活动<span class="cnt" id="actN"></span></h2><span class="r" id="actR"></span></div>
    <ul class="act" id="act"></ul>
  </section>

  <div class="grp-h"><b>04</b>花费</div>
  <div class="grid2">
    <section class="pn" aria-labelledby="h-trend">
      <div class="ph"><h2 id="h-trend"><i class="ic" data-g="bars" data-c="or"></i>近 30 天费用</h2><span class="leg"><span><i style="background:#6c97d6"></i>Claude Code</span><span><i style="background:#dba843"></i>Codex</span></span></div>
      <div class="chart" id="trend"></div>
      <div class="xl" id="trendX"></div>
      <div class="stats" id="trendStats"></div>
      <div class="sep"></div>
      <table class="tb" id="trendAgents"></table>
      <div class="sep"></div>
      <div class="lab" style="margin-bottom:6px">按星期的平均费用</div>
      <div id="weekday"></div>
    </section>
    <section class="pn" aria-labelledby="h-tok">
      <div class="ph"><h2 id="h-tok"><i class="ic" data-g="pie" data-c="vio"></i>今日构成</h2><span class="r">Token / 模型 / 项目</span></div>
      <table class="tb" id="tokens"></table>
      <div class="sep"></div>
      <table class="tb" id="models"></table>
      <div class="sep"></div>
      <table class="tb" id="projects"></table>
    </section>
  </div>

  <div class="grp-h"><b>05</b>运维</div>
  <div class="grid2">
    <section class="pn" aria-labelledby="h-svc">
      <div class="ph"><h2 id="h-svc"><i class="ic" data-g="box" data-c="ok"></i>服务<span class="cnt" id="svcN"></span></h2><span class="r" id="svcR"></span></div>
      <table class="tb" id="services"></table>
    </section>
    <section class="pn" aria-labelledby="h-rt">
      <div class="ph"><h2 id="h-rt"><i class="ic" data-g="term" data-c="vio"></i>Agent 运行时<span class="cnt" id="rtN"></span></h2></div>

      <table class="tb" id="jobs"></table>
      <div class="sep"></div>
      <div class="ph" style="margin-bottom:8px"><h2 style="font-size:14px">tailnet</h2><span class="r" id="tnN"></span></div>
      <div id="tailnet"></div>
    </section>
  </div>

  <div class="cap"><span id="cap0"></span><span id="capMid"></span><span id="cap1"></span></div>

</div>
<div class="fx scan"></div><div class="fx vig"></div><div id="tip"></div>

<script src="sample-page.js"></script>
<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
const VIEW=Q.get('view')==='public'?'public':'private';
const GB=window.GB_PAGES[VIEW], T0=Date.parse(GB.generatedAt);
const FROZEN=Q.has('t')&&isFinite(parseFloat(Q.get('t')))?parseFloat(Q.get('t')):null;
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STATIC=FROZEN!==null||REDUCE;
const $=id=>document.getElementById(id);
if(Q.get('fx')==='crt')document.body.classList.add('crt');
const HIDDEN=new Set(GB.hidden||[]);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Text：明文 / 模糊占位 / 合并组（CONTRACT §0.1） */
const T=v=>v&&typeof v==='object'&&v.masked?(v.group==='private'?'<span class="grp">私有项目</span>':'<span class="mask" aria-label="已隐藏">████████</span>'):esc(v??'');
const nf=n=>Math.round(n).toLocaleString('en-US');
const fm=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+'M':nf(n/1e3)+'K';
const fb=n=>n>=1e12?(n/1e12).toFixed(1)+'T':n>=1e9?(n/1e9).toFixed(1)+'G':(n/1e6).toFixed(0)+'M';
const usd=n=>'$'+n.toFixed(2);
const tzOff=9*36e5; // 页面时区：数据里的 tz（样稿固定 Asia/Tokyo）
const loc=iso=>new Date(Date.parse(iso)+tzOff);
const mmdd=iso=>{const d=loc(iso);return String(d.getUTCMonth()+1).padStart(2,'0')+'/'+String(d.getUTCDate()).padStart(2,'0');};
const hhmm=iso=>{const d=loc(iso);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');};
const ago=iso=>{if(!iso)return '—';const s=(T0-Date.parse(iso))/1e3;return s<90?'刚刚':s<5400?Math.round(s/60)+' 分钟前':s<172800?Math.round(s/3600)+' 小时前':Math.round(s/86400)+' 天前';};
const dur=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d?`${d}天${h}时`:`${h}时`;};
const dayMs=864e5;
const BLUE='#6c97d6', HI='#efeadd', OR='#dba843', BAD='#e0645a', OK='#79b98a', WARN='#e3894d', VIO='#a48ee0';
/* 语义：level(占用比例) → 颜色类；仓库标签按名字固定取色 */
const lvlCls=f=>f>=0.9?'c-bad':f>=0.75?'c-warn':'c-ok';
const lvlIdx=f=>f>=0.9?3:f>=0.75?5:4;
const TAGS=['#e07a8a','#7fa8e8','#79b98a','#d9a441','#a48ee0','#5fb7b0','#e3894d','#c68fd0'];
const hue=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return TAGS[h%TAGS.length];};
const bd=(t,cls='',dot=false,style='',live=false)=>`<span class="bd ${cls}${dot?' dot':''}${live?' live':''}"${style?` style="${style}"`:''}>${t}</span>`;
const repoTag=r=>typeof r==='string'?bd(esc(r),'',true,`color:${hue(r)}`):(r&&r.group==='private'?'<span class="grp">私有项目</span>':bd('<span class="mask">██████</span>','c-dim',true));
const agTag=a=>bd(AG[a],a==='codex'?'c-or':'c-fg',true);
/* 像素图标：5×5 位图，和页面格点同一语言 */
const GLYPH={bolt:['00110','01100','11111','00110','01100'],gauge:['01110','10001','10101','10011','11111'],
  server:['11111','10001','11111','10001','11111'],grid:['10101','01010','10101','01010','10101'],bars:['00001','00101','10101','10101','11111'],
  pie:['01110','11011','11001','11111','01110'],box:['11111','10001','10101','10001','11111'],term:['10000','01000','00100','01000','10011'],
  branch:['10001','10001','11010','10100','10000']};
const ICOLOR={fg:'#6c97d6',or:'#dba843',ok:'#79b98a',vio:'#a48ee0',bad:'#e0645a'};
document.querySelectorAll('.ic').forEach(el=>{const g=GLYPH[el.dataset.g],c=ICOLOR[el.dataset.c]||HI;
  el.innerHTML=`<svg width="15" height="15" viewBox="0 0 15 15">${g.flatMap((row,r)=>[...row].map((v,k)=>v==='1'?`<rect x="${k*3}" y="${r*3}" width="2.4" height="2.4" fill="${c}"/>`:'')).join('')}</svg>`;});
const AG={'claude-code':'Claude Code','codex':'Codex'};
const WIN={'7d':'7 天','5h':'5 小时'}, WMS={'7d':7*dayMs,'5h':5*36e5};
const ROLE={dev:'开发',work:'工作',deploy:'部署',gitea:'Gitea'}, OS={macos:'macOS',windows:'Windows',linux:'Linux'};

$('viewChip').textContent=VIEW==='public'?'公开快照':'私有视图';
$('stamp').textContent='更新于 '+mmdd(GB.generatedAt)+' '+hhmm(GB.generatedAt);

/* 固定点径方块格点 */
const COL=[BLUE,HI,OR,BAD,OK,WARN,VIO];
function cells(nc,nr,level,o={}){
  const p=o.pitch||6, px=o.px||Math.round(p*0.72*10)/10, half=px/2, out=[];
  for(let c=0;c<nc;c++)for(let r=0;r<nr;r++){
    const v=level(c,r); if(!v)continue;
    out.push(`<rect x="${(c*p+p/2-half).toFixed(2)}" y="${(r*p+p/2-half).toFixed(2)}" width="${px}" height="${px}" fill="${COL[v[1]||0]}" fill-opacity="${v[0].toFixed(3)}"/>`);
  }
  const w=nc*p,h=nr*p;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${out.join('')}</svg>`;
}
const fits=[];
function fit(id,fn){const el=$(id);const run=()=>{const w=el.clientWidth;if(w)el.innerHTML=fn(w);};run();fits.push(run);}
let barN=0;
function bar(frac,ci){return `<svg viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="6" fill="${BLUE}" fill-opacity=".08"/><rect class="growbar" style="--d:${(barN++%12)*40}ms" width="${Math.max(0.8,Math.min(1,frac)*100).toFixed(2)}" height="6" fill="${COL[ci]}" fill-opacity=".85"/></svg>`;}

/* ---------- 今日用量 ---------- */
const TD=GB.today, TK=TD.tokens;
const totTok=TK.input+TK.output+TK.cacheRead+TK.cacheWrite;
const tr=GB.trend, nT=tr.length, tsum=d=>d.costUsd['claude-code']+d.costUsd.codex;
const totals=tr.map(tsum), maxT=Math.max(...totals), miT=totals.indexOf(maxT);
const avg7=totals.slice(-7).reduce((a,b)=>a+b,0)/7;
const byA=Object.fromEntries(TD.byAgent.map(a=>[a.agent,a]));
$('kReq').textContent=nf(TD.requests);
$('kReqS').innerHTML=`<span class="c-fg">Claude ${nf(byA['claude-code']?.requests||0)}</span> · <span class="c-or">Codex ${nf(byA.codex?.requests||0)}</span>`;
$('kCost').textContent=usd(TD.costUsd);
const dv=TD.costUsd/avg7-1;
$('kCostS').innerHTML=`<span class="${dv>0.2?'c-warn':dv<-0.2?'c-ok':''}">${dv>=0?'▲':'▼'} ${Math.abs(Math.round(dv*100))}%</span> vs 7 日均 ${usd(avg7)}`
$('kTok').textContent=fm(totTok);
$('kTokS').innerHTML=`↓${fm(TK.input)} · ↑${fm(TK.output)} · <span class="c-vio">⚡${fm(TK.reasoning)}</span>`;
$('kHit').textContent=(TD.cacheHitRate*100).toFixed(1)+'%';
$('kHitS').textContent=`命中 ${fm(TK.cacheRead)} · 写 ${fm(TK.cacheWrite)}`;
$('kSes').textContent=TD.sessions;
$('kSesS').innerHTML=`${nf(TD.requests/Math.max(1,TD.sessions))} 请求/会话 · <span class="c-ok">● ${(GB.runtimes||[]).reduce((a,r)=>a+r.activeSessions,0)} 活跃</span>`;
$('todayN').innerHTML=`${TD.byModel.length} 个模型 · `+(TD.unpricedRequests?`<span class="c-warn">${TD.unpricedRequests} 未定价</span>`:'<span class="c-ok">全部定价</span>');

/* ---------- 额度 ---------- */
function pace(q,now){
  const reset=Date.parse(q.resetsAt), W=WMS[q.window], e=Math.min(1,Math.max(0.001,(now-(reset-W))/W));
  const diff=q.usedPct/100/e-1;
  const d=ms=>{const h=Math.floor(ms/36e5),m=Math.round(ms%36e5/6e4);return h>=24?`${Math.floor(h/24)}天${h%24}时`:h>0?`${h}时${m}分`:`${m}分`;};
  if(diff<=0)return {e,reset,hot:false,txt:`慢于匀速 ${Math.round(-diff*100)}%`};
  const el=e*W, tEx=(100-q.usedPct)/(q.usedPct/el), early=(reset-now)-tEx;
  return {e,reset,hot:true,txt:`快 ${Math.round(diff*100)}% · 早 ${d(early)}用完`};
}
function cd(ms){ms=Math.max(0,ms);const d=Math.floor(ms/dayMs);ms-=d*dayMs;const h=Math.floor(ms/36e5);ms-=h*36e5;const m=Math.floor(ms/6e4);
  const z=x=>String(x).padStart(2,'0');return (d?d+'天 ':'')+z(h)+':'+z(m);}
const multiAcct=new Set(GB.quota.map(q=>q.agent+q.account)).size>new Set(GB.quota.map(q=>q.agent)).size;
$('quotaN').textContent=`${GB.quota.length} 个窗口`;
const fmtAbs=iso=>`${mmdd(iso)} ${hhmm(iso)}`;
$('quota').innerHTML=GB.quota.map((q,i)=>{
  const P=pace(q,T0), f=q.usedPct/100, cls=lvlCls(f);
  return `<article><div class="qh"><b>${agTag(q.agent)} ${WIN[q.window]}${multiAcct?` <span class="code">${esc(q.account)}</span>`:''}</b><span class="val ${cls}" style="font-size:22px">${Math.round(q.usedPct)}%</span></div>
    <div class="qbar" data-i="${i}"></div>
    <div class="qf"><span>重置 ${fmtAbs(q.resetsAt)} · <span class="cd" data-q="${i}">${cd(P.reset-T0)}</span></span>${bd(P.hot?'偏快':'从容',P.hot?'c-warn':'c-ok')}</div>
    <div class="qf" style="margin-top:3px"><span>${P.txt}</span><span>样本 ${ago(q.sampledAt)}</span></div></article>`;
}).join('');
function qbars(){
  document.querySelectorAll('.qbar').forEach(el=>{
    const w=el.clientWidth; if(!w)return;
    const q=GB.quota[+el.dataset.i], P=pace(q,T0), p=5, nc=Math.floor(w/p), u=Math.round(q.usedPct/100*nc), m=Math.min(nc-1,Math.round(P.e*nc));
    const li=lvlIdx(q.usedPct/100); el.innerHTML=cells(nc,3,(c)=>{if(c===m)return [1,1]; return c<u?[0.55+0.4*(c/nc),li]:[0.1,0];},{pitch:p,px:4}).replace(/(<rect[^>]*fill="#efeadd")/g,'$1 class="qmark"');
  });
}
qbars(); fits.push(qbars);

/* ---------- 机器 ---------- */
const RT=GB.runtimes||[];
const online=GB.machines.filter(m=>m.online).length;
$('machN').textContent=`${online}/${GB.machines.length} 在线`;
$('machR').textContent='Beszel · 24h';
$('machines').innerHTML=GB.machines.map((m,i)=>{
  const s=m.system, pct=(a,b)=>a&&b?a/b:0;
  const met=s?[['CPU',s.cpuPct/100,`${s.cpuPct.toFixed(1)}%`],['内存',pct(s.memUsed,s.memTotal),`${fb(s.memUsed)} / ${fb(s.memTotal)}`],['磁盘',pct(s.diskUsed,s.diskTotal),`${fb(s.diskUsed)} · ${Math.round(pct(s.diskUsed,s.diskTotal)*100)}%`]]:[];
  const ag=RT.filter(r=>r.machine===m.id&&r.activeSessions>0).map(r=>bd(`${AG[r.agent]} ${r.activeSessions}`,r.agent==='codex'?'c-or':'c-fg',true,'',true)).join(' ');
  const probe=m.probeLastReport?bd('探针 '+ago(m.probeLastReport),(T0-Date.parse(m.probeLastReport))>9e5?'c-warn':'c-ok'):bd('无探针','c-dim');
  return `<div class="mline${m.online?'':' off'}">
    <div class="id"><div class="mh"><span class="code">${esc(m.id)}</span><b>${T(m.label)}</b></div>
      <div class="bds">${bd(m.online?'在线':'离线',m.online?'c-ok':'c-bad',true,'',m.online)}${bd(OS[m.os]||m.os,'c-dim')}${bd(ROLE[m.role]||m.role,'c-vio')}</div></div>
    ${met.map(([k,f,v])=>`<div class="metric"><div class="lab"><span>${k}</span><b class="${f>=0.75?lvlCls(f):''}">${v}</b></div>${bar(f,lvlIdx(f))}</div>`).join('')||'<div></div><div></div><div></div>'}
    <div class="spark" data-i="${i}" title="24 小时 CPU"></div>
    <div class="side"><span>${m.online?(s?'运行 '+dur(s.uptimeSec):''):'离线 · '+ago(m.lastSeen)}</span><div class="bds" style="justify-content:flex-end">${probe}${ag?' '+ag:''}</div></div>
  </div>`;
}).join('');
function sparks(){
  document.querySelectorAll('.spark').forEach(el=>{
    const w=el.clientWidth; if(!w)return;
    const h=(GB.machines[+el.dataset.i].history||[]).map(x=>x.cpuPct), n=h.length; if(!n){el.innerHTML='';return;}
    const per=Math.max(1,Math.floor(w/3/n)), nc=per*n, NR=9, mx=Math.max(20,...h);
    el.innerHTML=cells(nc,NR,(c,r)=>{const d=Math.floor(c/per), v=h[d]/mx*NR, rb=NR-1-r; return rb+0.5<=v?[0.5+0.45*rb/NR,0]:[0.06,0];},{pitch:3,px:2.4});
  });
}
sparks(); fits.push(sparks);

/* ---------- 提交热力图 ---------- */
const days=GB.contributions.days;
fit('heat',w=>{
  const W=Math.ceil(days.length/7), WN=w<600?26:W, C0=W-WN;
  const p=Math.max(5,Math.min(24,Math.floor((w-22)/WN))), px=Math.max(4,Math.round(p*0.74));
  const lvl=v=>v===0?0:v<4?1:v<10?2:v<20?3:4, AL=[0.07,0.3,0.52,0.78,1];
  const svg=cells(WN,7,(c,r)=>{const d=days[(C0+c)*7+r]; if(!d)return null; const l=lvl(d.count); return [AL[l],l===4?1:0];},{pitch:p,px});
  let lab='',last=-9;
  for(let k=0;k<WN;k++){const d=days[(C0+k)*7]; if(!d)continue; const dt=new Date(d.date+'T00:00:00Z');
    if(dt.getUTCDate()<=7&&k-last>=Math.ceil(30/p)){last=k;lab+=`<span class="ml" style="left:${k*p}px">${dt.getUTCMonth()+1}月</span>`;}}
  const wl=[[1,'一'],[3,'三'],[5,'五']].map(([d,t])=>`<span class="wl" style="top:${(d+0.5)*p}px">${t}</span>`).join('');
  return `<div class="heat">${lab}${wl}${svg}</div>`;
});
(function(){const tip=$('tip'), el=$('heat');
  el.addEventListener('mousemove',e=>{const r=e.target.closest('rect'); if(!r){tip.style.opacity=0;return;}
    const svg=r.ownerSVGElement, rs=[...svg.querySelectorAll('rect')], W=Math.ceil(days.length/7), WN=el.clientWidth<600?26:W, C0=W-WN;
    const p=+svg.getAttribute('width')/WN, c=Math.floor(+r.getAttribute('x')/p), rr=Math.floor(+r.getAttribute('y')/p), d=days[(C0+c)*7+rr];
    if(!d){tip.style.opacity=0;return;} tip.textContent=`${d.date} · ${d.count} 次提交`; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY-28)+'px'; tip.style.opacity=1;});
  el.addEventListener('mouseleave',()=>{tip.style.opacity=0;});})();
(function(){
  const counts=days.map(d=>d.count), active=counts.filter(v=>v>0).length;
  let streak=0; for(let i=counts.length-1;i>=0&&counts[i]>0;i--)streak++;
  $('heatN').textContent=`${nf(GB.contributions.total)} 次`; $('heatR').textContent='近一年 · GitHub + Gitea + 本地';
  $('heatStat').textContent=`活跃 ${active} 天 · 当前连续 ${streak} 天 · 单日最多 ${Math.max(...counts)} 次`;
})();
$('hleg').innerHTML='少 '+[0.07,0.3,0.52,0.78,1].map((a,i)=>`<i style="background:${i===4?HI:BLUE};opacity:${Math.max(a,0.16)}"></i>`).join('')+' 多';

/* ---------- 趋势 ---------- */
fit('trend',w=>{
  const p=5, avail=w-40, per=Math.max(1,Math.floor(avail/p/nT)), nc=per*nT, NR=w<500?18:22, gapCol=per>=3?per-1:-1;
  const html=cells(nc,NR,(c,r)=>{
    const d=Math.floor(c/per), sub=c%per; if(sub===gapCol)return null;
    const f=totals[d]/maxT*NR, cc=tr[d].costUsd.codex/maxT*NR, rb=NR-1-r, last=d===nT-1;
    if(rb+0.55<=f){const top=f-rb<=1.55; return [Math.min(1,top?1:(0.4+0.42*rb/f)*(last?1.15:1)),rb<cc?2:0];}
    return [0.05,0];
  },{pitch:p,px:4});
  const ys=[maxT,maxT/2,0].map((v,i)=>`<span class="yl" style="top:${i===0?0:i===1?(NR*p/2-7):(NR*p-12)}px">$${Math.round(v)}</span>`).join('');
  return html+ys;
});
$('trendX').innerHTML=[0,15,nT-1].map(k=>`<span>${tr[k].date.slice(5).replace('-','/')}</span>`).join('');
(function(){
  const sum=totals.reduce((a,b)=>a+b,0), cs=tr.reduce((a,d)=>a+d.costUsd.codex,0);
  const it=(l,v,s='')=>`<div><p class="lab">${l}</p><div class="val">${v}</div>${s?`<div class="sub">${s}</div>`:''}</div>`;
  $('trendStats').innerHTML=it('30 天合计',usd(sum))+it('近 7 日均',usd(avg7))+it('单日最高',usd(maxT),tr[miT].date.slice(5).replace('-','/'))+it('Codex 占比',(cs/sum*100).toFixed(0)+'%');
})();

/* 近 30 天：按 Agent、按星期 */
(function(){
  const sumA=a=>tr.reduce((x,d)=>x+d.costUsd[a],0), tot=sumA('claude-code')+sumA('codex');
  const days=a=>tr.filter(d=>d.costUsd[a]>0).length;
  $('trendAgents').innerHTML=['claude-code','codex'].map(a=>`<tr><td class="n">${agTag(a)}</td><td class="bar">${bar(sumA(a)/tot,a==='codex'?2:0)}</td><td class="v">${usd(sumA(a))}</td><td class="p">${days(a)} 天有用量</td></tr>`).join('');
})();
fit('weekday',w=>{
  const names=['日','一','二','三','四','五','六'], acc=Array(7).fill(0), n=Array(7).fill(0);
  tr.forEach(d=>{const k=new Date(d.date+'T00:00:00Z').getUTCDay(); acc[k]+=tsum(d); n[k]++;});
  const avg=acc.map((v,i)=>n[i]?v/n[i]:0), mx=Math.max(...avg), order=[1,2,3,4,5,6,0];
  const cw=Math.floor((w-6*8)/7);
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">`+order.map(k=>{
    const f=mx?avg[k]/mx:0, NR=8, nc=Math.max(3,Math.floor(cw/5));
    return `<div>${cells(nc,NR,(c,r)=>NR-1-r+0.5<=f*NR?[0.45+0.5*f,k===0||k===6?6:0]:[0.06,0],{pitch:5,px:4})}
      <div class="mf"><span>${names[k]}</span><span>$${Math.round(avg[k])}</span></div></div>`;}).join('')+'</div>';
});

/* ---------- 今日构成 ---------- */
$('tokens').innerHTML=[['输入',TK.input],['输出',TK.output],['缓存读取',TK.cacheRead],['缓存写入',TK.cacheWrite],['推理 ⊂ 输出',TK.reasoning]]
  .map(([n,v])=>`<tr><td class="n">${n}</td><td class="bar">${bar(v/totTok,0)}</td><td class="v">${fm(v)}</td><td class="p">${(v/totTok*100).toFixed(1)}%</td></tr>`).join('');
const maxM=Math.max(...TD.byModel.map(m=>m.costUsd||0));
$('models').innerHTML=TD.byModel.map(m=>`<tr><td class="n">${bd(esc(m.model),m.agent==='codex'?'c-or':'c-fg',true)}</td><td class="bar">${bar((m.costUsd||0)/maxM,m.agent==='codex'?2:0)}</td><td class="v">${m.costUsd==null?'<span class="c-warn">未定价</span>':usd(m.costUsd)}</td><td class="p">${nf(m.requests)}次</td></tr>`).join('');
const BP=[...(TD.byProject||[])].sort((a,b)=>b.costUsd-a.costUsd), maxP=Math.max(...BP.map(p=>p.costUsd),1);

/* ---------- 服务（hub 已把同一服务的容器与监控合并成一行） ---------- */
(function(){
  if(HIDDEN.has('services')){$('services').outerHTML='<div class="hiddenpn">请看在线版</div>';return;}
  const ST={up:['运行中','c-ok'],down:['异常','c-bad'],pending:['待定','c-warn'],maintenance:['维护','c-vio'],paused:['暂停','c-warn'],unknown:['未知','c-dim']};
  const KIND={container:'容器',monitor:'监控',both:'容器+监控'};
  const upCls=u=>u==null?'':u>=99.9?'c-ok':u>=99?'':u>=97?'c-warn':'c-bad';
  const list=[...(GB.services||[])].sort((a,b)=>(a.status==='down'?0:1)-(b.status==='down'?0:1));
  const bad=list.filter(r=>r.status==='down').length;
  $('svcN').textContent=`${list.length} 个`;
  $('svcR').innerHTML=bad?bd(bad+' 异常','c-bad',true):bd('全部正常','c-ok',true);
  $('services').innerHTML='<tr><th>名称</th><th>状态</th><th class="hide-s">机器</th><th class="v">24h 在线</th><th class="v hide-s">CPU</th><th class="v">内存</th></tr>'+
    list.map(r=>{const [t,c]=ST[r.status]||ST.unknown;
      return `<tr><td class="n">${T(r.name)} <span class="rel">${KIND[r.kind]||''}</span></td><td>${bd(t,c,true,'',r.status==='up')}</td><td class="k hide-s">${esc(r.machine||'')}</td>
      <td class="v ${upCls(r.uptimePct24h)}">${r.uptimePct24h==null?'—':r.uptimePct24h.toFixed(1)+'%'}</td><td class="v hide-s">${r.cpuPct==null?'—':r.cpuPct.toFixed(1)+'%'}</td><td class="v">${r.memBytes==null?'—':fb(r.memBytes)}</td></tr>`;}).join('');
})();

/* ---------- Agent 运行时 / 定时任务 / tailnet ---------- */
$('rtN').textContent=`${RT.reduce((a,r)=>a+r.activeSessions,0)} 活跃 · ${RT.reduce((a,r)=>a+r.processes,0)} 进程`;
$('runtimes').innerHTML='<tr><th>机器</th><th>Agent</th><th class="v">版本</th><th class="v">进程</th><th class="v">活跃</th></tr>'+
  RT.map(r=>`<tr${r.stale?' style="opacity:.45"':''}><td class="k"><span class="code">${esc(r.machine)}</span></td><td class="n">${agTag(r.agent)}</td><td class="v">${bd('v'+esc(r.version||'?'),'c-dim')}</td><td class="v">${r.processes}</td><td class="v ${r.activeSessions?'c-ok':''}">${r.activeSessions?'<span class="st live" style="width:6px;height:6px;background:var(--ok);margin-right:6px"></span>':''}${r.activeSessions}</td></tr>`).join('');
$('jobs').innerHTML=(GB.jobs||[]).map(j=>`<tr><td class="n">${T(j.name)}</td><td>${bd(j.ok?'成功':'失败',j.ok?'c-ok':'c-bad',true)}</td><td class="k"><span class="code">${esc(j.machine)}</span></td><td class="v">${j.lastSuccess?ago(j.lastSuccess):'从未成功'}</td></tr>`).join('')||'<tr><td class="k">无</td></tr>';
if(HIDDEN.has('tailnet')){$('tailnet').innerHTML='<div class="hiddenpn">请看在线版</div>';$('tnN').textContent='';}
else{
  const TN=GB.tailnet||[];
  $('tnN').textContent=`${TN.filter(t=>t.online).length} / ${TN.length} 在线`;
  $('tailnet').innerHTML='<div class="bds">'+TN.map(t=>bd(`${T(t.name)} <span style="opacity:.7">${esc(t.os||'')}</span>`,t.online?'c-ok':'c-dim',true)).join('')+'</div>';

/* ---------- 活动 ---------- */
const SRC={github:['GitHub','c-dim'],gitea:['Gitea','c-vio'],local:['本地','c-fg']};
$('act').innerHTML=GB.activity.map(a=>{
  const [sn,sc]=SRC[a.source]||['?','c-dim'];
  const tags=[repoTag(a.repo),bd(sn,sc),a.pushed===false?bd('未推送','c-warn',true):'',a.machine?`<span class="code">${esc(a.machine)}</span>`:'',
    a.branch?`<span class="rel">${esc(a.branch)}${a.hash?' · '+esc(a.hash.slice(0,7)):''}</span>`:''].join(' ');
  return `<li><time>${mmdd(a.t)} ${hhmm(a.t)}</time><span class="p bds" style="font-weight:500">${tags}</span><span class="d" style="display:flex;justify-content:space-between;gap:12px"><span>${esc(a.title)}</span><span class="rel">${ago(a.t)}</span></span></li>`;
}).join('');
$('actN').textContent=`${GB.activity.length} 条`;
$('actR').innerHTML=bd(`私有 ${GB.activity.filter(a=>!a.public).length}`,'c-dim')+' '+bd(`未推送 ${GB.activity.filter(a=>a.pushed===false).length}`,'c-warn');

/* ---------- 动效：面板依次淡入、KPI 数字滚动（减少动态效果或冻结帧时不做） ---------- */
document.querySelectorAll('.pn').forEach((el,i)=>el.style.setProperty('--i',i));
if(!STATIC){
  document.body.classList.add('anim');
  document.querySelectorAll('[data-n]').forEach(el=>{
    const txt=el.textContent, m=txt.match(/[\d,.]+/); if(!m)return;
    const target=parseFloat(m[0].replace(/,/g,'')), dec=(m[0].split('.')[1]||'').length, comma=m[0].includes(',');
    const t0=performance.now(), D=900;
    const fmt=v=>{let s=v.toFixed(dec); if(comma)s=Number(s).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return txt.replace(m[0],s);};
    const step=now=>{const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3); el.textContent=fmt(target*e); if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}

/* ---------- 今日画作（背景层） ---------- */
const seedDate=GB.generatedAt.slice(0,10).replace(/-/g,''), seed=parseInt(seedDate,10);
const shareCC=(byA['claude-code']?.requests||0)/Math.max(1,TD.requests);
const nParticles=Math.round(totTok/1e6*38);
$('cap0').textContent='今日画作 #'+seedDate;
$('capMid').innerHTML=`<span style="color:${BLUE}">■</span> Claude Code ${Math.round(shareCC*100)}%　<span style="color:${OR}">■</span> Codex ${Math.round((1-shareCC)*100)}%`;
$('cap1').textContent=`光点 ${nf(nParticles)} = ${fm(totTok)} Token · 远山 = 近 30 天费用`;
const art=$('art'), ax=art.getContext('2d');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd0=mulberry(seed^0x9e3779b9), perm=new Float32Array(65536); for(let i=0;i<perm.length;i++)perm[i]=rnd0();
function noise(x,y){const s_=t=>t*t*(3-2*t);
  const xi=Math.floor(x),yi=Math.floor(y),xf=s_(x-xi),yf=s_(y-yi),x0=xi&255,x1=(xi+1)&255,y0=(yi&255)<<8,y1=((yi+1)&255)<<8;
  const a=perm[y0|x0],b=perm[y0|x1],c=perm[y1|x0],d=perm[y1|x1]; return (a+(b-a)*xf)*(1-yf)+(c+(d-c)*xf)*yf;}
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
const sstep=(a,b,x)=>smooth((x-a)/(b-a));
const trMean=totals.reduce((a,b)=>a+b,0)/nT;
function ridge(xn){const f=(xn*.5+.5)*(nT-1),i=Math.max(0,Math.min(nT-2,Math.floor(f))),t=f-i,s=(1-Math.cos(t*Math.PI))/2;return (totals[i]+(totals[i+1]-totals[i])*s)/maxT;}
const prnd=mulberry(seed);
const PART=Array.from({length:nParticles},()=>({bx:prnd()*2-1,by:prnd(),bz:prnd(),ph:prnd()*6.283,cx:prnd()>shareCC}));
const LV=9, ART=[[108,151,214],[219,168,67]], jitter=(1-TD.cacheHitRate)*4;
const NZ=120, zs=Array.from({length:NZ},(_,i)=>1.1*Math.pow(15/1.1,i/(NZ-1)));
let L=null,G=null;
function layout(){const W=art.clientWidth,H=art.clientHeight; if(!W||!H){L=null;return;}
  const dpr=Math.min(devicePixelRatio||1,2); art.width=Math.round(W*dpr);art.height=Math.round(H*dpr);
  const p=5; L={W,H,dpr,p,cols:Math.floor(W/p),rows:Math.floor(H/p)};}
function drawArt(t){
  if(!L)layout(); if(!L)return;
  const {W,H,dpr,cols,rows}=L, P=L.p;
  if(!G||G.n!==cols*rows){G={n:cols*rows,gb:new Float32Array(cols*rows),gc:new Uint8Array(cols*rows),bk:Array.from({length:2*LV},()=>new Int32Array(cols*rows)),bc:new Int32Array(2*LV)};}
  const {gb,gc,bk,bc}=G, PN=W<640?Math.round(PART.length*.5):PART.length;
  gb.fill(0);
  const hy=rows*.42, focal=rows*.95, kx=.62*cols/rows;
  const A=2.2+.5*Math.sin(t*.33), camH=2.0+.08*Math.sin(t*.21), trav=t*.16, ymin=new Float32Array(cols).fill(rows);
  for(let c=0;c<cols;c++){
    const xn=(c+.5)/cols*2-1;
    for(let i=0;i<NZ;i++){
      const z=zs[i], wx=xn*z*kx, zz=z+trav, far=sstep(5,13,z), amp=A*(.3+.7*sstep(2,8,z));
      const Hf=(x,q)=>(noise(x*.42+7,q*.42)-.5)*amp+(noise(x*1.15+31,q*1.15+5)-.5)*jitter*.55;
      const hc=Hf(wx,zz), ys=hy+(camH-(hc+(ridge(xn)-trMean/maxT)*far*3.2+.3))/z*focal;
      if(ys>=ymin[c])continue;
      const slope=-(Hf(wx,zz+.3)-hc)/.3*.6+(Hf(wx+.3,zz)-hc)/.3*.35, fog=Math.exp(-(z-1.1)*.12);
      const b=Math.max(.2,Math.min(1,.26+slope*2.6))*(.4+.6*fog)*.95;
      for(let y=Math.max(0,Math.ceil(ys)),y1=Math.min(rows,Math.ceil(ymin[c]));y<y1;y++){const k=c*rows+y; gb[k]=Math.min(1,b+(y===Math.ceil(ys)?.12*fog:0)); gc[k]=0;}
      ymin[c]=ys;
    }
  }
  for(let n=0;n<PN;n++){
    const p=PART[n], u=(p.bz+t*.011)%1, z=2.2+u*12, life=Math.sin(u*Math.PI);
    const wx=p.bx*z*kx+Math.sin(t*.22+p.ph)*.5+Math.sin(t*.13+p.by*5)*.4, wy=.9+p.by*3.6+Math.sin(t*.3+p.bx*4+p.ph)*.3+Math.sin(t*.17+z)*.2;
    const sx=((wx/(z*kx))*.5+.5)*cols, sy=hy+(camH-wy)/z*focal, cx=sx|0, cy=sy|0;
    if(cx<0||cx>=cols||cy<0||cy>=rows||sy>=ymin[cx]-1)continue;
    const b=life*(.35+.65*Math.exp(-(z-2)*.12))*(.75+.25*Math.sin(t*.7+p.ph))*.95, k=cx*rows+cy;
    if(b>gb[k]){gb[k]=b;gc[k]=p.cx?1:0;}
  }
  bc.fill(0);
  for(let k=0;k<gb.length;k++){const a=gb[k]; if(a<.05)continue; const key=gc[k]*LV+Math.min(LV,Math.ceil(a*LV))-1; bk[key][bc[key]++]=k;}
  ax.setTransform(dpr,0,0,dpr,0,0); ax.clearRect(0,0,W,H);
  for(let key=0;key<2*LV;key++){
    const n=bc[key]; if(!n)continue;
    const ci=(key/LV)|0, f=(key%LV+1)/LV, col=ART[ci], s=P*(.3+.6*f), off=(P-s)/2, arr=bk[key];
    ax.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${((.14+.66*f)).toFixed(3)})`;
    if(f>0.85){ax.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},.7)`;ax.shadowBlur=6;}else ax.shadowBlur=0;
    ax.beginPath(); for(let i=0;i<n;i++){const k=arr[i]; ax.rect(((k/rows)|0)*P+off,(k%rows)*P+off,s,s);} ax.fill();
  }
  ax.shadowBlur=0;
}

/* ---------- 逐帧 ---------- */
let lastSec=-1;
function tickText(Tm,force){
  const now=T0+Tm*1000, sec=Math.floor(Tm); if(sec===lastSec&&!force)return; lastSec=sec;
  document.querySelectorAll('.cd').forEach(el=>{el.textContent=cd(Date.parse(GB.quota[+el.dataset.q].resetsAt)-now);});
  const d=new Date(now+tzOff), z=n=>String(n).padStart(2,'0');
  $('clock').textContent=`JST ${z(d.getUTCHours())}:${z(d.getUTCMinutes())}:${z(d.getUTCSeconds())}`;
}
function draw(Tm,force){drawArt(Tm+6);tickText(Tm,force);}
let start=performance.now(),lastF=0;
function frame(ts){requestAnimationFrame(frame); if(document.hidden||ts-lastF<40)return; lastF=ts; draw((performance.now()-start)/1000);}
if(FROZEN!==null)draw(FROZEN,true); else if(REDUCE)draw(8,true); else {draw(0,true);requestAnimationFrame(frame);}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{fits.forEach(f=>f());L=null;if(STATIC)draw(FROZEN!==null?FROZEN:8,true);},120);});
})();
</script>
