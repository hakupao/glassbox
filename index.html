<!doctype html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title data-i18n="app.title"></title>
<style>
/* glassbox front end (c-v9 design, slate). No external resources: hub.page.bundle inlines this file. */
:root{
  --bg:#14171c; --panel:rgba(53,60,72,.75); --blur:3px;
  /* S17 design tokens (S17 activity design, version B). Named roles first, rules switch to them page by page. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;            /* spacing */
  --fs-1:15px; --fs-2:13px; --fs-3:11.5px; --fw-1:600; --fw-2:400; --lh-1:1.4; --lh-2:1.55;  /* type scale */
  --surface:rgba(53,60,72,.5); --surface-hi:rgba(53,60,72,.78);   /* card, selected/hover (--panel stays the legacy .75 card) */
  --pale:12%; --pale-line:34%;                                    /* badge: pale fill, thin border, same hue */
  --tag-1:#e07a8a; --tag-2:#7fa8e8; --tag-3:var(--sig-ok); --tag-4:#d9a441; --tag-5:var(--sig-vio); --tag-6:#5fb7b0; --tag-7:var(--sig-warn); --tag-8:#c68fd0;  /* repo tags (web/app.js TAGS, same order) */
  --tabbar-h:56px;  /* phone tab bar height without the safe area */
  --ease:cubic-bezier(.2,.7,.2,1); --dur-0:.11s; --dur-1:.18s; --dur-2:.32s;  /* motion; --dur-0: list fade on a filter switch */
  --sig-info:#6c97d6; --ink-1:#efeadd; --ink-2:#d8d3c4; --ink-3:#a6a297; --or:#dba843;
  --sig-bad:#e0645a; --sig-ok:#79b98a; --sig-warn:#e3894d; --sig-vio:#a48ee0;
  --line:rgba(216,211,196,.16); --line-soft:rgba(216,211,196,.09);
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
/* per-language text stacks, on any element with a lang (the page, and each option in the language menu) */
:lang(zh){--sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif}
:lang(ja){--sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif}
:lang(en){--sans:"Helvetica Neue","Segoe UI",system-ui,"PingFang SC","Hiragino Sans",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink-2);font:14px/var(--lh-2) var(--sans);overflow-x:hidden;background:var(--bg);-webkit-font-smoothing:antialiased}
svg{display:block}
a{color:inherit}
button{font:inherit;color:inherit}
.in{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 var(--s5)}
@media (max-width:640px){.in{padding:0 var(--s4)}}
#art{position:fixed;left:0;right:0;bottom:0;width:100%;height:62vh;z-index:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 14%,rgba(0,0,0,.55) 46%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 14%,rgba(0,0,0,.55) 46%,transparent 100%)}
@media (max-width:640px){#art{height:46vh}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar and navigation ---------- */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 22px;padding:var(--s4) 0 14px}
.brand{font:700 19px var(--mono);color:var(--ink-1);letter-spacing:.02em;text-decoration:none}
.nav{display:flex;gap:2px;min-width:0}
.nav a{display:flex;align-items:baseline;gap:6px;padding:5px 10px;font:500 var(--fs-2) var(--sans);color:var(--ink-3);text-decoration:none;
  border:1px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s,background .15s}
.nav a:hover{color:var(--ink-1);background:color-mix(in srgb,var(--ink-1) 4%,transparent)}
.nav a[aria-current="page"]{color:var(--ink-1);border-color:var(--line);background:var(--panel)}
.meta{display:flex;gap:var(--s2);align-items:center;font:12px var(--mono);color:var(--ink-3);flex-wrap:wrap;justify-content:flex-end}
.chip{color:var(--bg);background:var(--sig-info);padding:2px var(--s2);font-weight:var(--fw-1);white-space:nowrap}
.chip.line{background:none;color:var(--ink-3);border:1px solid var(--line);font-weight:var(--fw-2)}
.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 var(--s2);background:none;border:1px solid var(--line);
  color:var(--ink-2);font:var(--fw-1) var(--fs-3) var(--mono);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.lang-btn svg{color:var(--sig-info)}
.lang-btn small{font:500 11px var(--sans);color:var(--ink-3);letter-spacing:0}
.lang-btn small::before{content:"\00b7";margin-right:5px;color:var(--ink-3)}
.lang-btn .caret{width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.lang-btn[aria-expanded="true"]{background:var(--panel);border-color:color-mix(in srgb,var(--sig-info) 50%,transparent)}
.lang-btn[aria-expanded="true"] .caret{transform:translateY(1px) rotate(-135deg)}
.lang-btn:hover{color:var(--ink-1);border-color:color-mix(in srgb,var(--ink-2) 35%,transparent)}
.lang-btn:focus-visible,.lang-menu button:focus-visible{outline:1px solid var(--sig-info);outline-offset:-1px}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:90;min-width:268px;max-width:calc(100vw - 32px);padding:6px;
  background:rgba(24,28,35,.97);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lm-h{font:var(--fw-1) 10.5px var(--mono);letter-spacing:.12em;color:var(--ink-3);padding:var(--s1) var(--s2) 6px;text-transform:uppercase}
.lang-menu button{display:grid;grid-template-columns:1fr auto 14px;align-items:center;gap:10px;width:100%;padding:7px var(--s2);
  background:none;border:0;text-align:left;cursor:pointer;color:var(--ink-2)}
.lang-menu button:hover,.lang-menu button:focus-visible{background:color-mix(in srgb,var(--ink-1) 6%,transparent)}
.lang-menu .lm-n{font:500 var(--fs-2) var(--sans);white-space:nowrap}
.lang-menu small{font:500 11px var(--mono);color:var(--ink-3);white-space:nowrap}
.lang-menu [aria-checked="true"]{background:color-mix(in srgb,var(--sig-info) 12%,transparent)}
.lang-menu [aria-checked="true"] .lm-n{color:var(--ink-1);font-weight:var(--fw-1)}
.lang-menu [aria-checked="true"] .lm-c{width:5px;height:9px;border-right:1.5px solid var(--sig-ok);border-bottom:1.5px solid var(--sig-ok);transform:translate(3px,-1px) rotate(45deg)}
@media (max-width:1060px){.top{grid-template-columns:auto 1fr}.nav{grid-column:1/-1;grid-row:2}}
@media (max-width:640px){
  .top{gap:10px var(--s3);padding:14px 0 10px}
  .meta{gap:6px}
  .meta #clock{display:none}
  .nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line)}
  .nav a{flex-direction:column;align-items:center;gap:0;padding:5px 2px;font-size:12px;border:0;overflow:hidden;text-overflow:ellipsis}
  .nav a+a{border-left:1px solid var(--line-soft)}
  .nav a[aria-current="page"]{border-color:transparent}
  .nav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
}

/* ---------- panels ---------- */
.pn{background:var(--panel);border:1px solid var(--line);padding:var(--s4) 18px 18px;margin-bottom:10px;
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-bottom:14px}
.ph h2{margin:0;font:var(--fw-1) var(--fs-1) var(--sans);color:var(--ink-1);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ph h3{margin:0;font:var(--fw-1) 14px var(--sans);color:var(--ink-1);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ph .r{font:12px var(--mono);color:var(--ink-3);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.ph.sm{margin-bottom:var(--s2)}
@media (max-width:560px){.ph{flex-wrap:wrap}.ph .r{justify-content:flex-start}}
.more{font:500 12px var(--sans);color:var(--sig-info);text-decoration:none;white-space:nowrap;border-bottom:1px solid transparent}
.more:hover{border-bottom-color:currentColor}
.more::after{content:" \2192"}
.grid2{display:grid;grid-template-columns:7fr 5fr;gap:10px;margin-bottom:10px}
.grid2.even{grid-template-columns:1fr 1fr}
.grid2>.pn{margin-bottom:0}
@media (max-width:960px){.grid2,.grid2.even{grid-template-columns:1fr}}
.hero{padding:20px 22px 22px}
.hero .val{font-size:34px}
.hero .lab{font-size:12.5px;letter-spacing:.04em}

.lab{font-size:var(--fs-2);color:var(--ink-3);margin:0 0 2px}
.val{font:var(--fw-1) 28px/1.2 var(--mono);color:var(--ink-1);font-variant-numeric:tabular-nums;white-space:nowrap}
.val.c{color:var(--sig-info)} .val.o{color:var(--or)} .val.g{color:var(--sig-ok)} .val.v{color:var(--sig-vio)} .val.w{color:var(--sig-warn)} .val.b{color:var(--sig-bad)}
.sub{font:12px var(--mono);color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}
.kpis>div{padding:0 18px;border-left:1px solid var(--line-soft);min-width:0}
.kpis>div:first-child{padding-left:0;border-left:0}
.kpis.sm .val{font-size:22px}
.kpis .val{overflow:hidden;text-overflow:ellipsis}
.hero .kpis[style*="--n:6"] .val{font-size:24px}
@media (max-width:1200px){.kpis[style*="--n:6"]{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:var(--s4)}.kpis[style*="--n:6"]>div:nth-child(3n+1){padding-left:0;border-left:0}.hero .kpis[style*="--n:6"] .val{font-size:26px}}
@media (max-width:560px){.kpis[style*="--n:6"]{grid-template-columns:1fr 1fr}.kpis[style*="--n:6"]>div{padding:0 0 0 14px;border-left:1px solid var(--line-soft)}.kpis[style*="--n:6"]>div:nth-child(odd){padding-left:0;border-left:0}.hero .kpis[style*="--n:6"] .val{font-size:20px}}
@media (max-width:960px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:var(--s4)}.kpis>div:nth-child(3n+1){padding-left:0;border-left:0}}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpis>div{padding:0 0 0 14px;border-left:1px solid var(--line-soft)}.kpis>div:nth-child(3n+1){padding-left:14px;border-left:1px solid var(--line-soft)}.kpis>div:nth-child(odd){padding-left:0;border-left:0}
  .hero .val{font-size:28px}}

/* quota */
.qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.qs>article{padding:0 18px;border-left:1px solid var(--line-soft);min-width:0}
.qs>article:first-child{padding-left:0;border-left:0}
.qh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.qh b{font-weight:500;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qh .val{font-size:22px}
.qbar{margin:var(--s2) 0 6px}
.qf{display:flex;justify-content:space-between;gap:var(--s2);font:12px var(--mono);color:var(--ink-3);flex-wrap:wrap}
@media (max-width:760px){.qs{grid-template-columns:1fr;row-gap:var(--s4)}.qs>article{padding:0;border-left:0}}

/* machines (one per line) */
.mh{display:flex;align-items:center;gap:var(--s2);margin-bottom:2px;min-width:0}
.code{font:700 12px var(--mono);color:var(--bg);background:var(--ink-2);padding:0 5px;line-height:18px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
/* machine tile: duotone icon on a tinted rounded square (--mc), 1px same-colour edge, a faint inner
   glow; the code as a corner tag; a breathing dot when the machine is online */
.mt{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle;
  width:20px;height:20px;margin-right:var(--s2);border-radius:5px;color:var(--mc);
  background:linear-gradient(155deg,color-mix(in srgb,var(--mc) 24%,transparent),color-mix(in srgb,var(--mc) 9%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mc) 50%,transparent),inset 0 0 6px color-mix(in srgb,var(--mc) 22%,transparent)}
.mt svg{display:block;filter:drop-shadow(0 0 2px color-mix(in srgb,var(--mc) 35%,transparent))}
.mt b{position:absolute;right:-6px;bottom:-4px;min-width:11px;padding:0 2px;border-radius:3px;text-align:center;
  font:700 9px/11px var(--mono);color:var(--bg);background:var(--mc);box-shadow:0 0 0 1.5px var(--bg)}
.mt .on{position:absolute;top:-2px;right:-2px;width:6px;height:6px;border-radius:50%;background:var(--sig-ok);box-shadow:0 0 0 1.5px var(--bg)}
@keyframes mt-breathe{0%,100%{box-shadow:0 0 0 1.5px var(--bg),0 0 0 1.5px color-mix(in srgb,var(--sig-ok) 60%,transparent)}60%{box-shadow:0 0 0 1.5px var(--bg),0 0 0 5px transparent}}
.anim .mt .on{animation:mt-breathe 2.4s ease-out infinite}
.mt.big{width:38px;height:38px;border-radius:9px;margin-right:var(--s3)}
.mt.big b{font-size:11px;line-height:14px;min-width:14px;right:-6px;bottom:-5px;border-radius:4px}
.mt.big .on{width:8px;height:8px;top:-3px;right:-3px}
/* long codes: a pill (icon + code) instead of a corner tag, which only fits one or two characters */
.mt.long{width:auto;gap:var(--s1);padding:0 6px 0 var(--s1);white-space:nowrap}
.mt.long b{position:static;min-width:0;padding:0;background:none;box-shadow:none;color:var(--mc);font-size:10px;line-height:20px}
.mt.big.long{gap:7px;padding:0 11px 0 var(--s2)}
.mt.big.long b{font-size:var(--fs-2);line-height:38px}
.tb td .mt,.act .mt{margin-top:1px;margin-bottom:1px}
.ph:has(.mt.big){align-items:center}
.ph h2:has(.mt.big){gap:10px}
.mh b{font-weight:var(--fw-1);color:var(--ink-1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{width:8px;height:8px;display:inline-block;flex:none}
.mlist{display:grid;gap:0}
.mline{display:grid;grid-template-columns:220px repeat(3,minmax(100px,130px)) minmax(160px,1fr) 180px;gap:0 22px;align-items:center;
  padding:11px 0;border-top:1px solid var(--line-soft)}
.mline:first-child{border-top:0;padding-top:2px}
.mline .id{min-width:0}
.mline .id .mh{margin-bottom:5px}
.metric{min-width:0}
.metric .lab{font:11px var(--mono);margin:0 0 3px;display:flex;justify-content:space-between;gap:6px}
.metric .lab b{font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric svg{width:100%;height:6px}
.mline .side{font:var(--fs-3) var(--mono);color:var(--ink-3);display:grid;gap:var(--s1);justify-items:end;text-align:right}
.mline.off{opacity:.62}
.mline .spark{position:relative}
.mline .spark .rp{position:absolute;left:0;top:-13px;font:10px/1 var(--mono);color:var(--ink-3);letter-spacing:.04em;pointer-events:auto}
.nodata{font:var(--fs-3) var(--mono);color:var(--ink-3);opacity:.8}
@media (max-width:1000px){.mline .spark{padding-top:13px}.mline .spark .rp{top:0}.mline{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}.mline .id,.mline .spark,.mline .side,.mline .nodata{grid-column:1/-1}.mline .side{justify-items:start;text-align:left;display:flex;flex-wrap:wrap;gap:6px}}
@media (max-width:560px){.mline{grid-template-columns:1fr}}

/* machine detail */
.mdet{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px 28px}
.mdet .metrics{display:grid;gap:var(--s3);align-content:start}
.mdet .metric .lab{font-size:12px}
.mdet .metric svg{height:8px}
.charts{display:grid;gap:var(--s3)}
.stretch svg{width:100%;height:auto}
.chart3 .lab{display:flex;justify-content:space-between;font:var(--fs-3) var(--mono);margin-bottom:var(--s1)}
.msec{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:14px 28px}
.msec h3 .ic{margin-right:0}
@media (max-width:860px){.msec{grid-template-columns:1fr}}
.mlink{text-decoration:none;color:var(--ink-2)}
.mlink:hover{color:var(--ink-1)}
.more.nomark::after{content:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font:12px var(--mono);color:var(--ink-3);margin:0}
.facts dt{color:var(--ink-3)} .facts dd{margin:0;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
@media (max-width:860px){.mdet{grid-template-columns:1fr}}

/* tables */
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb td,.tb th{padding:var(--s1) 0;border-top:1px solid var(--line-soft);vertical-align:middle;text-align:left}
.tb tr:first-child td{border-top:0}
.tb th{font:500 11px var(--sans);letter-spacing:.06em;color:var(--ink-3);border-top:0;padding-top:0;white-space:nowrap}
.tb th+th,.tb td+td{padding-left:10px}
.tb .n{color:var(--ink-2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tb td.n .bd{max-width:230px;vertical-align:middle}
.tb .m{font-family:var(--mono)}
.tb .v{font:12.5px var(--mono);color:var(--ink-1);text-align:right;white-space:nowrap}
.tb th.v{font:500 11px var(--sans);color:var(--ink-3)}
.tb .p{font:var(--fs-3) var(--mono);color:var(--ink-3);text-align:right;white-space:nowrap}
.tb .bar{width:34%} .tb .bar svg{width:100%;height:6px}
.tb .k{font:var(--fs-3) var(--mono);color:var(--ink-3);white-space:nowrap}
.tb .t{color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.tb .bar{width:22%}.hide-s{display:none}}
@media (max-width:760px){.hide-m{display:none}
  /* the name column takes what is left and ellipsises instead of widening the table */
  .tb td.n{max-width:0;width:100%}.tb td.n .bd{max-width:calc(100% - 18px)}.tb .bar{min-width:40px}}
.sep{height:16px}
.tbw{overflow-x:auto}

/* expandable rows */
.xr{cursor:pointer}
.xr:focus-visible{outline:1px solid var(--sig-info);outline-offset:-1px}
.xr .tw{display:inline-block;width:10px;margin-right:6px;color:var(--ink-3);font:10px var(--mono);transition:transform .15s}
.xr[aria-expanded="true"] .tw{transform:rotate(90deg);color:var(--ink-1)}
.xr[aria-expanded="true"]>td,.act li.xr[aria-expanded="true"]{background:color-mix(in srgb,var(--ink-1) 5%,transparent)}
.xd>td{border-top:0;padding:var(--s1) 0 var(--s3) var(--s4)}
.xd .box,.act .xd{border-left:2px solid var(--line);padding:var(--s1) 0 var(--s1) 14px}
.act li.xd{display:block;border-top:0;padding:0 0 10px 0}
.xd .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s3) 22px}

/* filters */
.bar-f{display:flex;flex-wrap:wrap;gap:var(--s2) 14px;align-items:center;margin:-4px 0 var(--s3)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line)}
.seg button,.seg a{background:none;border:0;padding:2px 9px;font:500 12px var(--sans);color:var(--ink-3);cursor:pointer;text-decoration:none;white-space:nowrap}
.seg>*+*{border-left:1px solid var(--line)!important}
.seg [aria-pressed="true"],.seg [aria-current="true"]{color:var(--bg);background:var(--ink-2)}
.seg button:hover:not([aria-pressed="true"]),.seg a:hover:not([aria-current="true"]){color:var(--ink-1)}
.seg small{font:11px var(--mono);opacity:.75;margin-left:var(--s1)}
.flab{font:11px var(--mono);color:var(--ink-3);letter-spacing:.06em}
.search{background:rgba(10,12,16,.35);border:1px solid var(--line);color:var(--ink-1);font:12px var(--mono);padding:3px var(--s2);min-width:0;width:200px}
.search::placeholder{color:var(--ink-3)}

/* 03 flow field: streamlines of a slowly turning noise field drawn in braille micro dots; tokens ride them as short comets.

function tFlow(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);

  let ft = 0;

  const parts = Array.from({length: Math.round(D.nPart * .45)}, () => ({k: (X.rnd() * K) | 0, ph: X.rnd(), v: 5 + 5 * X.rnd(), cx: 0}));
  parts.forEach(q => q.cx = lcol[q.k]);
  const PN = phone ? Math.round(parts.length * .5) : parts.length;
  const tick = ticker(.22, tm => {
    ft = tm * .014 * sp; tracePaths(paths, K, ST, seeds, dir, 1.15); TL.clear();

        TL.put(paths[o], y, (.12 + .4 * dep) * Math.sin(Math.PI * i / (ST - 1)) * low, lcol[k]); } }
    TL.draw(off.begin(), .95, false, 'br');

  return tm => {

/* 04 ripples: 3-4 point sources on a water plane seen in perspective; brightness = wave face toward the viewer.
   Codex source carries (1 - share) of the amplitude and colours the cells it dominates; wavelength = trend; surface grain = cache miss;
   tokens = glints that light up only on crests. */
function tRipple(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);
  const hy = rows * (phone ? .30 : .38), focal = rows * .9, camH = 3, kx = .62 * cols / rows;
  const S = mulberry(mix(X.p.seed + 4)), NS = 3 + (S() * 2 | 0), src = [];
  for(let i = 0; i < NS; i++){ const cxr = i === NS - 1; src.push({x: (S() * 2 - 1) * (cxr ? 1.6 : 2.8) + p.off * .6, z: cxr ? 4.6 + S() * 2 : 4.4 + S() * 6, ph: S() * TAU, a: cxr ? (1 - D.share) * 1.6 : D.share / (NS - 1), c: cxr ? 1 : 0}); }
  const kw = 8 + 5 * D.trendK, om = 1.1;
  const wave = (x, z, t, out) => { let h = 0, dz = 0, cb = 0, co = 0;
    for(let i = 0; i < NS; i++){ const s = src[i], ddx = x - s.x, ddz = z - s.z, r = Math.sqrt(ddx * ddx + ddz * ddz) + 1e-3, e = s.a * Math.exp(-.05 * r), ph = kw * r - om * t + s.ph;
      h += e * Math.sin(ph); dz += e * kw * Math.cos(ph) * ddz / r; if(s.c) co += s.a / (r + .3); else cb += s.a / (r + .3); }
    out[0] = h; out[1] = dz; out[2] = co > cb ? 1 : 0; };
  const w = [0, 0, 0], ampSum = src.reduce((a, s) => a + s.a, 0);
  const parts = Array.from({length: Math.round(D.nPart * .55)}, () => ({px: X.rnd() * 2 - 1, z: X.rnd(), ph: X.rnd() * TAU}));
  const PN = phone ? Math.round(parts.length * .5) : parts.length;
  const tick = ticker(.11, tm => {
    const t = tm * sp; TL.clear();
    for(let y = Math.ceil(hy + 1); y < rows; y++){
      const z = camH * focal / (y - hy); if(z > 14) continue; const fog = Math.exp(-(z - 4) * .22);
      for(let c = 0; c < cols; c++){
        const x = ((c + .5) / cols * 2 - 1) * z * kx; wave(x, z, t, w);
        const g = D.jitter ? (noise(x * 2.5 + 40, z * 2.5 + t * .4) - .5) * D.jitter * .25 : 0;
        const b = (.06 + .7 * Math.pow(clamp01(.5 - (w[1] + g * 5) * .12), 2.4)) * Math.min(1, .15 + .85 * fog);
        TL.put(c, y, Math.min(.82, b), w[2]);

  return tm => {
    tick(tm); off.blit(); PL.clear(); const t = tm * sp;
    for(let n = 0; n < PN; n++){ const q = parts[n], u = (q.z + tm * .006 * sp) % 1, z = 4.2 + (1 - u) * 6, x = q.px * z * kx;
      wave(x, z, t, w); const crest = sstep(.18, .5, w[0] / ampSum), life = Math.sin(u * Math.PI);
      const b = crest * (.6 + .4 * Math.sin(tm * .9 + q.ph)) * life * (.6 + .4 * Math.exp(-(z - 4.2) * .2));
      if(b < .5) continue; PL.put(((x / (z * kx)) * .5 + .5) * cols, hy + camH / z * focal, b, w[2]); }
    PL.draw(ax, 1, true, 'dot');

/* 05 road: a dotted ground grid sliding toward the viewer, a road that bends with the trend, and car lights.
   Cars = tokens (one car per ~22 tokens-particles), outgoing (blue) vs oncoming (amber) = split; cache miss = light flicker. */
function tRoad(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);
  const hy = rows * (phone ? .36 : .6), focal = rows * .9, camH = .9, kx = .62 * cols / rows, gs = 1.2, hw = 1.05, drive = .2 * sp;
  const curv = (D.trendK - .5) * .05 + .012 * p.off;
  const roadX = (z, tm) => (curv + .006 * Math.sin(tm * .07)) * z * z + .25 * p.off;
  const proj = (x, z) => ((x / (z * kx)) * .5 + .5) * cols, rowOf = z => hy + camH / z * focal;
  const fogOf = z => Math.exp(-(z - 1) * .085);
  const NC = Math.max(6, Math.round(D.nPart / 22)), cars = Array.from({length: NC}, () => ({out: X.rnd() < D.share, z0: X.rnd() * 26, v: .7 + .5 * X.rnd(), ph: X.rnd() * TAU}));
  const dust = Array.from({length: Math.round(D.nPart * .3)}, () => ({bx: X.rnd() * 2 - 1, by: X.rnd(), bz: X.rnd(), ph: X.rnd() * TAU, cx: X.rnd() > D.share}));
  const CN = phone ? Math.ceil(NC * .5) : NC, DN = phone ? Math.round(dust.length * .5) : dust.length;
  const tick = ticker(.09, tm => {
    TL.clear(); const shift = (tm * drive) % gs;
    for(let c = 0; c < cols; c++){ const v = c / cols - .5; TL.put(c, hy, .14 + .2 * Math.exp(-v * v * 40), 0); }        /* horizon */
    for(let n = 1; n < 28; n++){ const z = n * gs - shift; if(z < .9) continue; const y = rowOf(z), f = fogOf(z), rx = roadX(z, tm);   /* cross lines */
      for(let c = 0; c < cols; c++){ const x = ((c + .5) / cols * 2 - 1) * z * kx; if(Math.abs(x - rx) < hw || (c & 1)) continue; TL.put(c, y, .36 * f, 0); } }
    for(let y = Math.ceil(hy + 1); y < rows; y++){ const z = camH * focal / (y - hy), f = fogOf(z), rx = roadX(z, tm);           /* long lines + road */
      for(let m = -14; m <= 14; m++){ const x = m * gs; if(Math.abs(x - rx) < hw + .1) continue; TL.put(proj(x, z), y, .3 * f, 0); }
      TL.put(proj(rx - hw, z), y, .5 * f, 0); TL.put(proj(rx + hw, z), y, .5 * f, 0);
      if(((z + tm * drive) % 1.4) < .7) TL.put(proj(rx, z), y, .44 * f, 0); }
    TL.draw(off.begin(), .95, false, 'sq');
  });
  return tm => {
    tick(tm); off.blit(); PL.clear();
    for(let n = 0; n < CN; n++){ const q = cars[n], span = 26, u = ((q.z0 + (q.out ? .12 + .2 * q.v : -(.5 + .4 * q.v)) * tm * sp) % span + span) % span, z = 1.6 + u;
      const rx = roadX(z, tm) + (q.out ? .5 : -.5), f = fogOf(z), fl = 1 - D.jitter * .06 * (1 + Math.sin(tm * 7 + q.ph)), b = (.55 + .43 * f) * fl;
      const y = rowOf(z) - .3 / z * focal * .5, sep = Math.max(.55, .22 / (z * kx) * cols * .5);
      const x0 = proj(rx, z); PL.put(x0 - sep, y, b, q.out ? 0 : 1); PL.put(x0 + sep, y, b, q.out ? 0 : 1); }
    for(let n = 0; n < DN; n++){ const q = dust[n], u = (q.bz + tm * .009 * sp) % 1, z = 2.5 + u * 14, life = Math.sin(u * Math.PI);
      const x = q.bx * z * kx + Math.sin(tm * .2 + q.ph) * .4, wy = .4 + q.by * 2.2 + Math.sin(tm * .27 + q.ph) * .25, y = hy + (camH - wy) / z * focal;
      const b = (.52 + .3 * life) * (.8 + .2 * Math.sin(tm * .7 + q.ph)) * (.6 + .4 * fogOf(z)); if(b > .5 && y < rows - 1) PL.put(proj(x, z), y, b, q.cx ? 1 : 0); }
    PL.draw(ax, 1, true, 'sq');
  };
}

/* 06 topography: contour lines of a slowly morphing height map, tilted away from the viewer. Elevation above the (1 - share) quantile is amber,
   so Codex owns exactly its share of the map. Contour count = trend, morph speed = cache miss, tokens = walkers along the contours. */
function tTopo(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);
  const Hg = new Float32Array(cols * rows), levels = 7 + Math.round(D.trendK * 6), samp = new Float32Array(1500), sidx = Array.from({length: 1500}, () => (X.rnd() * cols * rows) | 0);
  const u0 = p.off * 4 + 13, top = phone ? .16 : .22, ws = phone ? 1.45 : 1;
  let thr = 1;
  const K = phone ? 60 : 120, ST = 46, paths = new Float32Array(K * ST * 2), seeds = new Float32Array(K * 2);
  for(let k = 0; k < K; k++){ seeds[k * 2] = X.rnd() * cols; seeds[k * 2 + 1] = rows * (top + (1 - top) * Math.pow(X.rnd(), .6)); }
  const at = (x, y) => { x = Math.max(1, Math.min(cols - 2, x | 0)); y = Math.max(1, Math.min(rows - 2, y | 0)); return x * rows + y; };
  const dir = (x, y, v) => { const k = at(x, y), gx = Hg[k + rows] - Hg[k - rows], gy = Hg[k + 1] - Hg[k - 1], g = Math.hypot(gx, gy) || 1; v[0] = -gy / g; v[1] = gx / g * .7; };
  const parts = Array.from({length: Math.round(D.nPart * .3)}, () => ({k: (X.rnd() * K) | 0, ph: X.rnd(), v: 3 + 3 * X.rnd()}));
  const PN = phone ? Math.round(parts.length * .5) : parts.length;
  const tick = ticker(.16, tm => {
    const t = tm * .01 * sp * (1 + D.jitter * .6);
    for(let y = 0; y < rows; y++){ const yn = y / rows, v = 3.1 / (yn + .55) - t, sc = (1 + 1.1 * (1 - yn)) * ws;
      for(let c = 0; c < cols; c++){ const u = (c - cols * .5) / rows * sc * 1.1 + u0;
        let h = .62 * noise(u * .8, v * .8) + .28 * noise(u * 1.9 + 9, v * 1.9 + 3) + .1 * noise(u * 4.1 + 2, v * 4.1 - 7);
        Hg[c * rows + y] = h * h * 1.6; } }
    for(let i = 0; i < samp.length; i++) samp[i] = Hg[sidx[i]]; samp.sort(); thr = samp[Math.min(samp.length - 1, Math.floor(samp.length * D.share))];
    TL.clear(); const {gb, gc} = TL;
    for(let c = 1; c < cols - 1; c++) for(let y = 1; y < rows - 1; y++){
      const k = c * rows + y, h = Hg[k], f = h * levels * 1.4, fr = f - Math.floor(f), e = Math.min(fr, 1 - fr);
      const g = Math.hypot(Hg[k + rows] - Hg[k - rows], Hg[k + 1] - Hg[k - 1]) * .5 * levels * 1.4 + 1e-4, dist = e / g;
      const fog = (.42 + .58 * y / rows) * sstep(top * rows - 2, top * rows + 10, y), idx = Math.round(f) % 5 === 0;
      let b = 0;
      if(dist < .62) b = (idx ? .64 : .3) * (1 - dist * .55);
      if(b * fog >= .05){ gb[k] = b * fog; gc[k] = h > thr ? 1 : 0; }
    }
    tracePaths(paths, K, ST, seeds, dir, 1.1);
    TL.draw(off.begin(), .95, false, 'sq');
  });
  return tm => {
    tick(tm); off.blit(); PL.clear();
    for(let n = 0; n < PN; n++){ const q = parts[n], s = (q.ph * ST + tm * q.v * sp) % (ST - 1), o = (q.k * ST + (s | 0)) * 2, y = paths[o + 1];
      if(y < top * rows + 4) continue; ridePath(PL, paths, ST, q.k, s, .62 + .36 * Math.sin(tm * .6 + q.ph * 7), Hg[at(paths[o], y)] > thr ? 1 : 0, 2); }
    PL.draw(ax, 1, true, 'sq');
  };
}

/* 07 planet: a halftone gas giant rising from the bottom edge, bands turning slowly, the terminator sweeping across.
   Polar cap above the latitude whose area = (1 - share) is amber; band turbulence = trend; band jitter = cache miss; tokens = drifting stars. */
function tPlanet(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);
  const R = rows * (phone ? .66 : .76), cx = cols * (phone ? .6 : .68 + .1 * p.off), cy = rows + R * (phone ? .28 : .5);
  const tilt = .32 + .12 * p.tilt, ct = Math.cos(tilt), st = Math.sin(tilt), sinCap = 2 * D.share - 1, turb = .6 + 1.6 * D.trendK;
  const stars = Array.from({length: Math.round(D.nPart * .3)}, () => ({px: X.rnd(), y: Math.pow(X.rnd(), .7), d: .3 + X.rnd(), ph: X.rnd() * TAU, cx: X.rnd() > D.share}));
  const PN = phone ? Math.round(stars.length * .5) : stars.length;
  const tick = ticker(.15, tm => {
    TL.clear(); const spin = tm * .018 * sp + p.yaw, la = tm * .02 * sp + 2.2 + p.off, Lx = Math.cos(la), Lz = Math.sin(la) * .9 + .25, Ly = .35, Ln = Math.hypot(Lx, Ly, Lz);

      for(let c = Math.max(0, Math.floor(cx - R - 3)); c < Math.min(cols, Math.ceil(cx + R + 3)); c++){
        const dx = (c - cx) / R, rr = dx * dx + dy * dy;
        if(rr > 1){ const rim = Math.sqrt(rr) - 1; if(rim < .035){ const l = (dx * Lx + dy * Ly) / Ln; if(l > .1) TL.put(c, y, .26 * l * (1 - rim / .035), 0); } continue; }
        const nz = Math.sqrt(1 - rr), ny = dy * ct - nz * st, nzz = dy * st + nz * ct, lat = Math.asin(Math.max(-1, Math.min(1, ny))), lon = Math.atan2(dx, nzz) + spin;
        const band = .5 + .5 * Math.sin(lat * 9 + (noise(lon * 1.6 + 20, lat * 5) - .5) * turb * 2.4 + D.jitter * .2 * Math.sin(lon * 6 + tm * .3));
        const alb = .42 + .5 * band, lum = Math.max(0, (dx * Lx + dy * Ly + nz * Lz) / Ln);
        const b = Math.min(.58, alb * Math.pow(lum, .8) * .6 + .03 * nz);   /* R07c: toned down to sit level with 01 */
        TL.put(c, y, b, ny > sinCap ? 1 : 0);
      }
    }
    TL.draw(off.begin(), .95, false, 'dot');
  });
  return tm => {
    tick(tm); off.blit(); PL.clear();
    for(let n = 0; n < PN; n++){ const q = stars[n], x = ((q.px - tm * .0025 * q.d * sp) % 1 + 1) % 1 * cols, y = (.2 + .8 * q.y) * rows;
      const dx = (x - cx) / R, dy = (y - cy) / R; if(dx * dx + dy * dy < 1.08) continue;
      const b = (.5 + .5 * Math.sin(tm * (.4 + .5 * q.d) + q.ph)) * (.5 + .42 * q.d); if(b > .5) PL.put(x, y, b, q.cx ? 1 : 0); }
    PL.draw(ax, 1, true, 'dot');
  };
}

/* 08 galaxy: a two-armed spiral disk seen at a steep angle, low on the left. The arm pattern turns rigidly (a density wave), stars ride it with a
   small sway so the arms never smear. Arm winding = trend, disk thickness = cache miss, stars = tokens, star colour = split. */
function tGalaxy(env, X){
  const {cols, rows, ax, phone} = env, D = X.D, p = X.p, sp = p.speed, TL = new Layer(cols, rows), PL = new Layer(cols, rows), off = offscreen(env);
  const inc = 1.17 + .12 * p.tilt, ci = Math.cos(inc), si = Math.sin(inc), Rg = rows * (phone ? .62 : .95), cx = cols * (phone ? .5 : .3 + .08 * p.off), cy = rows * (phone ? .72 : .84);

/* 11 goldfish.

/* 20 lantern lake.

   climb speed (v = 0.3 + 0.62 s), a climb height and so a flight time, a breeze that leans the plume more the higher it climbs
   (climb * wd + climb^2 * 0.004), a sway, and a new start each lap, clustered round the festival unless it is a wide one; it starts hidden
   behind the shore trees and, unless it sails off the top, gutters, flickers and goes out over its last four seconds. Drawn as a spark below

   flicker; the lake carries the lights as broken strips. Not taken: the boat and figure, the colour sky and halo shading; the ranges and the

  const lights = Array.from({length: 9}, (_, i) => ({px: 100 + (hash2(i, 61) - .5) * 40, ph: hash2(i, 62) * TAU, cx: hash2(i, 63) > D.share ? 1 : 0}));

/* ================= library =================

  {id: 14, src: 'fireflies', style: 'dot', make: tFly, n: () => Math.round(D.nPart * .11)},
  {id: 15, src: 'snowfall', style: 'dot', make: tSnow, n: () => Math.round(D.nPart * .42)},
  {id: 16, src: 'sea-swell', style: 'br', make: tSwell, n: () => Math.round(D.nPart * .5)},
  {id: 17, src: 'pond-ripples', style: 'br', make: tPond, n: () => Math.round(D.nPart / 22)},
  {id: 18, src: 'black-hole', style: 'dot', make: tHole, n: () => Math.round(D.nPart * .25)},
  {id: 19, src: 'moon-phases', style: 'dot', make: tMoon, n: () => Math.round(D.nPart * .2)},

G.more = (href, key = 'more.all') => `<a class="more" href="${href}">${esc(t(key))}</a>`;
/* panel header: icon, title, count badge, right side */
G.ph = (id, icon, color, title, count, right, tag = 'h2') =>
  `<div class="ph"><${tag} id="${id}">${icon ? G.ic(icon, color) : ''}${title}${count != null && count !== '' ? G.cnt(count) : ''}</${tag}><span class="r">${right || ''}</span></div>`;
G.grpH = (n, key) => `<div class="grp-h">${esc(t(key))}</div>`;   /* n kept for call sites; no numbering (owner 2026-11-18) */
let panelI = 0;
G.pn = (id, inner, cls = '') => `<section class="pn ${cls}" style="--i:${panelI++}" aria-labelledby="${id}">${inner}</section>`;
G.resetPanels = () => { panelI = 0; barN = 0; };
G.empty = (key = 'empty') => `<div class="empty">${esc(t(key))}</div>`;

/* fixed-pitch square cell grids */
G.cells = function(nc, nr, level, o = {}){
  const p = o.pitch || 6, px = o.px || Math.round(p * 0.72 * 10) / 10, half = px / 2, out = [];
  for(let c = 0; c < nc; c++) for(let r = 0; r < nr; r++){
    const v = level(c, r); if(!v) continue;
    const col = typeof v[1] === 'string' ? v[1] : COL[v[1] || 0];
    out.push(`<rect x="${(c * p + p / 2 - half).toFixed(2)}" y="${(r * p + p / 2 - half).toFixed(2)}" width="${px}" height="${px}" fill="${col}" fill-opacity="${v[0].toFixed(3)}"${v[2] ? ` class="${v[2]}"` : ''}/>`);
  }
  const w = nc * p, h = nr * p;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${out.join('')}${o.overlay ? o.overlay(p, w, h) : ''}</svg>`;
};
let barN = 0;
G.bar = (frac, ci) => { frac = isFinite(frac) ? frac : 0; const col = typeof ci === 'string' ? ci : COL[ci || 0];
  return `<svg viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="6" fill="${BLUE}" fill-opacity=".08"/><rect class="growbar" style="--d:${(barN++ % 12) * 40}ms" width="${Math.max(0.8, Math.min(1, Math.max(0, frac)) * 100).toFixed(2)}" height="6" fill="${col}" fill-opacity=".85"/></svg>`; };
G.max = (xs, floor = 0) => xs.reduce((a, b) => b > a ? b : a, floor);
G.sum = xs => xs.reduce((a, b) => a + (b || 0), 0);

/* width-dependent blocks: rendered after the view is in the DOM and again on resize */
let fits = [];
G.fit = (id, fn) => { fits.push({id, fn}); return `<div id="${id}"></div>`; };
G.runFits = () => fits.forEach(({id, fn}) => { const el = $(id); if(!el) return; const w = el.clientWidth; if(w) el.innerHTML = fn(w, el); });
let afters = [];
G.after = fn => afters.push(fn);

/* expandable rows: [data-x] toggles the detail row/item with id xd-<key>; content is built on first open */
const details = new Map();
G.detail = (key, fn) => { details.set(key, fn); return key; };
G.xattrs = key => `class="xr" data-x="${key}" tabindex="0" role="button" aria-expanded="false" aria-controls="xd-${key}"`;
function toggle(row){
  const key = row.dataset.x, d = $('xd-' + key); if(!d) return;
  const open = row.getAttribute('aria-expanded') !== 'true';
  row.setAttribute('aria-expanded', String(open));
  d.hidden = !open;
  if(open && !d.dataset.filled){
    const fn = details.get(key), slot = d.querySelector('[data-slot]') || d;
    if(fn){ slot.innerHTML = fn(slot.clientWidth || 600); }
    d.dataset.filled = '1';
  }
}
document.addEventListener('click', e => {
  const l = e.target.closest('[data-lang]'); if(l){ G.setLang(l.dataset.lang); return; }
  if(e.target.closest('a,input,button')) return;
  const r = e.target.closest('[data-x]'); if(r) toggle(r);
});
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-x]')){ e.preventDefault(); toggle(e.target); }
});

/* tooltips: any element with data-tip */
const tip = $('tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(!el){ tip.style.opacity = 0; return; }
  tip.textContent = el.getAttribute('data-tip');
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8);
  tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, e.clientY - tip.offsetHeight - 10) + 'px'; tip.style.opacity = 1;
});
document.addEventListener('mouseleave', () => { tip.style.opacity = 0; });

/* KPI numbers roll from 0 through their own formatter */
G.roll = (v, fmt) => `<span data-roll="${num(v)}" data-fmt="${fmt}">${F[fmt](v)}</span>`;
function rollAll(){
  if(G.STATIC) return;
  document.querySelectorAll('#view [data-roll]').forEach(el => {
    const target = parseFloat(el.dataset.roll), f = F[el.dataset.fmt] || F.n, t0 = performance.now(), Dms = 900;
    const step = now => { const k = Math.min(1, (now - t0) / Dms), e = 1 - Math.pow(1 - k, 3); el.textContent = f(target * e); if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* quota pace (shared by overview and usage) */
G.WMS = {'7d': 7 * 864e5, '5h': 5 * 36e5};
G.pace = (q, now) => {
  const reset = Date.parse(q.resetsAt || ''), W = G.WMS[q.window] || 7 * 864e5;
  if(!isFinite(reset)) return {e: 0, reset: NaN, hot: false, txt: ''};
  const e = Math.min(1, Math.max(0.001, (now - (reset - W)) / W)), diff = q.usedPct / 100 / e - 1;
  if(diff <= 0 || q.usedPct <= 0) return {e, reset, hot: false, txt: t('quota.slower', {p: Math.round(-Math.max(-1, diff) * 100)})};
  const el = e * W, tEx = (100 - q.usedPct) / (q.usedPct / el), early = (reset - now) - tEx;
  return {e, reset, hot: early > 0, txt: early > 0 ? t('quota.faster', {p: Math.round(diff * 100), d: F.dur(early / 1e3)}) : t('quota.fasterOk', {p: Math.round(diff * 100)})};
};
G.multiAcct = () => new Set(D.quota.map(q => q.agent + '\u0000' + q.account)).size > new Set(D.quota.map(q => q.agent)).size;

/* ------------------------------------------------------------------ background: today's piece (web/art.js) */
/* Inputs: today's tokens, the Claude Code share of Claude Code + Codex requests, the 30-day cost trend, the cache hit rate.
   The template rotates by the local date of generatedAt in the page zone, so a snapshot always shows the same piece; ?art=N previews one. */
function art(){
  const lib = window.GLASSBOX_ART, cv = $('art'); if(!lib || !cv) return null;
  const TD = D.today, totTok = G.totTok(TD.tokens), req = a => (TD.byAgent.find(x => x.agent === a) || {}).requests || 0;
  const cc = req('claude-code'), cx = req('codex'), share = cc + cx ? cc / (cc + cx) : 1;
  const date = F.localDate(D.generatedAt) || (/^\d{4}-\d{2}-\d{2}/.test(D.generatedAt || '') ? D.generatedAt.slice(0, 10) : '');
  const qa = Q.get('art'), pick = /^\d{1,2}$/.test(qa || '') && lib.ENABLED.includes(+qa) ? +qa : null;
  const A = lib.create(cv, {tok: totTok, share, trend: D.trend.map(d => d.cc + d.cx), cache: totTok > 0 ? TD.cacheHitRate : 1}, {date, art: pick});
  if(!A) return null;
  const nn = String(A.id).padStart(2, '0');
  G.capText = () => {
    const name = t('art.name.' + nn);
    $('cap0').textContent = t('art.cap', {n: A.ymd, id: nn, name}) + (A.src ? ' · ' + t('art.credit', {src: A.src}) : '') + (A.id !== A.auto ? ' · ' + t('art.preview') : '');
    $('capMid').innerHTML = `<span style="color:${BLUE}">■</span> Claude Code ${F.pct(share)}&emsp;<span style="color:${OR}">■</span> Codex ${F.pct(1 - share)}`;
    $('cap1').textContent = t('art.legend.' + nn, {n: F.n(A.n), tok: F.tok(totTok)});
    cv.setAttribute('aria-label', t('art.aria', {name, enc: t('art.enc.' + nn)}));
  };
  G.art = A;
  return A;
}

/* ------------------------------------------------------------------ header, clock, router */
function header(){
  $('viewChip').textContent = t(D.view === 'public' ? 'view.public' : 'view.private');
  $('stamp').textContent = t('stamp', {t: F.when(D.generatedAt)});
  document.title = t('app.title');
}
let lastSec = -1;
function tick(Tm, force){
  const now = D.T0 + Tm * 1000, sec = Math.floor(Tm); if(sec === lastSec && !force) return; lastSec = sec;
  document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = F.cd(Date.parse(el.dataset.cd) - now); });
  $('clock').textContent = F.clock(now);
}
const ROUTES = ['overview', 'usage', 'code', 'machines', 'services'];
G.route = () => {
  const h = location.hash.replace(/^#\/?/, ''), [p, qs] = h.split('?');
  const name = p === '' ? 'overview' : p;
  return {name: ROUTES.includes(name) ? name : 'overview', params: new URLSearchParams(qs || '')};
};
G.href = (name, params) => { const qs = params ? new URLSearchParams(Object.entries(params).filter(([, v]) => v != null && v !== '')).toString() : '';
  return '#/' + (name === 'overview' ? '' : name) + (qs ? '?' + qs : ''); };
let lastRoute = null;
G.render = (keep) => {
  const r = G.route(), view = $('view');
  fits = []; afters = []; details.clear(); G.resetPanels();
  document.querySelectorAll('#nav a, #tabs a').forEach(a => { if(a.dataset.route === r.name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  header();
  if(G.capText) G.capText();
  if(!D.ok){ view.innerHTML = `<div class="nogb">${esc(t('nodata'))}</div>`; return; }
  const sameRoute = lastRoute === r.name;
  const y = scrollY;
  view.innerHTML = G.pages[r.name](r.params);
  G.runFits();
  if(!G.STATIC && !sameRoute && !keep){ document.body.classList.remove('anim'); void document.body.offsetWidth; document.body.classList.add('anim'); rollAll(); }
  if(!sameRoute && !keep) scrollTo(0, 0); else scrollTo(0, y);
  afters.forEach(f => f());                     /* after the scroll reset, so a section jump (sec=) is kept */
  lastRoute = r.name;
  tick(G.STATIC ? (FROZEN || 0) : (performance.now() - start) / 1000, true);
};
let start = performance.now();
G.boot = () => {
  applyStatic(); tabIcons();
  const A = D.ok ? art() : null;
  if(!A) $('art').setAttribute('aria-hidden', 'true');
  if(!G.STATIC) document.body.classList.add('anim');
  G.render();
  addEventListener('hashchange', () => G.render());
  const drawAll = (Tm, force) => { if(A && A.draw) A.draw(Tm + 6); tick(Tm, force); };
  let lastF = 0;
  function frame(ts){ requestAnimationFrame(frame); if(document.hidden || ts - lastF < 40) return; lastF = ts; drawAll((performance.now() - start) / 1000); }
  if(FROZEN !== null) drawAll(FROZEN, true); else if(REDUCE) drawAll(8, true); else { drawAll(0, true); requestAnimationFrame(frame); }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { G.runFits(); if(A && A.relayout) A.relayout(); if(G.STATIC) drawAll(FROZEN !== null ? FROZEN : 8, true); }, 120); });
};
})();
</script>
<script>
/* glassbox pages: #/ overview (c-v9), #/usage, #/code, #/machines, #/services. All interface text goes
   through t() (web/i18n.js); data text (project names, commit titles, model names) is shown as is. */
(function(){
'use strict';
const G = window.GLASSBOX_APP, D = G.D, P = G.pages, F = G.F, t = G.t, esc = G.esc, T = G.T, bd = G.bd, C = G.C;
const sum = G.sum, max = G.max;
const PUBLIC = D.view === 'public';
const AGENTS = ['claude-code', 'codex'];

/* ================================================================== shared pieces */
const totals = () => D.trend.map(d => d.cc + d.cx);
function avgLast(xs, n){ const s = xs.slice(-n); return s.length ? sum(s) / s.length : 0; }
const byAgent = list => Object.fromEntries(list.map(a => [a.agent, a]));
const machineIds = () => D.machines.map(m => m.id);

function kpi(labKey, valHtml, sub, cls = ''){
  return `<div><p class="lab">${esc(t(labKey))}</p><div class="val ${cls}">${valHtml}</div><div class="sub">${sub || '&nbsp;'}</div></div>`;
}
function costDelta(cost, avg){
  if(!(avg > 0)) return '';
  const dv = cost / avg - 1, cls = dv > 0.2 ? 'c-warn' : dv < -0.2 ? 'c-ok' : '';
  return `<span class="${cls}">${dv >= 0 ? '▲' : '▼'} ${F.pct(Math.abs(dv))}</span> ${esc(t('kpi.vsAvg', {v: F.usd(avg)}))}`;
}

/* quota windows */
function quotaArticle(q, i, multi){
  const P_ = G.pace(q, D.T0), f = q.usedPct / 100, cls = G.lvlCls(f);
  return `<article><div class="qh"><b>${G.agTag(q.agent)} ${G.lbl('win.', q.window)}${multi ? ' ' + G.code(q.account) : ''}</b><span class="val ${cls}" style="font-size:22px">${F.pctN(q.usedPct).replace(/[.,]0(?=\D*$)/, '')}</span></div>
    ${G.fit('qb-' + i, w => qbar(q, w))}
    <div class="qf"><span>${esc(t('quota.reset', {t: F.when(q.resetsAt)}))} · <span data-cd="${esc(q.resetsAt || '')}">${isFinite(P_.reset) ? F.cd(P_.reset - D.T0) : '—'}</span></span>${bd(esc(t(P_.hot ? 'quota.hot' : 'quota.calm')), P_.hot ? 'c-warn' : 'c-ok')}</div>
    <div class="qf" style="margin-top:3px"><span>${esc(P_.txt)}</span><span>${esc(t('quota.sample', {t: F.ago(q.sampledAt)}))}</span></div></article>`;
}
function qbar(q, w){
  const P_ = G.pace(q, D.T0), p = 5, nc = Math.max(1, Math.floor(w / p)), u = Math.round(q.usedPct / 100 * nc), m = Math.min(nc - 1, Math.round(P_.e * nc));
  const li = G.lvlIdx(q.usedPct / 100);
  return `<div class="qbar">${G.cells(nc, 3, c => { if(c === m && isFinite(P_.reset)) return [1, 1, 'qmark']; return c < u ? [0.55 + 0.4 * (c / nc), li] : [0.1, 0]; }, {pitch: p, px: 4})}</div>`;
}
function quotaPanel(id, withMore){
  const multi = G.multiAcct();
  const right = esc(t('quota.paceMark')) + (withMore ? ' ' + G.more('#/usage?sec=quota') : '');
  return G.pn(id, G.ph(id, 'gauge', 'or', esc(t('quota.title')), esc(t('quota.windows', {n: D.quota.length})), right) +
    (D.quota.length ? `<div class="qs">${D.quota.map((q, i) => quotaArticle(q, i, multi)).join('')}</div>` : G.empty()));
}

/* machines, one per line */
function probeBadge(m){
  return m.probeLastReport ? bd(esc(t('mach.probe', {t: F.ago(m.probeLastReport)})), (D.T0 - Date.parse(m.probeLastReport)) > 9e5 ? 'c-warn' : 'c-ok') : bd(esc(t('mach.noProbe')), 'c-dim');
}
function metrics(s){
  if(!s) return [];
  const pct = (a, b) => b ? a / b : 0;
  return [['mach.cpu', s.cpuPct / 100, F.pctN(s.cpuPct)],
    ['mach.mem', pct(s.memUsed, s.memTotal), `${F.bytes(s.memUsed)} / ${F.bytes(s.memTotal)}`],
    ['mach.disk', pct(s.diskUsed, s.diskTotal), `${F.bytes(s.diskUsed)} · ${F.pct(pct(s.diskUsed, s.diskTotal))}`]];
}
function metricHtml([k, f, v]){
  return `<div class="metric"><div class="lab"><span>${esc(t(k))}</span><b class="${f >= 0.75 ? G.lvlCls(f) : ''}">${esc(v)}</b></div>${G.bar(f, G.lvlIdx(f))}</div>`;
}
function liveAgents(id){
  return D.runtimes.filter(r => r.machine === id && r.activeSessions > 0 && !r.stale).map(r => bd(`${G.AG(r.agent)} ${F.n(r.activeSessions)}`, G.agCls(r.agent), true, '', true)).join(' ');
}
function machineLine(m, i){
  const s = m.system, met = metrics(s), ag = liveAgents(m.id);
  const side = m.online ? (s && s.uptimeSec != null ? esc(t('mach.uptime', {d: F.dur(s.uptimeSec)})) : '') : esc(t('mach.offlineFor', {t: F.ago(m.lastSeen)}));
  return `<div class="mline${m.online ? '' : ' off'}">
    <div class="id"><div class="mh">${G.mc(m.id)}<b>${T(m.label)}</b></div>
      <div class="bds">${bd(esc(t(m.online ? 'mach.online' : 'mach.offline')), m.online ? 'c-ok' : 'c-bad', true, '', m.online)}${m.os ? bd(G.OS(m.os), 'c-dim') : ''}${m.role ? bd(G.lbl('role.', m.role), 'c-vio') : ''}</div></div>
    ${met.length ? met.map(metricHtml).join('') : `<div class="nodata" style="grid-column:span 3">${esc(t('mach.noSystem'))}</div>`}
    <div class="spark" title="${esc(t('mach.cpu24'))}">${G.fit('sp-' + i, (w, el) => spark(m.history.map(h => h.cpuPct), w, +(el.dataset.k || 0)))}<span class="rp" title="${esc(t('mach.replayTip'))}" hidden>${esc(t('mach.replay'))}</span></div>
    <div class="side"><span>${side}</span><div class="bds" style="justify-content:flex-end">${probeBadge(m)}${ag ? ' ' + ag : ''}</div></div>
  </div>`;
}
function spark(vals, w, k = 0){
  vals = vals.filter(v => v != null); const n = vals.length;
  if(!n) return `<span class="nodata">${esc(t('mach.noHistory'))}</span>`;
  const NR = 9, mx = Math.max(20, ...vals), full = Math.min(Math.floor(w / 3), Math.max(1, Math.floor(w / 3 / n)) * n);   /* scale and width of the full chart */
  const win = k ? replayWindow(n, k) : {start: 0, len: n}, per = Math.max(1, Math.floor(full / win.len)), nc = Math.min(Math.floor(w / 3), per * win.len);
  return G.cells(nc, NR, (c, r) => { const d = win.start + Math.min(win.len - 1, Math.floor(c / per)), v = vals[d] / mx * NR, rb = NR - 1 - r; return rb + 0.5 <= v ? [0.5 + 0.45 * rb / NR, 0] : [0.06, 0]; }, {pitch: 3, px: 2.4});
}

/* replay of the 24h CPU sparks (B2). Step 0 is the full chart: the default, the static frame (?t=, reduced motion) and what the tooltip
   describes. While a spark is on screen, steps 1.. show a window of half the history that slides one sample per second from the oldest
   start to the newest end, holds the newest window for PAUSE seconds, then starts over. Off screen it returns to step 0. The "replay" mark
   shows only while replaying. One timer; it stops itself when a render replaces the list. */
const PAUSE = 2;
function replayWindow(n, k){ const len = Math.max(2, Math.floor(n / 2)), last = n - len; return {start: Math.min(k - 1, last), len}; }
const replaySteps = n => n - Math.max(2, Math.floor(n / 2)) + 1 + PAUSE;      /* steps per cycle, k = 1 .. replaySteps */
let rpTimer = 0, rpObs = null;
function replaySparks(){
  clearInterval(rpTimer); if(rpObs) rpObs.disconnect(); rpObs = null;
  const els = [...document.querySelectorAll('.mline .spark')].map(el => ({el, f: el.querySelector('[id^="sp-"]'), rp: el.querySelector('.rp')}))
    .filter(x => x.f && x.f.querySelector('svg'));
  if(G.STATIC || !els.length || !('IntersectionObserver' in window)) return;
  const byEl = new Map(els.map(x => [x.el, x])), seen = new Set();
  const vals = x => { const m = D.machines[+x.f.id.slice(3)]; return m ? m.history.map(h => h.cpuPct) : []; };
  const show = (x, k) => { const w = x.f.clientWidth; if(!w) return false; x.f.dataset.k = k; x.f.innerHTML = spark(vals(x), w, k); if(x.rp) x.rp.hidden = !k; return true; };
  rpObs = new IntersectionObserver(es => es.forEach(e => { const x = byEl.get(e.target); if(e.isIntersecting) seen.add(e.target);
    else { seen.delete(e.target); if(x && +x.f.dataset.k) show(x, 0); } }));
  els.forEach(x => rpObs.observe(x.el));
  rpTimer = setInterval(() => {
    if(!els[0].el.isConnected){ clearInterval(rpTimer); if(rpObs) rpObs.disconnect(); rpObs = null; return; }
    if(document.hidden) return;
    els.forEach(x => { if(!seen.has(x.el)) return; const n = vals(x).filter(v => v != null).length; if(n < 4) return;
      show(x, (+x.f.dataset.k || 0) % replaySteps(n) + 1); });
  }, 1000);
}

/* commit heatmap */
function heat(w, days, mobileWeeks){
  if(!days.length) return G.empty();
  const W = Math.ceil(days.length / 7), WN = w < 600 ? Math.min(W, mobileWeeks) : W, C0 = W - WN;
  const p = Math.max(5, Math.min(24, Math.floor((w - 22) / WN))), px = Math.max(4, Math.round(p * 0.74));
  const lvl = v => v === 0 ? 0 : v < 4 ? 1 : v < 10 ? 2 : v < 20 ? 3 : 4, AL = [0.07, 0.3, 0.52, 0.78, 1];
  const rects = [];
  for(let c = 0; c < WN; c++) for(let r = 0; r < 7; r++){
    const d = days[(C0 + c) * 7 + r]; if(!d) continue; const l = lvl(d.count);
    rects.push(`<rect x="${(c * p + (p - px) / 2).toFixed(1)}" y="${(r * p + (p - px) / 2).toFixed(1)}" width="${px}" height="${px}" fill="${l === 4 ? C.HI : C.BLUE}" fill-opacity="${AL[l]}" data-tip="${esc(t('heat.tip', {d: F.dfull(d.date), n: F.n(d.count)}))}"/>`);
  }
  let lab = '', last = -9;
  for(let k = 0; k < WN; k++){ const d = days[(C0 + k) * 7]; if(!d || !d.date) continue; const dd = parseInt(d.date.slice(8, 10), 10);
    if(dd <= 7 && k - last >= Math.ceil(34 / p)){ last = k; lab += `<span class="ml" style="left:${k * p}px">${esc(F.mon(d.date))}</span>`; } }
  const wl = [1, 3, 5].map(d => `<span class="wl" style="top:${(d + 0.5) * p}px">${esc(F.wkn(d))}</span>`).join('');

/* stacked daily cell chart: days [{date, parts:{key:value}}], series [{key,label,color}] bottom-up */
function stackChart(w, days, series, fmt, o = {}){
  const n = days.length; if(!n) return G.empty();
  const avail = w - 44, p = Math.max(2, Math.min(5, Math.floor(avail / n))), per = Math.max(1, Math.floor(avail / p / n)), nc = per * n, NR = Math.round((o.rows || (w < 500 ? 18 : 24)) * 5 / p), gapCol = per >= 3 ? per - 1 : -1;
  const tot = days.map(d => sum(series.map(s => d.parts[s.key] || 0))), mx = max(tot) || 1;
  const cum = days.map(d => { let acc = 0; return series.map(s => (acc += (d.parts[s.key] || 0)) / mx * NR); });
  const svg = G.cells(nc, NR, (c, r) => {
    const d = Math.floor(c / per); if(c % per === gapCol) return null;
    const f = tot[d] / mx * NR, rb = NR - 1 - r;
    if(rb + 0.55 <= f && tot[d] > 0){
      let si = cum[d].findIndex(v => v >= rb + 0.5); if(si < 0) si = series.length - 1;
      const top = f - rb <= 1.55;
      return [Math.min(1, top ? 1 : 0.42 + 0.42 * rb / f), series[si].color];
    }
    return [0.05, 0];
  }, {pitch: p, px: p >= 5 ? 4 : p * 0.75, overlay: (pp, W, H) => days.map((d, i) => {
    const lines = [F.dfull(d.date) + '  ' + fmt(tot[i])].concat(series.filter(s => d.parts[s.key]).slice().reverse().map(s => `  ${s.label}  ${fmt(d.parts[s.key])}`));
    return `<rect class="ov" x="${i * per * pp}" y="0" width="${per * pp}" height="${H}" data-tip="${esc(lines.join('\n'))}"/>`; }).join('')});
  const ys = [mx, mx / 2, 0].map((v, i) => `<span class="yl" style="top:${i === 0 ? 0 : i === 1 ? (NR * p / 2 - 7) : (NR * p - 12)}px">${esc(fmt === F.usd ? F.usd0(v) : F.tok(v))}</span>`).join('');
  return svg + ys;
}

      <tr class="xd" id="xd-${key}" hidden><td colspan="5"><div class="box" data-slot></div></td></tr>`;

function dayRows(days){

function hourChart(w, hr){
  const n = 24, p = 5, per = Math.max(1, Math.floor((w - 44) / p / n)), nc = per * n, NR = w < 500 ? 12 : 16;
  const byH = Array(24).fill(null).map((_, i) => hr.find(x => x.hour === i) || {hour: i, requests: 0, costUsd: 0});
  const mx = max(byH.map(x => x.requests)) || 1;
  const svg = G.cells(nc, NR, (c, r) => { const d = Math.floor(c / per); if(per >= 3 && c % per === per - 1) return null; const f = byH[d].requests / mx * NR, rb = NR - 1 - r;
    return rb + 0.55 <= f && byH[d].requests > 0 ? [f - rb <= 1.55 ? 1 : 0.42 + 0.42 * rb / f, 0] : [0.05, 0]; }, {pitch: p, px: 4,
    overlay: (pp, W, H) => byH.map((x, i) => `<rect class="ov" x="${i * per * pp}" y="0" width="${per * pp}" height="${H}" data-tip="${esc(String(i).padStart(2, '0') + ':00  ' + t('req.n', {n: F.n(x.requests)}) + '  ' + F.usd(x.costUsd))}"/>`).join('')});
  return svg + [mx, mx / 2, 0].map((v, i) => `<span class="yl" style="top:${i === 0 ? 0 : i === 1 ? (NR * p / 2 - 7) : (NR * p - 12)}px">${esc(F.tok(v))}</span>`).join('');
}
function quotaChart(w, q){
  const reset = Date.parse(q.resetsAt || ''), W = G.WMS[q.window] || 7 * 864e5, t0 = reset - W;
  if(!isFinite(reset)) return G.empty();
  const p = 5, nc = Math.max(10, Math.floor(w / p)), NR = 14, now = D.T0;
  const hs = q.history.map(h => ({t: Date.parse(h.t), v: h.usedPct})).filter(h => isFinite(h.t)).sort((a, b) => a.t - b.t);
  const colT = c => t0 + (c + 0.5) / nc * W;
  const valAt = tm => { let v = null; for(const h of hs){ if(h.t <= tm) v = h.v; else break; } return v; };
  const lastSample = hs.length ? hs[hs.length - 1].t : -Infinity;
  const svg = G.cells(nc, NR, (c, r) => {
    const tm = colT(c), rb = NR - 1 - r, paceRow = (c + 0.5) / nc * NR;
    if(Math.abs(rb + 0.5 - paceRow) < 0.5) return [0.55, 1];
    if(tm > Math.max(now, lastSample)) return [0.04, 0];
    const v = valAt(tm); if(v == null) return [0.05, 0];
    const f = v / 100 * NR;
    return rb + 0.5 <= f ? [0.45 + 0.5 * rb / NR, G.lvlIdx(v / 100)] : [0.07, 0];
  }, {pitch: p, px: 4, overlay: (pp, Wd, H) => {
    const segs = 24, sw = Wd / segs;
    return Array.from({length: segs}, (_, i) => { const tm = t0 + (i + 1) / segs * W, v = tm > Math.max(now, lastSample) ? null : valAt(tm);
      return `<rect class="ov" x="${(i * sw).toFixed(1)}" y="0" width="${sw.toFixed(1)}" height="${H}" data-tip="${esc(F.when(new Date(tm).toISOString()) + '  ' + (v == null ? '—' : F.pctN(v)))}"/>`; }).join('');
  }});
  return svg;
}

function weekdayCount(w, days){
  const acc = Array(7).fill(0), n = Array(7).fill(0);
  days.forEach(d => { if(!d.date) return; const k = new Date(d.date + 'T00:00:00Z').getUTCDay(); acc[k] += d.count; n[k]++; });
  const avg = acc.map((v, i) => n[i] ? v / n[i] : 0), mx = max(avg), order = [1, 2, 3, 4, 5, 6, 0], cw = Math.floor((w - 6 * 8) / 7);
  return `<div class="cols7">` + order.map(k => { const f = mx ? avg[k] / mx : 0, NR = 10, nc = Math.max(3, Math.floor(cw / 5));
    return `<div data-tip="${esc(F.wk(k) + '  ' + t('code.avgN', {n: F.n1(avg[k])}))}">${G.cells(nc, NR, (c, r) => NR - 1 - r + 0.5 <= f * NR ? [0.45 + 0.5 * f, k === 0 || k === 6 ? 6 : 4] : [0.06, 0], {pitch: 5, px: 4})}
      <div class="mf"><span>${esc(F.wk(k))}</span><span>${esc(F.n1(avg[k]))}</span></div></div>`; }).join('') + '</div>';
}
function hourCount(w, hours){
  const p = 5, per = Math.max(1, Math.floor(w / p / 24)), nc = per * 24, NR = 10, mx = max(hours) || 1;
  return G.cells(nc, NR, (c, r) => { const d = Math.floor(c / per); if(per >= 3 && c % per === per - 1) return null; const f = hours[d] / mx * NR, rb = NR - 1 - r;
    return rb + 0.5 <= f && hours[d] ? [0.45 + 0.5 * rb / NR, d < 7 || d >= 22 ? 6 : 0] : [0.05, 0]; }, {pitch: p, px: 4,
    overlay: (pp, W, H) => hours.map((v, i) => `<rect class="ov" x="${i * per * pp}" y="0" width="${per * pp}" height="${H}" data-tip="${esc(String(i).padStart(2, '0') + ':00  ' + nCommits(v))}"/>`).join('')});
}

        <td class="v">${cell(HID('runtimes'), f.agents ? F.n(f.agents) : dash)}</td><td class="v hide-s">${cell(HID('runtimes'), f.agents ? F.n(f.proc) : dash)}</td><td class="v ${f.active ? 'c-ok' : ''}">${cell(HID('runtimes'), f.agents ? F.n(f.active) : dash)}</td>` +
        (today ? `<td class="v hide-s">${f.req == null ? dash : F.n(f.req)}</td><td class="v">${f.cost == null ? dash : F.usd(f.cost)}</td>` : '') +
        `<td class="v">${cell(HID('jobs'), f.jobs.length ? F.n(f.jobs.length) : dash)}</td><td class="v ${f.down ? 'c-bad' : ''}">${cell(HID('services'), f.svcs.length ? `<a class="more nomark" href="${G.href('services', {machine: m.id})}">${F.n(f.svcs.length)}</a>` + (f.down ? ` <span class="c-bad">(${F.n(f.down)})</span>` : '') : dash)}</td></tr>`; }).join('') + `</table></div>`;
}
function machineBadges(f){
  const out = [];
  if(!HID('runtimes')) out.push(f.agents ? bd(esc(t('mach.badgeAgents', {a: F.n(f.agents), p: F.n(f.proc), s: F.n(f.active)})), f.active ? 'c-fg' : 'c-dim', true, '', f.active > 0) : bd(esc(t('mach.noAgent')), 'c-dim'));
  const parts = [];
  if(!HID('jobs')) parts.push(t('mach.nJobs', {n: F.n(f.jobs.length)}));
  if(!HID('services')) parts.push(t('mach.nSvc', {n: F.n(f.svcs.length)}));
  if(parts.length) out.push(bd(esc(parts.join(' · ')), f.down || f.jobs.some(j => !j.ok) ? 'c-warn' : 'c-vio'));
  return out.join('');
}

P.machines = params => {
  const online = D.machines.filter(m => m.online).length, live = D.runtimes.filter(r => !r.stale);
  const withSys = D.machines.filter(m => m.system);
  const fresh = D.machines.filter(m => m.probeLastReport && D.T0 - Date.parse(m.probeLastReport) <= 9e5).length, probes = D.machines.filter(m => m.probeLastReport).length;
  let h = G.grpH('01', 'mach.grpSummary');
  h += G.pn('m-sum', G.ph('m-sum', 'server', 'ok', esc(t('mach.title')), esc(t('mach.onlineN', {a: online, b: D.machines.length})), esc(t('mach.src'))) + `<div class="kpis sm" style="--n:5">
    ${kpi('mach.kOnline', `${G.roll(online, 'n')}<span class="c-dim" style="font-size:.6em"> / ${F.n(D.machines.length)}</span>`, D.machines.filter(m => !m.online).map(m => esc(m.id)).join(' ') ? esc(t('mach.offlineIds', {ids: D.machines.filter(m => !m.online).map(m => m.id).join(' ')})) : esc(t('mach.allOnline')), 'g')}
    ${kpi('mach.kCpu', withSys.length ? G.roll(sum(withSys.map(m => m.system.cpuPct)) / withSys.length / 100, 'pct1') : dash, esc(t('mach.ofN', {n: withSys.length})), 'c')}
    ${HID('runtimes') ? kpi('mach.kActive', dash, esc(t('hidden.online'))) : kpi('mach.kActive', G.roll(sum(live.map(r => r.activeSessions)), 'n'), esc(t('mach.kProc', {n: F.n(sum(live.map(r => r.processes)))})), 'w')}
    ${kpi('mach.kProbes', `${G.roll(fresh, 'n')}<span class="c-dim" style="font-size:.6em"> / ${F.n(probes)}</span>`, esc(t('mach.freshHint')), fresh < probes ? 'w' : 'v')}
    ${HID('services') ? kpi('mach.kServices', dash, esc(t('hidden.online'))) : kpi('mach.kServices', G.roll(D.services.length, 'n'), esc(t('svc.bad', {n: D.services.filter(s => s.status === 'down').length})), D.services.some(s => s.status === 'down') ? 'b' : '')}
  </div>` + (D.machines.length ? `<div class="sep"></div><div class="ph sm"><h3>${esc(t('mach.byMachine'))}</h3><span class="r">${D.machines.some(m => m.todayByAgent !== null) ? esc(t('mach.todayNote')) : ''}</span></div>` + summaryTable() : ''), 'hero');
  h += G.grpH('02', 'mach.grpEach');
  if(!D.machines.length) h += G.pn('m-none', G.ph('m-none', 'server', 'ok', esc(t('mach.title')), '', '') + G.empty());
  D.machines.forEach((m, i) => {
    const s = m.system, f = machineFacts(m);
    const id = 'm-' + i;
    const head = `${G.mc(m.id, true)} ${T(m.label)}`;
    const right = `<span class="bds">${bd(esc(t(m.online ? 'mach.online' : 'mach.offline')), m.online ? 'c-ok' : 'c-bad', true, '', m.online)}${m.os ? bd(G.OS(m.os), 'c-dim') : ''}${m.role ? bd(G.lbl('role.', m.role), 'c-vio') : ''}${probeBadge(m)}</span>`;
    const facts = [['mach.lastSeen', m.lastSeen ? `${esc(F.full(m.lastSeen))} <span class="rel">${esc(F.ago(m.lastSeen))}</span>` : dash],
      ['mach.probeLast', m.probeLastReport ? `${esc(F.full(m.probeLastReport))} <span class="rel">${esc(F.ago(m.probeLastReport))}</span>` : esc(t('mach.noProbe'))],
      ['mach.uptimeK', s && s.uptimeSec != null ? esc(F.dur(s.uptimeSec)) : dash]];
    const hist = m.history;
    const chart = (key, k) => { const vals = hist.map(x => x[k]); const last = [...vals].reverse().find(v => v != null);
      return `<div class="chart3"><div class="lab"><span>${esc(t(key))}</span><span>${last == null ? dash : esc(t('mach.nowMax', {v: F.pctN(last), m: F.pctN(max(vals.filter(v => v != null)))}))}</span></div><div class="stretch">${G.fit(`${id}-${k}`, w => histChart(w, hist, k))}</div></div>`; };
    h += `<div id="mach-${esc(m.id)}"></div>` + G.pn(id, G.ph(id, '', '', head + ' ' + `<span class="bds">${machineBadges(f)}</span>`, '', right) + `<div class="mdet">
        <div class="metrics">${s ? metrics(s).map(metricHtml).join('') : `<div class="nodata">${esc(t('mach.noSystem'))}</div>`}
          <dl class="facts">${facts.map(([k, v]) => `<dt>${esc(t(k))}</dt><dd>${v}</dd>`).join('')}</dl></div>
        <div class="charts">${hist.length ? chart('mach.cpu24', 'cpuPct') + chart('mach.mem24', 'memPct') + (hist.some(x => x.diskPct != null) ? chart('mach.disk24', 'diskPct') : '') : `<div class="nodata">${esc(t('mach.noHistory'))}</div>`}
          ${hist.length ? `<div class="xl flat"><span>${esc(F.when(hist[0].t))}</span><span>${esc(F.when(hist[hist.length - 1].t))}</span></div>` : ''}</div>
      </div><div class="sep"></div>
      <div class="msec"><div><div class="ph sm"><h3>${G.ic('term', 'vio')}${esc(t('mach.agentSec'))}</h3><span class="r"></span></div>${agentSection(m, f)}</div>
      <div><div class="ph sm"><h3>${G.ic('clock', 'or')}${esc(t('mach.taskSec'))}</h3><span class="r"></span></div>${taskSection(m, f)}</div></div>`, m.online ? '' : 'offpn');
  });
  const ids = new Set(machineIds()), orphan = D.runtimes.filter(r => !ids.has(r.machine));
  if(orphan.length && !HID('runtimes')) h += G.pn('m-orph', G.ph('m-orph', 'term', 'vio', esc(t('mach.otherRt')), '', '') + `<table class="tb">${runtimeRows(orphan)}</table>`);
  const jump = params && params.get('m');
  if(jump) G.after(() => { const el = G.$('mach-' + jump); if(el) el.scrollIntoView({block: 'start'}); });
  return h;
};
function histChart(w, hist, k){
  const vals = hist.map(x => x[k]), n = vals.length; if(!n) return '';
  const p = 4, per = Math.max(1, Math.floor(w / p / n)), nc = Math.min(Math.floor(w / p), per * n), NR = 10;
  return G.cells(nc, NR, (c, r) => { const d = Math.min(n - 1, Math.floor(c / per)), v = vals[d]; if(v == null) return [0.04, 0];
    const f = v / 100 * NR, rb = NR - 1 - r; return rb + 0.5 <= Math.max(0.6, f) ? [0.45 + 0.5 * rb / NR, v >= 75 ? G.lvlIdx(v / 100) : 0] : [0.06, 0]; }, {pitch: p, px: 3.2,
    overlay: (pp, W, H) => hist.map((x, i) => `<rect class="ov" x="${i * per * pp}" y="0" width="${per * pp}" height="${H}" data-tip="${esc(F.when(x.t) + '  ' + (x[k] == null ? '—' : F.pctN(x[k])))}"/>`).join('')});
}

/* ================================================================== #/services */
P.services = params => {
  svcN = 0;
  const all = D.services.slice().sort(svcSort);
  const STS = ['all', 'up', 'down', 'other'];
  let stF = params.get('st') || 'all'; if(!STS.includes(stF)) stF = 'all';
  const machF = params.get('machine'), q = (params.get('q') || '').toLowerCase();
  let sort = params.get('sort') || 'status'; if(!['status', 'name', 'mem', 'cpu', 'up'].includes(sort)) sort = 'status';
  const isOther = s => s.status !== 'up' && s.status !== 'down';
  const counts = {all: all.length, up: all.filter(s => s.status === 'up').length, down: all.filter(s => s.status === 'down').length, other: all.filter(isOther).length};
  let list = all.filter(s => stF === 'all' || (stF === 'other' ? isOther(s) : s.status === stF));
  const NOM = '-';                                  /* machine=- : services without a machine */
  const mkey = s => s.machine || NOM;
  if(machF) list = list.filter(s => mkey(s) === machF);
  if(q) list = list.filter(s => typeof s.name === 'string' && s.name.toLowerCase().includes(q));
  const num0 = v => v == null ? -1 : v;
  if(sort === 'name') list.sort((a, b) => G.Tplain(a.name).localeCompare(G.Tplain(b.name)));
  if(sort === 'mem') list.sort((a, b) => num0(b.memBytes) - num0(a.memBytes));
  if(sort === 'cpu') list.sort((a, b) => num0(b.cpuPct) - num0(a.cpuPct));
  if(sort === 'up') list.sort((a, b) => (a.uptimePct24h == null ? 101 : a.uptimePct24h) - (b.uptimePct24h == null ? 101 : b.uptimePct24h));
  const ups = all.map(s => s.uptimePct24h).filter(v => v != null);
  const lk = o => G.href('services', {st: stF === 'all' ? null : stF, machine: machF, q: q || null, sort: sort === 'status' ? null : sort, ...o});
  let h = G.grpH('01', 'svc.grpSummary');
  const HID = D.hidden.has('services');           /* not in this snapshot: say so instead of "0 services, all up" */
  if(HID) h += G.pn('s-sum', G.ph('s-sum', 'box', 'ok', esc(t('svc.title')), '', '') + `<div class="hiddenpn">${esc(t('hidden.online'))}</div>`);
  else{
    h += G.pn('s-sum', G.ph('s-sum', 'box', 'ok', esc(t('svc.title')), esc(t('svc.count', {n: all.length})), counts.down ? bd(esc(t('svc.bad', {n: counts.down})), 'c-bad', true) : bd(esc(t('svc.allOk')), 'c-ok', true)) + `<div class="kpis sm" style="--n:5">
      ${kpi('svc.kTotal', G.roll(all.length, 'n'), esc(t('svc.kinds', {c: all.filter(s => s.kind === 'container').length, m: all.filter(s => s.kind === 'monitor').length, b: all.filter(s => s.kind === 'both').length})))}
      ${kpi('st.up', G.roll(counts.up, 'n'), esc(t('svc.ofAll', {p: all.length ? F.pct(counts.up / all.length) : '—'})), 'g')}
      ${kpi('st.down', G.roll(counts.down, 'n'), counts.down ? all.filter(s => s.status === 'down').slice(0, 3).map(s => G.Tplain(s.name)).map(esc).join(' · ') : esc(t('svc.allOk')), counts.down ? 'b' : '')}
      ${kpi('svc.kUp', ups.length ? G.roll(sum(ups) / ups.length / 100, 'pct1') : '—', esc(t('svc.monitored', {n: ups.length})), 'v')}
      ${kpi('svc.kMem', G.roll(sum(all.map(s => s.memBytes || 0)), 'bytes'), esc(t('svc.memOf', {n: all.filter(s => s.memBytes != null).length})), 'w')}
    </div>`, 'hero');

    h += G.grpH('02', 'svc.grpList');
    const machines = [...new Set(all.map(mkey))].sort();
    h += G.pn('s-list', G.ph('s-list', 'box', 'ok', esc(t('svc.all')), esc(t('svc.shown', {n: list.length, m: all.length})), esc(t('detail.hint'))) +
      `<div class="bar-f">${seg(STS.filter(s => s === 'all' || counts[s]).map(s => [s, esc(t(s === 'all' ? 'filter.all' : s === 'other' ? 'svc.other' : 'st.' + s)) + `<small>${F.n(counts[s])}</small>`]), stF, v => lk({st: v === 'all' ? null : v}))}
        ${machines.length > 1 ? `<span class="flab">${esc(t('svc.machine'))}</span>${seg([['\u0000all', esc(t('filter.all'))]].concat(machines.map(m => [m, m === NOM ? esc(t('svc.noMachine')) : esc(m)])), machF || '\u0000all', v => lk({machine: v === '\u0000all' ? null : v}))}` : ''}
        ${machF ? `<span class="bds" id="s-mf">${machF === NOM ? bd(esc(t('svc.noMachine')), 'c-dim') : G.mc(machF)} <a class="clear" href="${lk({machine: null})}">\u2715 ${esc(t('filter.clear'))}</a></span>` : ''}
        <span class="flab">${esc(t('filter.sort'))}</span>${seg(['status', 'name', 'up', 'cpu', 'mem'].map(s => [s, esc(t('sort.' + s))]), sort, v => lk({sort: v === 'status' ? null : v}))}
        <input class="search" id="s-q" type="search" value="${esc(params.get('q') || '')}" placeholder="${esc(t('svc.search'))}" aria-label="${esc(t('svc.search'))}"></div>` +
      (list.length ? `<table class="tb">${serviceRows(list)}</table>` : G.empty('filter.none')));
    G.after(() => { const el = G.$('s-q'); if(!el) return; let tm;
      el.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { const pos = el.selectionStart; history.replaceState(null, '', lk({q: el.value || null})); G.render(true); const n2 = G.$('s-q'); if(n2){ n2.focus(); try{ n2.setSelectionRange(pos, pos); }catch(e){} } }, 250); }); });
  }
  h += G.grpH(HID ? '02' : '03', 'svc.grpOps');
  const TN = D.tailnet, showTn = !D.hidden.has('tailnet');
  const jobsPn = G.pn('s-jobs', G.ph('s-jobs', 'clock', 'or', esc(t('job.title')), esc(t('job.count', {n: D.jobs.length})), D.jobs.some(j => !j.ok) ? bd(esc(t('job.failN', {n: D.jobs.filter(j => !j.ok).length})), 'c-bad', true) : '') + `<div id="sec-jobs"></div><table class="tb">${jobRows(D.jobs, true)}</table>`);
  const tnPn = showTn ? G.pn('s-tn', G.ph('s-tn', 'net', 'fg', esc(t('tn.title')), esc(t('tn.onlineN', {a: TN.filter(d => d.online).length, b: TN.length})), '') + (TN.length ? `<table class="tb"><tr><th>${esc(t('tn.device'))}</th><th>${esc(t('tn.os'))}</th><th>${esc(t('svc.status'))}</th><th class="v">${esc(t('mach.lastSeen'))}</th></tr>` +
    TN.slice().sort((a, b) => (b.online - a.online) || G.Tplain(a.name).localeCompare(G.Tplain(b.name))).map(d => `<tr><td class="n">${T(d.name)}</td><td class="k">${esc(d.os || '—')}</td><td>${bd(esc(t(d.online ? 'mach.online' : 'mach.offline')), d.online ? 'c-ok' : 'c-dim', true, '', d.online)}</td><td class="v" title="${esc(F.full(d.lastSeen))}">${d.online ? esc(t('time.now')) : esc(F.ago(d.lastSeen))}</td></tr>`).join('') + `</table>` : G.empty())) : '';
  h += tnPn ? `<div class="grid2 even">${jobsPn}${tnPn}</div>` : jobsPn;

  if(D.warnings){
    h += G.pn('s-warn', G.ph('s-warn', 'alert', D.warnings.length ? 'warn' : 'ok', esc(t('warn.title')), esc(t('warn.count', {n: D.warnings.length})), esc(t('warn.range'))) +
      (D.warnings.length ? `<table class="tb"><tr><th>${esc(t('warn.time'))}</th><th>${esc(t('warn.kind'))}</th><th class="hide-s">${esc(t('svc.machine'))}</th><th>${esc(t('warn.detail'))}</th></tr>` +
        D.warnings.map(w => `<tr><td class="k">${w.t ? esc(F.when(w.t)) : '—'}</td><td>${bd(G.lbl('wk.', w.kind), 'c-warn', true)}</td><td class="k hide-s">${w.machine ? G.mc(w.machine) : '—'}</td><td class="t m" style="font-size:11.5px">${esc(w.detail)}</td></tr>`).join('') + `</table>` : G.empty('warn.none')));
  }
  if(params.get('sec') === 'jobs') G.after(() => { const el = G.$('s-jobs'); if(el) el.scrollIntoView({block: 'start'}); });
  return h;
};

G.boot();
})();
</script>
