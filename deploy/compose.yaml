# glassbox deployment: hub + Tailscale sidecar + read-only Docker socket proxy.
#
# The host publishes NO ports. The only way in is the tailnet: the sidecar's `tailscale serve`
# forwards tailnet port 443 to the hub on 127.0.0.1 (shared network namespace). Tailscale
# Funnel is not enabled (see serve.json).
#
# Run from this directory:   docker compose up -d --build
# Secrets are plain files in ./secrets/ (git-ignored, mode 0600); see README.md.

name: glassbox

services:
  glassbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: glassbox-hub:local
    restart: unless-stopped
    network_mode: "service:tailscale"        # no network of its own, hence no published ports
    init: true
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true                        # recreate/restart of the sidecar restarts the hub (new netns); needs Compose >= 2.17
      docker-proxy:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      GLASSBOX_COLLECT_INTERVAL: "${GLASSBOX_COLLECT_INTERVAL:-300}"
    volumes:
      - glassbox-data:/data                                  # sqlite database; include in the host backup
      - ./hub.toml:/etc/glassbox/hub.toml:ro
      - tailscale-sock:/var/run/tailscale:ro                 # tailscaled socket for `tailscale status` (verify connect works on :ro before go-live)
    secrets:
      - github_token
      - gitea_main_token
      - gitea_second_token
      - beszel_password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  tailscale:
    # Pinned tag; bump to the current stable release and add the @sha256 digest when deploying.
    # BEFORE DEPLOY check against the official Tailscale container docs: TS_ENABLE_HEALTH_CHECK,
    # TS_LOCAL_ADDR_PORT, TS_SERVE_CONFIG and the containerboot path are written from memory.
    image: tailscale/tailscale:v1.78.1
    hostname: "${TS_HOSTNAME:-glassbox}"                     # becomes <hostname>.<TAILNET_NAME>.ts.net
    restart: unless-stopped
    # Outbound only: there is no `ports:` section anywhere in this file.
    # The auth key is read from a secret file, never written in this file.
    entrypoint: ["/bin/sh", "-c", "TS_AUTHKEY=\"$$(cat /run/secrets/ts_authkey 2>/dev/null || true)\" exec /usr/local/bin/containerboot"]
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"                                   # no /dev/net/tun, no NET_ADMIN
      TS_ACCEPT_DNS: "false"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: "${TS_EXTRA_ARGS:-}"                    # --advertise-tags=tag:glassbox (recommended)
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"                   # /healthz, reachable only inside the namespace
    volumes:
      - tailscale-state:/var/lib/tailscale                   # node identity survives restarts
      - tailscale-sock:/var/run/tailscale
      - ./serve.json:/config/serve.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"                  # reach Beszel / Uptime Kuma on the VM host
    cap_drop: [ALL]                                          # userspace mode needs no capabilities (verify on first start)
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    secrets:
      - ts_authkey

  docker-proxy:
    # Exact-path allowlist proxy: only GET /containers/json (optionally /vNN.NN/ prefixed) is
    # forwarded; inspect, logs, exec, archive, export and every write method answer 403, and only
    # the tailscale container (the hub shares its network namespace) may connect.
    # BEFORE DEPLOY check the flag names, the default port (2375) and the tag against the project's
    # documentation (wollomatic/socket-proxy): they are written from memory. Pin an exact tag
    # and digest at deploy time.
    image: wollomatic/socket-proxy:1
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?set DOCKER_GID in .env}"      # nobody, plus the group that owns the Docker socket
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=tailscale"
      - "-allowGET=^(/v[0-9.]+)?/containers/json$$"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # read_only and cap_drop are untested here. If the proxy fails to start, remove `read_only`
    # first, then `cap_drop`, and record which one was needed.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  glassbox-data:
  tailscale-state:
  tailscale-sock:

secrets:
  ts_authkey:
    file: ./secrets/ts_authkey
  github_token:
    file: ./secrets/github_token
  gitea_main_token:
    file: ./secrets/gitea_main_token
  gitea_second_token:
    file: ./secrets/gitea_second_token
  beszel_password:
    file: ./secrets/beszel_password
