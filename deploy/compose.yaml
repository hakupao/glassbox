# glassbox deployment: hub + Tailscale sidecar + Docker socket proxy (container listing only).
#
# The host publishes NO ports. The only way in is the tailnet: the sidecar's `tailscale serve`
# forwards tailnet port 443 to the hub on 127.0.0.1 (shared network namespace). Tailscale
# Funnel is not enabled (see serve.json).
#
# Deploy flow (README.md): the Gitea Actions workflow .gitea/workflows/glassbox.yml builds and
# pushes the image, then runs `docker compose -f deploy/compose.yaml up -d` on the VM with
#   GLASSBOX_IMAGE   image path without tag (Gitea repo variable IMAGE)
#   IMAGE_TAG        40-hex commit SHA
#   DOCKER_GID       group id of the Docker socket (the workflow reads it through the host daemon)
# Local build instead of a registry image: see compose.build.yaml.
#
# Everything private lives on the VM in ${GLASSBOX_DIR:-/opt/glassbox}, bind-mounted read-only and
# never created by compose (create_host_path: false, so a missing directory is an error, not an
# empty directory silently taking its place):
#   hub.toml, serve.json, ts_authkey (root only), secrets/<name> (one file per token)

name: glassbox

services:
  glassbox:
    image: "${GLASSBOX_IMAGE:?set GLASSBOX_IMAGE}:${IMAGE_TAG:?set IMAGE_TAG}"
    container_name: glassbox
    restart: unless-stopped
    network_mode: "service:tailscale"        # no network of its own, hence no published ports
    init: true
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true                        # recreate/restart of the sidecar restarts the hub (new netns); needs Compose >= 2.17
      docker-proxy:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      GLASSBOX_CONFIG: /run/glassbox/hub.toml
      GLASSBOX_SECRETS_DIR: /run/glassbox/secrets
      GLASSBOX_COLLECT_INTERVAL: "${GLASSBOX_COLLECT_INTERVAL:-300}"
    volumes:
      # sqlite in WAL mode needs real file locks and fsync: a named volume on the VM's own disk,
      # not a shared host folder. Include this volume in the backup.
      - glassbox-data:/data
      # Only what the hub needs: its config and the token files. ts_authkey is not visible here.
      - type: bind
        source: "${GLASSBOX_DIR:-/opt/glassbox}/hub.toml"
        target: /run/glassbox/hub.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${GLASSBOX_DIR:-/opt/glassbox}/secrets"
        target: /run/glassbox/secrets
        read_only: true
        bind:
          create_host_path: false
      - tailscale-sock:/var/run/tailscale:ro                 # tailscaled socket for `tailscale status` (verify connect works on :ro before go-live)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  tailscale:
    # Pinned tag + digest (current stable at first deploy, 2026-11-18). v1.78.1 crash-looped here:
    # containerboot exited with "failed running server: http: Server closed" right after applying
    # TS_SERVE_CONFIG with the health check enabled. Env names and the containerboot path were
    # checked against this image.
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: glassbox-tailscale
    hostname: "${TS_HOSTNAME:-glassbox}"                     # becomes <hostname>.<TAILNET_NAME>.ts.net
    restart: unless-stopped
    # Outbound only: there is no published-port section anywhere in this file.
    # The auth key is read from a file on the VM, never written in this file. Once the node has
    # joined, the state volume is enough (the file must still exist for the bind mount; it may be empty).
    entrypoint: ["/bin/sh", "-c", "TS_AUTHKEY=\"$$(cat /run/tsconfig/ts_authkey 2>/dev/null || true)\" exec /usr/local/bin/containerboot"]
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"                                   # no /dev/net/tun, no NET_ADMIN
      TS_ACCEPT_DNS: "false"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /run/tsconfig/serve.json
      # Tag only. Never add route or exit-node advertising here (the deploy test and the
      # workflow both fail on it).
      TS_EXTRA_ARGS: "${TS_EXTRA_ARGS:---advertise-tags=tag:glassbox}"
      TS_AUTH_ONCE: "true"                                   # use the auth key only when the node is not yet logged in
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"                   # /healthz, reachable only inside the namespace
    volumes:
      - tailscale-state:/var/lib/tailscale                   # node identity survives restarts and redeploys
      - tailscale-sock:/var/run/tailscale
      - type: bind
        source: "${GLASSBOX_DIR:-/opt/glassbox}/serve.json"
        target: /run/tsconfig/serve.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${GLASSBOX_DIR:-/opt/glassbox}/ts_authkey"
        target: /run/tsconfig/ts_authkey
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"                  # reach Beszel / Uptime Kuma on the VM host
    cap_drop: [ALL]                                          # userspace mode needs no capabilities (verify on first start)
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  docker-proxy:
    # Exact-path allowlist proxy: only GET /containers/json (optionally /vNN.NN/ prefixed) is
    # forwarded; inspect, logs, exec, archive, export and every write method answer 403, and only
    # the tailscale container (the hub shares its network namespace) may connect.
    # BEFORE DEPLOY check the flag names, the default port (2375) and the tag against the project's
    # documentation (wollomatic/socket-proxy): they are written from memory. Pin an exact tag
    # and digest at deploy time.
    image: wollomatic/socket-proxy:1
    container_name: glassbox-docker-proxy
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?set DOCKER_GID}"              # nobody, plus the group that owns the Docker socket
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=tailscale"
      - "-allowGET=^(/v[0-9.]+)?/containers/json$$"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # read_only and cap_drop are untested here. If the proxy fails to start, drop `read_only`
    # first, then `cap_drop`, and record which one was needed.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  glassbox-data:
  tailscale-state:
  tailscale-sock:
